<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>거믄 · 힌의 통계 — 조선의 목가구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
/* 거믄 힌의 통계 — 포털 전체 숫자, 거믄·힌 각자의 기록(좋아요·찾아본 기물·검색어·기물 이야기),
   수업 날 선생님께 여쭤볼 것. 가족 암호로 잠근다. 자료는 구글 시트(통계·기록·질문·방문·좋아요 탭). */
:root{--fg:#1d1b18;--muted:#756e65;--line:#e6e1d9;--paper:#fbfaf7;--ink:#111;--red:#d0312d;--gold:#fbf6e9;--gold-line:#e7d9b4}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--fg)}
body{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 90px}
a{color:inherit}
.hd{text-align:center;margin:26px 0 8px}
.hd .mk{display:inline-flex;font-weight:900;font-size:15px}.hd .mk span{display:inline-block;min-width:2.9em;padding:.12em .45em;border:1.5px solid #111;line-height:1.25}
.hd .mk .b{background:#111;color:#fff}.hd .mk .w{background:#fff;color:#111}
.hd h1{margin:12px 0 6px;font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(28px,4.4vw,42px);letter-spacing:-.03em}
.hd p{margin:0;color:var(--muted);font-weight:500}
.jump{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:16px 0 26px}
.jump a{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:14px;font-weight:700;background:#fff}
.jump a:hover{border-color:#111}.jump a.ask{background:var(--gold);border-color:var(--gold-line)}
.jump a small{font-weight:500;color:var(--muted);margin-left:3px}
h2.sec{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;white-space:nowrap;margin:34px 0 14px;font-size:21px;font-weight:900;letter-spacing:-.02em}
h2.sec small{font-size:13px;font-weight:500;color:var(--muted);white-space:normal}
/* 잠금 */
.lock{max-width:380px;margin:40px auto;text-align:center;border:1px solid var(--line);border-radius:18px;padding:30px 24px;background:var(--paper)}
.lock .ic{font-size:40px}.lock h2{margin:8px 0 4px;font-size:19px;font-weight:900}
.lock p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.6}
.lock input{font:inherit;font-size:22px;letter-spacing:.4em;text-align:center;width:180px;border:1.5px solid #cfc8bd;border-radius:10px;padding:10px;background:#fff}
.lock button{display:block;margin:14px auto 0;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;background:#111;color:#fff;padding:10px 26px;cursor:pointer}
.lock .err{color:#8a2f22;font-size:13.5px;margin-top:10px;min-height:1.2em}
.loading{text-align:center;color:var(--muted);padding:40px 0}
/* 한눈에 */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;background:#fff}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:700}
.tile .v{font-size:26px;font-weight:900;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
.tile.ask{background:var(--gold);border-color:var(--gold-line)}
.chart{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:14px 16px 10px}
.chart .t{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between}.chart .t span{font-weight:500;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:110px;padding-top:18px}
.bars div{position:relative;background:#1d1b18;border-radius:4px 4px 0 0;min-height:2px}
.bars div.z{background:#e6e1d9}
.bars div b{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;color:#3b3833}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;margin-top:4px}.days span{text-align:center;font-size:10.5px;color:var(--muted)}
@media (max-width:860px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}.bars,.days{gap:3px}.bars div b{font-size:9px}}
/* 거믄 · 힌 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.duo{grid-template-columns:1fr}}
.pc{border:1.5px solid #111;border-radius:18px;padding:18px 18px 8px;background:#fff}
.pc.h{background:#fff}.pc.g .ph{background:#111;color:#fff}
.ph{display:flex;align-items:center;gap:10px;margin:-18px -18px 14px;padding:14px 18px;border-radius:16px 16px 0 0;border-bottom:1.5px solid #111}
.ph b{font-size:22px;font-weight:900;letter-spacing:.04em}
.ph .ow{display:inline-block;min-width:2.9em;text-align:center;font-weight:900;font-size:13px;padding:2px 8px;border:1.5px solid currentColor;line-height:1.3}
.ph svg{width:22px;height:22px}
.ph .me{margin-left:auto;font-size:12px;font-weight:700;opacity:.7}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.nums div{text-align:center;background:var(--paper);border-radius:10px;padding:8px 2px}
.nums b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.nums span{font-size:11.5px;color:var(--muted);font-weight:700}
.blk{margin:0 0 16px}
.blk h3{display:flex;align-items:baseline;gap:6px;margin:0 0 8px;font-size:14.5px;font-weight:900}
.blk h3 small{font-weight:500;color:var(--muted);font-size:12px}
.blk h3 button{margin-left:auto;font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;color:#4a463f}
.th{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.th a{position:relative;display:block;aspect-ratio:1;border:1px solid #ece8e1;border-radius:8px;background:#f6f5f2;overflow:hidden}
.th a img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.th a span{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:1.3;background:rgba(0,0,0,.55);color:#fff;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th a i{position:absolute;top:2px;right:2px;font-style:normal;font-size:10px;font-weight:800;background:#1d1b18;color:#fff;border-radius:999px;padding:0 5px}
@media (max-width:480px){.th{grid-template-columns:repeat(4,1fr)}}
.empty{font-size:13px;color:var(--muted);margin:0;padding:6px 0}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.rank li{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:center;font-size:13px}
.rank li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank li i{display:block;height:8px;border-radius:4px;background:#1d1b18}
.pc.h .rank li i{background:#fff;border:1.5px solid #1d1b18}
.rank li b{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:#fff}
.chips a small{color:var(--muted);margin-left:3px}
.cms{display:flex;flex-direction:column;gap:8px}
.cm1{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;text-decoration:none}
.cm1 img{width:44px;height:44px;object-fit:contain;background:#f6f5f2;border-radius:6px;mix-blend-mode:multiply}
.cm1 div{font-size:13px;line-height:1.55;color:#2b2825;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm1 small{display:block;color:var(--muted);font-size:11.5px}
/* 선생님께 여쭤볼 것 */
.next{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--gold);border:1px solid var(--gold-line);border-radius:16px;padding:14px 18px;margin-bottom:14px}
.next b{font-family:"Noto Serif KR",serif;font-size:24px;font-weight:900}
.next .dd{font-size:13px;font-weight:900;color:#fff;background:#1d1b18;border-radius:6px;padding:2px 8px}
.next span{color:#6b5a2e;font-size:14px}
.next button{margin-left:auto;font:inherit;font-size:13.5px;font-weight:700;border:1px solid #d9c99c;background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.qform{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px;background:#fff}
.qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1.5px solid #111;border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:800;border:0;background:#fff;padding:6px 16px;cursor:pointer}
.seg button+button{border-left:1.5px solid #111}
.seg button.on[data-w="거믄"]{background:#111;color:#fff}.seg button.on[data-w="힌"]{box-shadow:inset 0 0 0 3px #111}
.qform select{font:inherit;font-size:14px;border:1px solid #d9d4cc;border-radius:999px;padding:6px 12px;background:#fff;max-width:100%}
.qform textarea{width:100%;min-height:84px;font:inherit;font-size:15px;line-height:1.65;border:1px solid #d9d4cc;border-radius:10px;padding:10px 12px;resize:vertical}
.qform .go{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;background:#111;color:#fff;padding:9px 22px;cursor:pointer;margin-left:auto}
.qform .go:disabled{opacity:.5}
.qform .hint{font-size:12.5px;color:var(--muted)}
.cls{margin:0 0 18px}
.cls h3{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font-size:16px;font-weight:900}
.cls h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
.cls.past h3{color:#6b665e}
.ql{display:flex;flex-direction:column;gap:8px}
.qi{display:grid;grid-template-columns:auto 1fr;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.qi.done{background:#faf9f6}
.qi .ck{width:26px;height:26px;border-radius:50%;border:2px solid #cfc8bd;background:#fff;cursor:pointer;display:grid;place-items:center;padding:0;margin-top:2px;font-size:14px;color:#fff}
.qi.done .ck{background:#2f6b45;border-color:#2f6b45}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ow2{display:inline-block;min-width:2.9em;text-align:center;font-weight:900;font-size:12px;padding:1px 7px;border:1.5px solid #111;line-height:1.35;color:#111}
.ow2.g{background:#111;color:#fff}
.qh .from{color:#6b5a2e;background:var(--gold);border:1px solid var(--gold-line);border-radius:999px;padding:0 7px;font-weight:700}
.qt{font-size:15.5px;line-height:1.7;margin:4px 0 0;white-space:pre-wrap}
.qi.done .qt{color:#6b665e}
.qobj{display:inline-flex;align-items:center;gap:8px;margin-top:8px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 4px;font-size:13px;background:var(--paper)}
.qobj img{width:36px;height:36px;object-fit:contain;mix-blend-mode:multiply;background:#f0eee9;border-radius:6px}
.qans{margin-top:8px;border-left:3px solid #2f6b45;background:#f3f8f4;border-radius:0 10px 10px 0;padding:8px 12px;font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.qans b{display:block;font-size:12px;color:#2f6b45;margin-bottom:2px}
.qact{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.qact button{font:inherit;font-size:12.5px;border:0;background:none;color:#8a837a;cursor:pointer;padding:0}
.qact button:hover{color:#1d1b18}.qact .del:hover{color:#8a2f22}
.qed textarea{width:100%;min-height:70px;font:inherit;font-size:14.5px;line-height:1.6;border:1px solid #d9d4cc;border-radius:8px;padding:8px 10px;margin-top:8px}
.qed .r{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.qed button{font:inherit;font-size:13px;border:1px solid #d9d4cc;background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer}.qed .ok{background:#1d1b18;color:#fff;border-color:#1d1b18;font-weight:700}
.past-t{font:inherit;font-size:13.5px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;color:#4a463f}
.note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:26px;text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1d1b18;color:#fff;font-size:14px;padding:9px 16px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}
/* 수업 마치고 정리 */
.wrap-go{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;font:inherit;font-size:16px;font-weight:900;text-align:left;border:1.5px solid #2f6b45;background:#f3f8f4;color:#1f4d31;border-radius:14px;padding:12px 16px;margin:0 0 14px;cursor:pointer}
.wrap-go small{font-size:12.5px;font-weight:500;color:#4f7a5e}
.wrapup{border:1.5px solid #2f6b45;border-radius:16px;padding:14px 16px 16px;margin:-6px 0 18px;background:#fff}
.wu-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.wu-h b{font-size:17px;font-weight:900;margin-right:4px}
.wu-h select{font:inherit;font-size:14px;border:1px solid #d9d4cc;border-radius:999px;padding:6px 12px;background:#fff}
.wu-x{margin-left:auto;font:inherit;border:0;background:none;font-size:18px;cursor:pointer;color:#8a837a}
.wu-tip{font-size:12.5px;color:var(--muted);line-height:1.6;margin:8px 0 4px}
.wrapup h4{margin:16px 0 8px;font-size:14.5px;font-weight:900}.wrapup h4 small{font-weight:500;color:var(--muted);font-size:12px}
.wu-q{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--paper)}
.wu-q p{margin:4px 0 6px;font-size:15px;line-height:1.6;white-space:pre-wrap}
.wu-q textarea,.wu-memo{width:100%;min-height:64px;font:inherit;font-size:15px;line-height:1.6;border:1px solid #cfdccf;border-radius:8px;padding:8px 10px;background:#fff;resize:vertical}
.wu-x2 input{width:100%;font:inherit;font-size:15px;border:1px solid #d9d4cc;border-radius:8px;padding:8px 10px;margin-bottom:6px}
.wu-memo{min-height:110px}
.wu-more{font:inherit;font-size:13px;font-weight:700;border:1px dashed #b9b1a4;background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;color:#4a463f}
.wu-foot{display:flex;align-items:center;gap:10px;margin-top:12px}.wu-foot a{font-size:13px;color:#2f6b45;font-weight:700}
.wu-foot .go{margin-left:auto;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;background:#2f6b45;color:#fff;padding:10px 20px;cursor:pointer}.wu-foot .go:disabled{opacity:.55}
.qobj em{font-style:normal;font-size:12px;color:#8a837a;margin-left:4px}
/* 지금까지 수업 정리 */
.ls-top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.ls-top div{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.ls-top b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}.ls-top span{font-size:12px;color:var(--muted);font-weight:700}
.ls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.ls{grid-template-columns:1fr}}
.lsd{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:10px}
.lsd-h{display:flex;align-items:baseline;gap:8px}.lsd-h b{font-family:"Noto Serif KR",serif;font-size:20px;font-weight:900}.lsd-h small{color:var(--muted);font-size:12px}
.lsd-h .no{font-size:11.5px;color:#fff;background:#111;border-radius:6px;padding:1px 7px;font-weight:900}
.lsn,.lsq{display:block;text-decoration:none;border-radius:12px;padding:10px 12px;background:var(--paper)}
.lsn:hover,.lsq:hover{box-shadow:inset 0 0 0 1.5px #111}
.lsn h4{margin:6px 0 4px;font-size:15px;font-weight:900;line-height:1.45}
.lsn p{margin:0;font-size:13.5px;line-height:1.6;color:#3b3833;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lss{list-style:none;margin:6px 0 0;padding:0;font-size:13px;line-height:1.55;color:#5a4a1e}.lss li{margin:2px 0}
.lst{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.lst span{font-size:11.5px;font-weight:700;background:#efece6;border-radius:6px;padding:1px 7px;color:#4a463f}
.lsq{background:#f3f8f4}.lsq p{margin:6px 0 0;font-size:13.5px;line-height:1.6;color:#2b2825;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.lsq p.more{color:var(--muted)}
.lsq b{color:#2f6b45}
#ses-more{margin-top:12px}
/* 사진 창 (통계 안에서) */
#dlg{border:none;border-radius:18px;padding:0;width:min(1100px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#dlg::backdrop{background:rgba(20,20,24,.55)}
.d-body{display:flex;gap:24px;padding:22px;max-height:calc(92vh - 64px);overflow:auto}
.d-img{flex:1 1 60%;display:grid;place-items:center;min-height:300px;background:#fafaf8;border-radius:12px}
.d-img img{max-width:100%;max-height:72vh;object-fit:contain}
.d-info{flex:1 1 40%;min-width:220px}
.d-info .cat{color:#3550c8;font-weight:700;font-size:14px}
.d-info h3{margin:4px 0 12px;font-size:28px;font-weight:900;letter-spacing:-.04em}.d-info h3 small{font-size:16px;color:var(--muted);font-weight:500;margin-left:8px}
.d-info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px;font-size:15px}.d-info dt{color:var(--muted)}.d-info dd{margin:0}
.d-book{display:inline-block;margin-top:6px;color:#fff;background:var(--fg);text-decoration:none;font-weight:700;font-size:14px;border-radius:10px;padding:10px 16px}
.d-ask{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}.d-ask1{background:var(--gold);border:1px solid var(--gold-line);border-radius:12px;padding:9px 12px}.d-ask1 p{margin:4px 0 0;font-size:14.5px;line-height:1.6;white-space:pre-wrap}.d-ask1 small{font-size:12px;color:#2f6b45;font-weight:700;margin-left:6px}
.d-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.d-foot button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--fg)}.d-foot button:disabled{opacity:.35}
.d-r{display:flex;gap:8px}
@media (max-width:720px){.d-body{flex-direction:column;padding:14px}.d-img{min-height:220px}.d-foot{padding:10px 12px}}
/* 수업용 인쇄: 다음 수업 질문만 */
@media print{
  body.pr .hd,body.pr #app > *:not(#ask-sec){display:none!important}
  body.pr #ask-sec .qform,body.pr .wrap-go,body.pr .wrapup,body.pr #ask-sec .next button,body.pr .qact,body.pr .past-t,body.pr .cls:not(.now),body.pr #rv,body.pr .st-top{display:none!important}
  body.pr .qi{break-inside:avoid;border-color:#999}
  #rv,#lk-box{display:none!important}
}

<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyQoDpYNaIA034Inb2J-SaW5-dhstcZQBJWOug7FxJKnP-evddQtprYUontg5GlSvkyBA/exec';
  var K_CODE = 'mokgagu_cm_code', K_FAM = 'mokgagu_cm_fam', K_WHO = 'mokgagu_cm_who', K_STUDY = 'mokgagu_study_pw';
  var K_CACHE = 'mokgagu_stats_cache_v1', K_SCACHE = 'mokgagu_stats_study_v1';
  var ls = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    json: function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  };
  var app = document.getElementById('app');
  var D = null, IX = {}, BOOK = {}, past = false, editId = '', ansId = '', formWho = '', draft = '', qpics = [], qbusy = '', pending = false, SES = null, sesOpen = false;
  /* 수업 마치고 정리하는 창 */
  var W = { open: false, cls: '', ans: {}, extra: [{ q: '', a: '' }], memo: null, saving: false };
  var SP = 'M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z';
  function star(w) { return '<svg viewBox="0 0 24 24" width="16" height="16" style="flex:none"><path d="' + SP + '" fill="' + (w === '거믄' ? '#d0312d' : '#fff') + '" stroke="#d0312d" stroke-width="' + (w === '거믄' ? 1.6 : 2.2) + '" stroke-linejoin="round"/></svg>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fmt(n) { return Number(n || 0).toLocaleString('ko-KR'); }
  function toast(t) { var e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(function () { e.classList.remove('on'); }, 2200); }
  function fam() { return ls.get(K_FAM) === '1' && !!ls.get(K_CODE); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function isMemo(q) { return String(q.id).indexOf('memo_') === 0; }

  /* 날짜 · 수업일 (classes.js 한 곳에서: 둘째·넷째 토요일 + 빠진 날·옮긴 날) */
  var CL = window.MOKGAGU_CLASS;
  function today() { return CL.today(); }
  function upcoming(n) { return CL.upcoming(n); }
  /* 오늘까지 지난 수업일 (최근 것부터) */
  function recentClasses(n) {
    var t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7) - 1, out = [], guard = 0;
    while (out.length < n && guard++ < 24) { CL.days(y, m).slice().reverse().forEach(function (d) { if (d <= t && out.length < n && out.indexOf(d) < 0) out.push(d); }); m--; if (m < 0) { m = 11; y--; } }
    return out;
  }
  function md(d) { if (!d) return '날짜 없음'; var x = new Date(d + 'T00:00:00Z'); return (x.getUTCMonth() + 1) + '월 ' + x.getUTCDate() + '일'; }
  function mdw(d) { var x = new Date(d + 'T00:00:00Z'); return md(d) + '(' + '일월화수목금토'[x.getUTCDay()] + ')'; }
  function dday(d) { var n = Math.round((new Date(d + 'T00:00:00Z') - new Date(today() + 'T00:00:00Z')) / 864e5); return n === 0 ? '오늘' : n > 0 ? 'D-' + n : (-n) + '일 전'; }
  function ago(iso) { if (!iso) return ''; var t = new Date(iso), k = new Date(t.getTime() + 9 * 3600e3).toISOString(); return (+k.slice(5, 7)) + '/' + (+k.slice(8, 10)) + ' ' + k.slice(11, 16); }

  /* 기물 찾기 (검색 색인) — 색인이 늦게 와도 화면은 먼저 그린다 */
  function rec(cid) { return IX[cid]; }
  function thumb(cid) { var r = rec(cid); return r && r.t ? 'thumbs/' + r.b + '/' + r.n + '.jpg' : ''; }
  function name(cid) { var r = rec(cid); return r ? r.name : String(cid || '').split('/').pop(); }
  function link(cid) { return 'index.html#see=' + String(cid).split('/').map(encodeURIComponent).join('/'); }
  function thA(cid, badge, grp) { return '<a href="' + link(cid) + '" data-seq="' + grp + '" data-k="' + esc(cid) + '" title="' + esc(name(cid)) + '">' + (thumb(cid) ? '<img loading="lazy" src="' + thumb(cid) + '" alt="">' : '') + (badge ? '<i>' + badge + '</i>' : '') + '<span>' + esc(name(cid)) + '</span></a>'; }

  /* ── 잠금 ── */
  function lock(msg) {
    app.innerHTML = '<div class="lock"><div class="ic">🔒</div><h2>가족 암호를 넣어 주세요</h2><p>공부방과 같은 암호예요.<br>이 기기에 기억해 둡니다.</p>' +
      '<input id="lk-code" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"><button id="lk-go">열기</button><div class="err">' + esc(msg || '') + '</div></div>';
    var go = function () {
      var v = document.getElementById('lk-code').value.trim(); if (!v) return;
      document.getElementById('lk-go').disabled = true;
      fetch(API, { method: 'POST', body: JSON.stringify({ action: 'list', code: v }) }).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.fam) { ls.set(K_CODE, v); ls.set(K_FAM, '1'); if (window.MOKGAGU_COMMENTS) window.MOKGAGU_COMMENTS.reload(); load(); }
        else lock('가족 암호가 맞지 않아요.');
      }).catch(function () { lock('인터넷 연결을 확인해 주세요.'); });
    };
    document.getElementById('lk-go').onclick = go;
    document.getElementById('lk-code').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }

  /* ── 자료 불러오기 ──
     빠르게: ① 이 기기에 저장해 둔 지난 자료로 곧바로 그리고 ② 시트에는 통계 한 번만 묻는다.
     기물 이야기는 comments.js 가, 방문 수는 visit.js 가 이미 받아 오므로 그것을 함께 쓴다. */
  function comments() {
    var L = window.MOKGAGU_COMMENTS ? window.MOKGAGU_COMMENTS.list() : (ls.json('mokgagu_cm_cache_v2') || []).filter(function (c) { return !c.del; });
    return L.filter(function (c) { return c && c.cid; });
  }
  function setD(j) {
    var all = (j.questions || []).slice();
    D = { logs: j.logs || [], likes: j.likes || [], visits: j.visits || [], all: all,
      questions: all.filter(function (q) { return !isMemo(q); }), memos: all.filter(isMemo), comments: comments() };
  }
  function saveCache() {
    if (!D) return;
    ls.set(K_CACHE, JSON.stringify({ ok: true, logs: D.logs.slice(-1500), likes: D.likes, visits: D.visits, questions: D.questions.concat(D.memos) }));
  }
  function load() {
    if (!fam()) {
      /* 공부방에서 넣어 둔 암호가 있으면 잠금 화면 없이 확인한 뒤 연다 */
      var sp = ls.get(K_STUDY);
      if (sp && !load._tried) {
        load._tried = 1; app.innerHTML = '<p class="loading">확인 중…</p>';
        fetch(API, { method: 'POST', body: JSON.stringify({ action: 'list', code: sp }) }).then(function (r) { return r.json(); }).then(function (j) {
          if (j && j.fam) { ls.set(K_CODE, sp); ls.set(K_FAM, '1'); load(); } else lock();
        }).catch(function () { lock('인터넷 연결을 확인해 주세요.'); });
        return;
      }
      lock(); return;
    }
    if (!D) { var c = ls.json(K_CACHE); if (c && c.ok) { setD(c); draw(); } else app.innerHTML = '<p class="loading">불러오는 중…</p>'; }
    fetch(API, { method: 'POST', body: JSON.stringify({ action: 'stats', code: ls.get(K_CODE) }) }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) {
        if (j && j.err === 'code') { ls.set(K_FAM, ''); lock('가족 암호를 다시 넣어 주세요.'); return; }
        if (!D) app.innerHTML = '<p class="loading">통계를 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>'; return;
      }
      setD(j); fixSkipped(); redraw(); importAsks();
    }).catch(function () { if (!D) app.innerHTML = '<p class="loading">인터넷 연결을 확인해 주세요.</p>'; else toast('인터넷이 끊겨 저장해 둔 자료를 보여 드려요'); });
    if (!load._once) {
      load._once = 1;
      waitIndex().then(function () { if (D) redraw(); });
      if (window.MOKGAGU_COMMENTS) window.MOKGAGU_COMMENTS.onChange(function () { if (!D) return; D.comments = comments(); redraw(); importAsks(); });
      loadStudy();
    }
  }
  function waitIndex() {
    return new Promise(function (res) {
      (function chk(n) {
        if (window.SEARCH) { window.SEARCH.forEach(function (r) { IX[r.b + '/' + r.pid] = r; BOOK[r.b] = r.cat; }); return res(); }
        if (n > 300) return res(); setTimeout(function () { chk(n + 1); }, 100);
      })(0);
    });
  }
  /* 글을 쓰는 중이면 화면을 다시 그리지 않고, 다 쓰고 나서 그린다 */
  function typing() { var a = document.activeElement; return !!(a && app.contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)); }
  function redraw() { if (typing() || editId || ansId) { pending = true; return; } pending = false; draw(); }
  app.addEventListener('focusout', function () { setTimeout(function () { if (pending && !typing() && !editId && !ansId) { pending = false; draw(); } }, 150); });

  /* ── 한 사람 정리 ── */
  function person(w) {
    var likes = D.likes.filter(function (x) { return x.who === w; }).sort(function (a, b) { return String(b.t).localeCompare(a.t); });
    var views = D.logs.filter(function (x) { return x.who === w && x.kind === 'view' && x.cid; });
    var seen = {}, order = [];
    views.slice().reverse().forEach(function (x) { if (!seen[x.cid]) { seen[x.cid] = 0; order.push(x.cid); } seen[x.cid]++; });
    var books = {}; views.forEach(function (x) { var b = x.cid.split('/')[0]; books[b] = (books[b] || 0) + 1; });
    var qs = {}; D.logs.forEach(function (x) { if (x.who === w && x.kind === 'search' && x.q) qs[x.q] = (qs[x.q] || 0) + 1; });
    var cms = D.comments.filter(function (c) { return c.author === w; }).sort(function (a, b) { return String(b.t).localeCompare(a.t); });
    var ask = D.questions.filter(function (q) { return q.who === w; });
    var cmps = [], gone = {}; D.logs.forEach(function (x) { if (x.who === w && x.kind === 'compare' && String(x.q).indexOf('__del__|') === 0) gone[String(x.q).slice(8)] = 1; });
    D.logs.forEach(function (x) { if (x.who !== w || x.kind !== 'compare' || !x.cid || String(x.q).indexOf('__del__') === 0 || gone[x.t]) return; cmps.push(x); }); cmps.reverse();   /* 지운 비교는 q='__del__|<그 기록의 시각>' 기록으로 한 건씩 표시 */   /* 지운 비교는 q='__del__' 기록으로 표시 */
    return { cmps: cmps, likes: likes, order: order, seen: seen, books: books, qs: qs, cms: cms, ask: ask };
  }
  var SEQ = {};   /* 사진 창에서 좌우로 넘길 목록들 */
  var BEOT_OPEN = false;
  document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('#beot-btn')) { BEOT_OPEN = !BEOT_OPEN; draw(); } });
  function pcHTML(w) {
    var P = person(w), me = window.MOKGAGU_LIKES && window.MOKGAGU_LIKES.me && window.MOKGAGU_LIKES.me();
    var bk = Object.keys(P.books).sort(function (a, b) { return P.books[b] - P.books[a]; }).slice(0, 5), mx = bk.length ? P.books[bk[0]] : 1;
    var qk = Object.keys(P.qs).sort(function (a, b) { return P.qs[b] - P.qs[a]; }).slice(0, 14);
    var gl = 'likes-' + w, gv = 'views-' + w, gc = 'cms-' + w;
    SEQ[gl] = { from: 'likes', label: w + '의 좋아요', list: P.likes.map(function (x) { return x.cid; }) };
    SEQ[gv] = { from: 'views', label: w + '가 찾아본 기물', list: P.order.slice() };
    SEQ[gc] = { from: 'cms', label: w + '의 기물 이야기', list: P.cms.map(function (c) { return c.cid; }).filter(function (c, i, a) { return a.indexOf(c) === i; }) };
    return '<div class="pc ' + (w === '거믄' ? 'g' : 'h') + '"><div class="ph">' + star(w) + '<b>' + w + '</b>' + (me === w ? '<span class="me">이 기기</span>' : '') + '</div>' +
      '<div class="nums"><div><b>' + P.likes.length + '</b><span>좋아요</span></div><div><b>' + P.order.length + '</b><span>찾아본 기물</span></div><div><b>' + Object.keys(P.qs).length + '</b><span>검색어</span></div><div><b>' + P.cms.length + '</b><span>기물 이야기</span></div><div><b>' + P.ask.filter(function (q) { return !q.done; }).length + '</b><span>남은 질문</span></div></div>' +
      '<div class="blk"><h3>' + star(w) + ' 좋아요 한 기물 <small>' + P.likes.length + '점</small>' + (P.likes.length ? '<button type="button" data-col="' + w + '">모아보기</button>' : '') + '</h3>' +
        (P.likes.length ? '<div class="th">' + P.likes.slice(0, 12).map(function (x) { return thA(x.cid, '', gl); }).join('') + '</div>' : '<p class="empty">아직 별을 단 기물이 없어요.</p>') + '</div>' +
      '<div class="blk"><h3>👀 최근 찾아본 기물 <small>' + P.order.length + '점</small></h3>' +
        (P.order.length ? '<div class="th">' + P.order.slice(0, 12).map(function (c) { return thA(c, P.seen[c] > 1 ? P.seen[c] + '번' : '', gv); }).join('') + '</div>' : '<p class="empty">이 기능을 켠 뒤로 찾아본 기물이 여기 쌓여요.</p>') + '</div>' +
      '<div class="blk"><h3>⚖️ 나란히 비교해 본 기물 <small>' + P.cmps.length + '번</small></h3>' +
        (P.cmps.length ? '<div class="cmps">' + P.cmps.slice(0, 8).map(function (x) {
          var ks = x.cid.split(' '), nm = (x.q || '').split(' | ');
          return '<div class="cmp1"><button type="button" class="cmp-x" data-delcmp="' + esc(x.t) + '" data-cid="' + esc(x.cid) + '" data-w="' + w + '" aria-label="이 비교 기록 지우기">✕ 지우기</button><div class="cmp-h">' + ago(x.t) + '</div><div class="th">' + ks.map(function (k, i) { return k.indexOf('col/') === 0 ? '<span class="cmpc" title="소장품">' + esc(nm[i] || '소장품') + '</span>' : thA(k, '', 'cmp-' + w); }).join('') + '</div><div class="cmp-n">' + esc(nm.join(' · ')) + '</div>' + (ks.some(function (k) { return k.indexOf('col/') === 0; }) ? '' : '<button type="button" data-recmp="' + esc(x.cid) + '">다시 비교하기</button>') + '</div>';
        }).join('') + '</div>' : '<p class="empty">아직 나란히 비교해 본 기물이 없어요. 기물 사진 창의 「비교에 담기」로 시작해요.</p>') + '</div>' +
      '<div class="blk"><h3>📚 많이 본 도록</h3>' +
        (bk.length ? '<ul class="rank">' + bk.map(function (b) { return '<li><span>' + esc(BOOK[b] || b) + '</span><i style="width:' + Math.max(6, P.books[b] / mx * 100) + '%"></i><b>' + P.books[b] + '번</b></li>'; }).join('') + '</ul>' : '<p class="empty">아직 기록이 없어요.</p>') + '</div>' +
      '<div class="blk"><h3>🔍 찾아본 말</h3>' +
        (qk.length ? '<div class="chips">' + qk.map(function (q) { return '<a href="index.html#q=' + encodeURIComponent(q) + '">' + esc(q) + (P.qs[q] > 1 ? '<small>' + P.qs[q] + '</small>' : '') + '</a>'; }).join('') + '</div>' : '<p class="empty">첫 화면이나 도록 안 검색창에 적은 말이 여기 쌓여요.</p>') + '</div>' +
      '<div class="blk"><h3>💬 최근 기물 이야기 <small>' + P.cms.length + '개</small></h3>' +
        (P.cms.length ? '<div class="cms">' + P.cms.slice(0, 4).map(function (c) { return '<a class="cm1" href="' + link(c.cid) + '" data-seq="' + gc + '" data-k="' + esc(c.cid) + '">' + (thumb(c.cid) ? '<img src="' + thumb(c.cid) + '" alt="">' : '<span></span>') + '<div><small>' + esc(name(c.cid)) + ' · ' + ago(c.t) + '</small>' + esc(c.text) + '</div></a>'; }).join('') + '</div>' : '<p class="empty">아직 남긴 이야기가 없어요.</p>') + '</div>' +
      '</div>';
  }

  document.addEventListener('click', function (e) {
    var dx = e.target.closest && e.target.closest('[data-delcmp]');
    if (dx) {
      var tt = dx.getAttribute('data-delcmp'), cid = dx.getAttribute('data-cid'), who = dx.getAttribute('data-w');
      D.logs.push({ t: new Date().toISOString(), who: who, kind: 'compare', cid: cid, q: '__del__|' + tt }); draw();
      post({ action: 'log', who: who, kind: 'compare', cid: cid, q: '__del__|' + tt, page: 'stats.html' }).then(function (ok) { if (!ok) toast('지우지 못했어요. 다시 눌러 주세요'); });
      return;
    }
    var b = e.target.closest && e.target.closest('[data-recmp]'); if (!b) return;
    var ks = b.dataset.recmp.split(' '); try { localStorage.setItem('mokgagu_cmp', JSON.stringify(ks.map(function (k) { return { k: k, n: name(k) || '', u: '' }; }))); } catch (x) {}
    window.open('compare.html', '_blank', 'noopener');
  });
  /* ── 선생님께 여쭤볼 것 ── */

  /* ── 지금까지 수업 정리 (공부방 노트 + 선생님 말씀) ── */
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function loadStudy() {
    SES = ls.json(K_SCACHE);
    var pw = ls.get(K_STUDY) || ls.get(K_CODE);
    if (!pw || !window.crypto || !crypto.subtle) return;
    var st = function () { return new Promise(function (r) { setTimeout(r, 400); }); };   // 첫 화면부터 그린 뒤에 푼다
    st().then(function () { return fetch('study/salt.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }); }).then(function (meta) {
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      });
    }).then(function (key) {
      return fetch('study/data.bin', { cache: 'no-cache' }).then(function (r) { return r.arrayBuffer(); }).then(function (ab) { var u = new Uint8Array(ab); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12)); });
    }).then(function (plain) {
      var data = JSON.parse(new TextDecoder().decode(plain));
      var S = (data.sessions || []).map(function (s) {
        var tmp = document.createElement('div'); tmp.innerHTML = s.body || '';
        var heads = [].slice.call(tmp.querySelectorAll('h3')).map(function (x) { return x.textContent.trim(); }).filter(Boolean).slice(0, 8);

      });

  }

  function focusHTML() {

    D.logs.forEach(function (x) {

      if (x.kind === 'compare' && x.cid && String(x.q).indexOf('__del__') !== 0 && !gone[x.t]) {
        var ks = String(x.cid).split(' ').filter(Boolean); ks.forEach(function (k) { add(k, 2); });
        for (var i = 0; i < ks.length; i++) for (var j = i + 1; j < ks.length; j++) { var key = [ks[i], ks[j]].sort().join(' '); P[key] = (P[key] || 0) + 1; }
      }
    });
    var kk = Object.keys(K).sort(function (a, b) { return K[b] - K[a]; }).slice(0, 8), mx = kk.length ? K[kk[0]] : 1;
    var pp = Object.keys(P).filter(function (k) { return P[k] > 1; }).sort(function (a, b) { return P[b] - P[a]; }).slice(0, 5);
    function nm(k) { var r = rec(k); return r ? r.name : (k.indexOf('col/') === 0 ? '소장품' : k); }
    return '<div class="blk"><h3>🔎 수업에서 눈여겨본 기종 <small>찾아본 횟수 + 비교(2배)</small></h3>' +
      (kk.length ? '<ul class="rank">' + kk.map(function (k) { return '<li><span>' + esc(k) + '</span><i style="width:' + Math.max(6, K[k] / mx * 100) + '%"></i><b>' + K[k] + '</b></li>'; }).join('') + '</ul>' : '<p class="empty">찾아보거나 비교한 기록이 쌓이면 여기 나와요.</p>') + '</div>' +
      (pp.length ? '<div class="blk"><h3>⚖️ 자주 같이 비교한 기물</h3><ul class="rank">' + pp.map(function (k) { var a = k.split(' '); return '<li><span>' + esc(nm(a[0])) + ' · ' + esc(nm(a[1])) + '</span><i style="width:' + Math.max(6, P[k] / P[pp[0]] * 100) + '%"></i><b>' + P[k] + '번</b></li>'; }).join('') + '</ul></div>' : '');
  }
  function topHTML() {
    var t = today(), V = {}; (D.visits || []).forEach(function (v) { V[v.day] = v.n; });
    var vt = ls.json('mokgagu_visit_last') || {};
    if (vt.day === t) V[t] = Math.max(V[t] || 0, vt.today || 0);
    var days = []; for (var i = 13; i >= 0; i--) days.push(new Date(new Date(t + 'T00:00:00Z').getTime() - i * 864e5).toISOString().slice(0, 10));
    var mx = Math.max.apply(null, days.map(function (d) { return V[d] || 0; }).concat([1]));
    var likeSet = {}; D.likes.forEach(function (x) { likeSet[x.cid] = 1; });
    var books = {}; (window.SEARCH || []).forEach(function (r) { books[r.b] = 1; });
    var nx = upcoming(1)[0], left = D.questions.filter(function (q) { return !q.done && (q.cls || nx) >= t; }).length;
    var vs = D.logs.filter(function (x) { return x.kind === 'view'; }).length;
    var total = vt.total || (D.visits || []).reduce(function (s, v) { return s + v.n; }, 0);
    return '<div class="tiles">' +
      '<div class="tile"><div class="k">오늘 방문</div><div class="v">' + fmt(V[t] || 0) + '</div><div class="s">누적 ' + fmt(total) + '</div></div>' +
      '<div class="tile"><div class="k">도록 · 자료</div><div class="v">' + (window.SEARCH ? Object.keys(books).length : '…') + '</div><div class="s">기물 ' + (window.SEARCH ? fmt(window.SEARCH.length) + '점' : '세는 중') + '</div></div>' +
      '<div class="tile"><div class="k">좋아요 한 기물</div><div class="v">' + Object.keys(likeSet).length + '</div><div class="s">별 ' + D.likes.length + '개</div></div>' +
      '<div class="tile"><div class="k">찾아본 횟수</div><div class="v">' + fmt(vs) + '</div><div class="s">검색 ' + D.logs.filter(function (x) { return x.kind === 'search'; }).length + '번</div></div>' +
      '<div class="tile"><div class="k">기물 이야기</div><div class="v">' + D.comments.length + '</div><div class="s">거믄 ' + D.comments.filter(function (c) { return c.author === '거믄'; }).length + ' · 힌 ' + D.comments.filter(function (c) { return c.author === '힌'; }).length + '</div></div>' +
      '<div class="tile ask"><div class="k">여쭤볼 것</div><div class="v">' + left + '</div><div class="s">' + md(nx) + ' 수업</div></div></div>' +
      '<div class="chart"><div class="t">최근 14일 방문<span>한 기기는 하루 한 번만 셉니다</span></div><div class="bars">' +
      days.map(function (d) { var n = V[d] || 0; return '<div class="' + (n ? '' : 'z') + '" style="height:' + (n ? Math.max(6, n / mx * 100) : 2) + '%" title="' + d + ' · ' + n + '명">' + (n ? '<b>' + n + '</b>' : '') + '</div>'; }).join('') +
      '</div><div class="days">' + days.map(function (d) { return '<span>' + (+d.slice(8, 10)) + '</span>'; }).join('') + '</div></div>';
  }

  function draw() {
    if (!D) return;
    var sy = window.scrollY;
    var nx = upcoming(1)[0], left = D.questions.filter(function (q) { return !q.done && (q.cls || nx) === nx; }).length;
    app.innerHTML = '<div class="jump"><a href="#all">한눈에</a><a href="#les">수업 정리</a><a href="#duo">거믄 · 힌</a><a class="ask" href="#ask">✎ ' + md(nx) + ' 수업 질문<small>' + left + '</small></a></div>' +
      '<section id="all"><h2 class="sec">한눈에</h2>' + topHTML() + focusHTML() + '</section>' +
      '<section id="les-sec"><h2 class="sec" id="les">지금까지 수업 정리 <small>공부방 노트와 수업 뒤 적은 선생님 말씀 — 누르면 공부방으로</small></h2>' + lessonsHTML() + '</section>' +
      '<section id="ask-sec"><h2 class="sec" id="ask">선생님께 여쭤볼 것 <small>수업 — 보통 둘째·넷째 토요일' + changedNote() + '</small></h2>' + askHTML() + '</section>' +
      '<section id="duo"><h2 class="sec">거믄 · 힌 <small>각자 남긴 기록 — 좋아요, 찾아본 기물, 검색어, 기물 이야기</small></h2><div class="duo">' + pcHTML('거믄') + pcHTML('힌') + '</div><p style="text-align:center;margin:14px 0 0"><button type="button" id="beot-btn" style="font:inherit;font-weight:700;padding:8px 18px;border:1.5px solid #111;background:#fff;border-radius:999px;cursor:pointer">' + (BEOT_OPEN ? '벗 통계 닫기 ▲' : '벗 통계 보기 ▼') + '</button></p>' + (BEOT_OPEN ? '<div class="duo" style="margin-top:14px">' + pcHTML('벗') + '</div>' : '') + '</section>' +
      '<p class="note">「찾아본 기물」과 「찾아본 말」은 거믄·힌으로 들어온 기기에서 2026년 10월 19일부터 쌓입니다.<br>기물 사진 창은 손가락으로 좌우로 밀면 같은 목록의 이전·다음 기물로 넘어가요.<br>모든 기록은 가족 암호를 넣은 기기에서만 보입니다.</p>';
    if (window.MOKGAGU_PHOTO) window.MOKGAGU_PHOTO.fill(app);
    if (draw._done) window.scrollTo(0, sy);
    draw._done = 1;
    saveCache();
    var h = location.hash;
    if ((h === '#ask' || h === '#les' || h === '#wrap') && !draw._jumped) {
      draw._jumped = 1;
      if (h === '#wrap' && !W.open) { wrapOpen(); draw(); }
      setTimeout(function () { var el = document.getElementById(h === '#wrap' ? 'wrapup' : h.slice(1)); if (el) el.scrollIntoView(); }, 50);
    }
  }

  /* 수업이 빠진 날로 적힌 질문은 그다음 수업으로 옮긴다 */
  function changedNote() {
    var t = today(), L = CL.cancel.filter(function (d) { return d >= t; }).map(function (d) { return md(d) + ' 쉼'; }).concat(CL.add.filter(function (d) { return d >= t; }).map(function (d) { return md(d) + ' 수업'; }));
    return L.length ? ' · 바뀐 날: ' + L.join(', ') : '';
  }
  function fixSkipped() {
    D.questions.forEach(function (q) { var to = CL.fix(q.cls); if (to && to !== q.cls) { q.cls = to; post({ action: 'qedit', id: q.id, cls: to }); } });
  }
  /* 기물 이야기 속 질문을 선생님께 여쭤볼 것으로 (거믄·힌 글, 글 하나에 한 번 — 지운 질문은 다시 넣지 않음) */
  function isAsk(t) {
    t = String(t || '');
    if (/[?？]/.test(t)) return true;
    if (/(궁금|여쭤|여쭈|문의|질문|알고\s?싶|모르겠|선생님께|확인\s?필요)/.test(t)) return true;
    return t.split(/[\n.!。]+/).some(function (x) { return /(나요|[인은는떤한된운난큰작]가요|까요|는지요|인지요|습니까|할까)\s*$/.test(x.trim()); });
  }
  var importing = false;
  function importAsks() {
    if (importing || !D) return;
    var have = {}; D.questions.forEach(function (q) { have[q.id] = 1; });
    var gone; try { gone = JSON.parse(localStorage.getItem('mokgagu_ask_from_cm') || '{}'); } catch (e) { gone = {}; }
    var todo = D.comments.filter(function (c) { return (c.author === '거믄' || c.author === '힌') && c.id && !c.pending && !have['cm_' + c.id] && !gone[c.id] && isAsk(c.text); });
    if (!todo.length) return;
    importing = true;
    var cls = upcoming(1)[0], n = 0;
    todo.reduce(function (pr, c) {
      return pr.then(function () {
        var q = { id: 'cm_' + c.id, who: c.author, text: String(c.text).trim().slice(0, 2000), cid: c.cid, cls: cls, t: c.t || new Date().toISOString(), done: false, ans: '' };
        return fetch(API, { method: 'POST', body: JSON.stringify({ action: 'qadd', q: q, code: ls.get(K_CODE) }) }).then(function (r) { return r.json(); }).then(function (j) {
          if (j && j.ok) { gone[c.id] = 1; if (!j.dup) { n++; D.questions.push(q); } }
        }).catch(function () {});
      });
    }, Promise.resolve()).then(function () {
      importing = false;
      try { localStorage.setItem('mokgagu_ask_from_cm', JSON.stringify(gone)); } catch (e) {}
      if (n) { redraw(); toast('기물 이야기 속 질문 ' + n + '개를 ' + md(cls) + ' 수업 질문에 넣었어요'); }
    });
  }

  /* ── 시트에 쓰기 ── */
  function post(d) {
    d.code = ls.get(K_CODE);
    return fetch(API, { method: 'POST', body: JSON.stringify(d) }).then(function (r) { return r.json(); }).then(function (j) { return !!(j && j.ok); }).catch(function () { return false; });
  }
  function qset(id, patch, msg) {
    var q = D.questions.filter(function (x) { return x.id === id; })[0]; if (!q) return;
    var keep = JSON.parse(JSON.stringify(q)); Object.keys(patch).forEach(function (k) { q[k] = patch[k]; }); editId = ansId = ''; draw();
    var body = { action: 'qedit', id: id }; Object.keys(patch).forEach(function (k) { body[k] = patch[k]; });
    post(body).then(function (ok) { if (!ok) { Object.keys(keep).forEach(function (k) { q[k] = keep[k]; }); draw(); toast('저장하지 못했어요. 다시 해 주세요'); } else if (msg) toast(msg); });
  }
  /* 기물 사진으로 가는 고리를 누르면 그 목록 순서를 index.html 사진 창에 넘겨 좌우로 넘길 수 있게 */
  /* 통계 안에서 바로 여는 사진 창 — 닫으면 통계 그대로, 좌우로 밀면 같은 목록의 이전·다음 기물 */
  var V = { list: [], at: 0, S: null };
  function vRow(k, v) { return v ? '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>' : ''; }
  function vShow(i) {
    if (i < 0 || i >= V.list.length) return;
    V.at = i; var cid = V.list[i], r = rec(cid), dlg = document.getElementById('dlg'), img = document.getElementById('d-img');
    dlg.dataset.cid = cid;
    img.onerror = function () { if (r && r.t && img.src.indexOf('/thumbs/') < 0) img.src = 'thumbs/' + r.b + '/' + r.n + '.jpg'; };
    img.src = r ? (r.h ? 'https://jungmono.github.io/mokgagu-photos/photos/' + r.b + '/' + encodeURIComponent(r.pid) + '.jpg' : (r.t ? 'thumbs/' + r.b + '/' + r.n + '.jpg' : '')) : '';
    img.alt = name(cid);
    var notes = V.S && V.S.notes && V.S.notes[cid];
    document.getElementById('d-info').innerHTML = '<div class="cat">' + esc(BOOK[cid.split('/')[0]] || '') + '</div><h3>' + esc(name(cid)) + (r && r.hanja ? '<small>' + esc(r.hanja) + '</small>' : '') + '</h3>' +
      (r ? '<dl>' + vRow('종류', r.kind) + vRow('연대', r.era) + vRow('치수', r.size) + vRow('재질', r.wood) + vRow('소장', r.owner) + vRow('도록', r.page ? r.page + '쪽' : '') + '</dl>' : '') +
      (notes && notes.length ? '<div class="d-ask">' + notes.map(function (n) { return '<div class="d-ask1"><span class="ow2 ' + (n.who === '힌' ? 'h' : 'g') + '">' + esc(n.who) + '</span>' + (n.done ? '<small>여쭤봤어요</small>' : '') + '<p>' + esc(n.text) + '</p>' + (n.ans ? '<div class="qans"><b>선생님 말씀</b>' + esc(n.ans) + '</div>' : '') + '</div>'; }).join('') + '</div>' : '') +
      '<a class="d-book" href="' + esc(cid.split('/')[0]) + '.html">도록에서 보기 →</a>';
    document.getElementById('d-pos').textContent = (V.S ? V.S.label + ' ' : '') + (i + 1) + ' / ' + V.list.length;
    document.getElementById('d-prev').disabled = i === 0; document.getElementById('d-next').disabled = i === V.list.length - 1;
    if (!dlg.open) dlg.showModal();
  }
  function vOpen(S, cid) {
    V.S = S; V.list = S.list.filter(rec); var at = V.list.indexOf(cid);
    if (at < 0) { V.list = [cid].concat(V.list); at = 0; }
    vShow(at);
  }
  app.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-seq]'); if (!a) return;
    var S = SEQ[a.dataset.seq], cid = a.dataset.k; if (!S || !cid || e.ctrlKey || e.metaKey) return;
    e.preventDefault();
    if (rec(cid)) { vOpen(S, cid); return; }
    toast('기물 목록을 불러오는 중이에요…');
    waitIndex().then(function () { if (rec(cid)) vOpen(S, cid); else location.href = a.href; });
  });
  document.getElementById('d-prev').addEventListener('click', function () { vShow(V.at - 1); });
  document.getElementById('d-next').addEventListener('click', function () { vShow(V.at + 1); });
  document.getElementById('d-close').addEventListener('click', function () { document.getElementById('dlg').close(); });
  document.getElementById('dlg').addEventListener('click', function (e) { if (e.target.id === 'dlg') e.target.close(); });
  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'qtext') draft = t.value;
    else if (t.dataset.wa) W.ans[t.dataset.wa] = t.value;
    else if (t.dataset.xq != null) W.extra[+t.dataset.xq].q = t.value;
    else if (t.dataset.xa != null) W.extra[+t.dataset.xa].a = t.value;
    else if (t.id === 'wu-memo') W.memo = t.value;
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'wu-cls') { W.cls = e.target.value; W.ans = {}; var m = memoOf(W.cls, formWho); W.memo = m ? m.text : ''; draw(); }
  });
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || !D) return;
    if (b.dataset.w) {
      formWho = b.dataset.w;
      if (W.open && b.closest('#wrapup')) { var m = memoOf(W.cls, formWho); W.memo = m ? m.text : ''; draw(); return; }
      b.parentNode.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); return;
    }
    if (b.id === 'wrap-go') { if (W.open) W.open = false; else wrapOpen(); draw(); if (W.open) setTimeout(function () { document.getElementById('wrapup').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); return; }
    if (b.id === 'wu-x') { W.open = false; draw(); return; }
    if (b.id === 'wu-more') { W.extra.push({ q: '', a: '' }); draw(); var xs = app.querySelectorAll('[data-xq]'); if (xs.length) xs[xs.length - 1].focus(); return; }
    if (b.id === 'wu-save') { wrapSave(b); return; }
    if (b.id === 'ses-more') { sesOpen = !sesOpen; draw(); return; }
    if (b.id === 'qpick') { window.MOKGAGU_PHOTO.pick(6, qpics.length, function (m) { qbusy = m && /올리는 중/.test(m) ? m : ''; if (m && !qbusy) toast(m); draw(); }, function (add) { qpics = qpics.concat(add); qbusy = ''; draw(); }); return; }
    if (b.dataset.mpx != null && b.closest('#qpics')) { qpics.splice(+b.dataset.mpx, 1); draw(); return; }
    if (b.dataset.qpic) {
      var qq = D.questions.filter(function (x) { return x.id === b.dataset.qpic; })[0]; if (!qq) return;
      window.MOKGAGU_PHOTO.pick(6, (qq.photos || []).length, function (m) { if (m) toast(m); }, function (add) {
        if (!add.length) return; var np = (qq.photos || []).concat(add); qset(qq.id, { photos: np }, '사진을 붙였어요');
      });
      return;
    }
    if (b.id === 'qgo') {
      var ta = document.getElementById('qtext'), text = ta.value.trim(); if (!text) { ta.focus(); return; }
      var q = { id: uid(), who: formWho, text: text, cid: document.getElementById('qcid').value, cls: document.getElementById('qcls').value, t: new Date().toISOString(), done: false, ans: '', photos: qpics.slice() };
      if (qbusy) { toast('사진을 올리는 중이에요. 잠깐만 기다려 주세요'); return; }
      b.disabled = true;
      post({ action: 'qadd', q: q }).then(function (ok) {
        b.disabled = false;
        if (ok) { D.questions.push(q); draft = ''; qpics = []; draw(); toast(md(q.cls) + ' 수업 질문에 넣었어요'); } else toast('넣지 못했어요. 인터넷 연결을 확인해 주세요');
      });
      return;
    }
    if (b.dataset.done) { var q1 = D.questions.filter(function (x) { return x.id === b.dataset.done; })[0]; qset(b.dataset.done, { done: !q1.done }, q1.done ? '' : '여쭤봤어요 ✓'); return; }
    if (b.dataset.edit) { editId = b.dataset.edit; ansId = ''; draw(); var et = app.querySelector('[data-et]'); if (et) et.focus(); return; }
    if (b.dataset.ans) { ansId = b.dataset.ans; editId = ''; draw(); var at = app.querySelector('[data-at]'); if (at) at.focus(); return; }
    if (b.dataset.cancel) { editId = ansId = ''; draw(); return; }
    if (b.dataset.esave) { var v = app.querySelector('[data-et]').value.trim(); if (v) qset(b.dataset.esave, { text: v }, '고쳤어요'); return; }
    if (b.dataset.asave) { qset(b.dataset.asave, { ans: app.querySelector('[data-at]').value.trim(), done: true }, '선생님 말씀을 적어 두었어요 — 공부방에도 쌓여요'); return; }
    if (b.dataset.later) { var q2 = D.questions.filter(function (x) { return x.id === b.dataset.later; })[0], up = upcoming(4), cur = q2.cls || up[0], nxt = up.filter(function (d) { return d > cur; })[0] || up[1]; qset(b.dataset.later, { cls: nxt }, md(nxt) + ' 수업으로 미뤘어요'); return; }
    if (b.dataset.del) {
      if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = '정말 지울까요? 한 번 더 누르세요'; setTimeout(function () { if (b.isConnected) { b.dataset.sure = ''; b.textContent = '지우기'; } }, 3000); return; }
      var id = b.dataset.del, keepQ = D.questions.slice(); D.questions = D.questions.filter(function (x) { return x.id !== id; }); draw();
      post({ action: 'qdel', id: id }).then(function (ok) { if (!ok) { D.questions = keepQ; draw(); toast('지우지 못했어요'); } else toast('지웠어요'); });
      return;
    }
    if (b.id === 'past') { past = !past; draw(); return; }
    if (b.id === 'pr') { document.body.classList.add('pr'); window.print(); setTimeout(function () { document.body.classList.remove('pr'); }, 500); return; }
    if (b.dataset.col) { if (window.MOKGAGU_LIKES && window.MOKGAGU_LIKES.open) window.MOKGAGU_LIKES.open(); return; }
  });
  window.addEventListener('afterprint', function () { document.body.classList.remove('pr'); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && D && !W.open && !typing()) load(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load); else load();
})();

<script>/* 검색 색인(1.4MB)은 화면을 먼저 그린 뒤에 받는다 */
(function(){function go(){if(window.SEARCH||document.querySelector('script[src^="search.js"]'))return;var x=document.createElement('script');x.src='search.js';x.async=true;document.head.appendChild(x);}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(go,150);});else setTimeout(go,150);})();</script>
<script id="dlg-swipe">(function(){var d=document.getElementById('dlg');if(!d)return;
var img=document.getElementById('dlg-img')||document.getElementById('d-img');if(!img)return;
var nx=function(){return document.getElementById('dlg-next')||document.getElementById('d-next');},pv=function(){return document.getElementById('dlg-prev')||document.getElementById('d-prev');};
img.setAttribute('draggable','false');img.addEventListener('dragstart',function(e){e.preventDefault();});
if(img.parentElement)img.parentElement.style.overflow='hidden';
var sc=1,tx=0,ty=0,sw=0,busy=false;
function apply(anim){img.style.transition=anim?'transform .22s ease, opacity .22s ease':'none';
  img.style.transform=(sc===1&&!sw&&!tx&&!ty)?'':'translate('+(tx+sw)+'px,'+ty+'px) scale('+sc+')';
  img.style.opacity=sw?String(Math.max(.35,1-Math.abs(sw)/600)):'';img.style.touchAction=sc>1?'none':'';img.style.cursor=sc>1?'grab':'';}
function clampPan(){var w=img.clientWidth,h=img.clientHeight,mx=w*(sc-1)/2,my=h*(sc-1)/2;tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty));}
function reset(){sc=1;tx=0;ty=0;sw=0;apply(false);}
function zoomAt(ns,cx,cy){var r=img.getBoundingClientRect(),ox=cx-(r.left+r.width/2),oy=cy-(r.top+r.height/2);ns=Math.max(1,Math.min(5,ns));var k=ns/sc;tx=(tx-ox)*k+ox;ty=(ty-oy)*k+oy;sc=ns;if(sc===1){tx=0;ty=0;}clampPan();}
new MutationObserver(function(){if(!busy)reset();}).observe(img,{attributes:true,attributeFilter:['src']});
function go(dir){var b=dir>0?nx():pv();if(!b||b.disabled){sw=0;apply(true);return;}
  if(busy)return;busy=true;var w=(d.clientWidth||400)*0.6;sw=-dir*w;apply(true);
  setTimeout(function(){sc=1;tx=0;ty=0;b.click();sw=dir*w;apply(false);requestAnimationFrame(function(){requestAnimationFrame(function(){sw=0;apply(true);busy=false;});});},200);}
var x0=null,y0=0,t0=0,dx=0,mode=0,px=0,py=0,pd0=0,ps0=1,lastTap=0,tEnd=0,dxEnd=0;
function onImg(t){return t===img||(img.parentElement&&img.parentElement.contains(t));}
function start(x,y,t){if(t&&t.closest&&t.closest('button,a,input,select,textarea'))return;x0=x;y0=y;px=x;py=y;t0=Date.now();dx=0;mode=sc>1&&onImg(t)?4:0;}
function move(x,y,e){if(x0===null)return;
  if(mode===4){tx+=x-px;ty+=y-py;px=x;py=y;clampPan();apply(false);if(e&&e.cancelable)e.preventDefault();return;}
  var ddx=x-x0,ddy=y-y0;
  if(!mode){if(Math.abs(ddx)>8&&Math.abs(ddx)>Math.abs(ddy)*1.2)mode=1;else if(Math.abs(ddy)>10)mode=2;}
  if(mode===1){dx=ddx;sw=dx;apply(false);if(e&&e.cancelable)e.preventDefault();}}
function end(){if(x0===null)return;tEnd=Date.now();dxEnd=(mode===1||mode===4)?99:0;var fast=Date.now()-t0<300&&Math.abs(dx)>30;var m=mode;x0=null;mode=0;
  if(m===1&&(Math.abs(dx)>70||fast)){go(dx<0?1:-1);}else if(m===1){sw=0;apply(true);}}
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
d.addEventListener('touchstart',function(e){
  if(e.touches.length===2&&onImg(e.target)){x0=null;mode=3;pd0=dist(e.touches[0],e.touches[1]);ps0=sc;return;}
  if(e.touches.length!==1){x0=null;return;}var p=e.touches[0];start(p.clientX,p.clientY,e.target);},{passive:true});
d.addEventListener('touchmove',function(e){
  if(mode===3&&e.touches.length===2){var a=e.touches[0],b=e.touches[1];zoomAt(ps0*dist(a,b)/pd0,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);apply(false);if(e.cancelable)e.preventDefault();return;}
  var p=e.touches[0];if(p)move(p.clientX,p.clientY,e);},{passive:false});
d.addEventListener('touchend',function(e){
  if(mode===3){if(e.touches.length===0){mode=0;if(sc<1.05){reset();apply(true);}}tEnd=Date.now();dxEnd=99;return;}
  var tap=x0!==null&&mode===0&&Date.now()-t0<250;var tg=e.target;end();
  if(tap&&onImg(tg)){var now=Date.now();if(now-lastTap<320){var c=e.changedTouches[0];if(sc>1){sc=1;tx=0;ty=0;}else zoomAt(2.5,c.clientX,c.clientY);apply(true);lastTap=0;if(e.cancelable)e.preventDefault();}else lastTap=now;}});
d.addEventListener('touchcancel',function(){x0=null;mode=0;sw=0;apply(true);});
var mouse=false;
d.addEventListener('mousedown',function(e){if(e.button!==0)return;mouse=true;start(e.clientX,e.clientY,e.target);if(mode===4)img.style.cursor='grabbing';});
window.addEventListener('mousemove',function(e){if(mouse)move(e.clientX,e.clientY,e);});
window.addEventListener('mouseup',function(){if(mouse){mouse=false;end();apply(false);}});
img.addEventListener('wheel',function(e){e.preventDefault();zoomAt(sc*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY);apply(false);},{passive:false});
img.addEventListener('dblclick',function(e){if(sc>1){sc=1;tx=0;ty=0;}else zoomAt(2.5,e.clientX,e.clientY);apply(true);});
d.addEventListener('click',function(e){if(e.isTrusted&&Date.now()-tEnd<400&&dxEnd){e.stopPropagation();e.preventDefault();}},true);
d.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();go(1);}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}else if(e.key==='+'||e.key==='='){zoomAt(sc*1.3,innerWidth/2,innerHeight/2);apply(true);}else if(e.key==='-'){zoomAt(sc/1.3,innerWidth/2,innerHeight/2);apply(true);}});
d.addEventListener('close',reset);
})();</script>
