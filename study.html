<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="light">
<title>거믄 · 힌의 공부방 — 조선의 목가구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--fg:#1d1b18;--muted:#756e65;--line:#e6e1d9;--paper:#fbfaf7;--ink:#111}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--fg)}
body{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 72px}
.hd{text-align:center;margin:26px 0 10px}
.hd .mk{display:inline-flex;font-weight:900;font-size:15px}.hd .mk span{display:inline-block;min-width:2.9em;padding:.12em .45em;border:1.5px solid #111;line-height:1.25}
.hd .mk .b{background:#111;color:#fff}.hd .mk .w{background:#fff;color:#111}
.hd h1{margin:12px 0 6px;font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(28px,4.4vw,42px);letter-spacing:-.03em}
.hd p{margin:0;color:var(--muted);font-weight:500}
/* 잠금 */
.lock{max-width:380px;margin:40px auto;text-align:center;border:1px solid var(--line);border-radius:18px;padding:30px 24px;background:var(--paper)}
.lock .ic{font-size:40px}
.lock h2{margin:8px 0 4px;font-size:19px;font-weight:900}
.lock p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.6}
.lock input{font:inherit;font-size:22px;letter-spacing:.4em;text-align:center;width:180px;border:1.5px solid #cfc8bd;border-radius:10px;padding:10px;background:#fff}
.lock button{display:block;margin:14px auto 0;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;background:#111;color:#fff;padding:10px 26px;cursor:pointer}
.lock button:disabled{opacity:.5}
.lock .err{color:#8a2f22;font-size:13.5px;margin-top:10px;min-height:1.2em}
.lock label{display:flex;justify-content:center;gap:6px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.tabs{display:flex;justify-content:center;gap:0;margin:22px auto 0;border:1.5px solid #111;border-radius:12px;overflow-x:auto;overflow-y:hidden;width:max-content;max-width:100%}.tabs button{white-space:nowrap}
.tabs button{font:inherit;font-size:15px;font-weight:800;border:0;background:#fff;color:#111;padding:9px 18px;cursor:pointer}
.tabs button+button{border-left:1.5px solid #111}
.tabs button small{font-weight:500;color:#8a837a;margin-left:2px}
.tabs button.on.t-g{background:#111;color:#fff}.tabs button.on.t-g small{color:#ccc}
.tabs button.on.t-h{background:#fff;color:#111;box-shadow:inset 0 0 0 3px #111}
.tabs button.on.t-b{background:#f1efeb}.tabs button.on.t-m{background:#f1efeb}
.tabs button.t-w{color:#5b3a05;background:#f6ead0;font-weight:900;box-shadow:inset 0 -3px 0 #8a5a12}.tabs button.on.t-w{background:#8a5a12;color:#fff;box-shadow:none}
.tabs button.t-q{color:#1f4d31;background:#cfe6d5;font-weight:900;box-shadow:inset 0 -3px 0 #2f6b45}.tabs button.on.t-q{background:#2f6b45;color:#fff;box-shadow:none}
.tabs button.on.t-k{background:#f3f8f4;box-shadow:inset 0 0 0 3px #2f6b45;color:#1f4d31}
.ses.tk{border-color:#cfe0d3}.ses.tk .dt .no{background:#2f6b45}
.tk-memo{white-space:pre-wrap;margin:4px 0 8px}
.tk-qa{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fdfcfa}
.tk-q{font-weight:700;line-height:1.65;white-space:pre-wrap}
.tk-a{margin-top:6px;border-left:3px solid #2f6b45;background:#f3f8f4;border-radius:0 10px 10px 0;padding:6px 12px;white-space:pre-wrap}.tk-a b{display:block;font-size:12px;color:#2f6b45}
.tk-none{color:#8a837a;font-size:13.5px}
.tk-see{display:inline-block;margin-top:6px;font-size:13px;color:#4a463f}
.tk-edit{margin:10px 0 0;text-align:right;font-size:13px}.tk-edit a{color:#2f6b45;font-weight:700}
@media (max-width:480px){.tabs button{padding:8px 9px;font-size:13.5px}}
.ow{display:inline-block;min-width:2.9em;text-align:center;font-style:normal;font-weight:900;font-size:12px;padding:1px 7px;border:1.5px solid #111;line-height:1.35;margin-right:6px}
.ow.g{background:#111;color:#fff}.ow.h{background:#fff;color:#111}
.ses.o-h{background:#fdfcfa;border-color:#d8d2c7}
.ses.o-h .body h3{border-left-color:#bbb}
@media (max-width:480px){.tabs button{padding:8px 11px;font-size:14px}}
@media (max-width:600px){.tabs{display:grid;grid-template-columns:repeat(12,1fr);gap:1.5px;background:#111;width:auto;overflow:hidden}.tabs button,.tabs button+button{grid-column:span 3;border:0;padding:10px 2px;font-size:13px;white-space:nowrap;min-width:0}.tabs button.t-w,.tabs button.t-q,.tabs button.t-m{grid-column:span 4;font-size:14px}}
/* 공부방 모든 메뉴 공통: 같은 가로폭 · 같은 글꼴/글자 크기 (제목 20~23px 굵게 · 본문 15.5px · 작은 글 13~14px) */
#wr,#qz,#kgm{max-width:none!important;width:100%;margin-left:0!important;margin-right:0!important}
#wr,#wr *,#qz,#qz *,#kgm,#kgm *{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#qz .hd h2{font-size:clamp(20px,2.6vw,23px)!important;font-weight:900;letter-spacing:-.02em}
#qz .q,.kg-det h2,#wr .wr-title{font-size:clamp(19px,2.6vw,23px)!important;font-weight:900}
#qz .opt,#qz .ex,#qz .miss,#wr .wr-body,#wr .wr-tip,.kg-det p,.kg-det li,.kg-list button,.kg-bar input{font-size:15.5px!important;line-height:1.8}
#qz .score b{font-family:"Noto Serif KR",serif}
@media (max-width:480px){#qz .opt,#qz .ex,#wr .wr-body,.kg-det p,.kg-det li{font-size:15px!important}}
/* 목차 */
.toc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 26px}
.toc a{text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;background:#fff}
.toc a:hover{border-color:#111}
.toc a small{color:var(--muted);font-weight:500;margin-left:4px}
.tools{display:flex;gap:8px;justify-content:center;align-items:center;margin:18px 0 14px;flex-wrap:wrap}
.tools input{font:inherit;font-size:16px;border:1px solid #d9d4cc;border-radius:999px;padding:7px 14px;width:min(340px,100%)}
.tools button{font:inherit;font-size:13px;border:1px solid #d9d4cc;background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;color:#6b665e}
/* 수업 */
.ses{position:relative;border:1px solid var(--line);border-radius:18px;padding:22px 24px 18px;margin:0 0 22px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 22px rgba(0,0,0,.04)}
.ses .dt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ses .dt b{font-family:"Noto Serif KR",serif;font-size:26px;font-weight:900;letter-spacing:-.02em}
.ses .dt span{font-size:13px;color:var(--muted);font-weight:700}
.ses .dt .no{font-size:12px;color:#fff;background:#111;border-radius:6px;padding:2px 8px;font-weight:900}
.ses h2{margin:6px 0 8px;font-size:clamp(19px,2.6vw,23px);font-weight:900;letter-spacing:-.02em}
.ses .lead{margin:0 0 10px;color:#3b3833;line-height:1.7;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tags span{font-size:12px;font-weight:700;background:#f3f1ec;border-radius:6px;padding:2px 8px;color:#4a463f}
.body{line-height:1.8;font-size:15.5px}
.body h3{margin:20px 0 6px;font-size:16.5px;font-weight:900;border-left:4px solid #111;padding-left:9px}
.body ul,.body ol{margin:4px 0 8px;padding-left:22px}.body li{margin:2px 0}
.body .note{color:var(--muted);margin:2px 0}
.body .star{background:#fff8e6;border:1px solid #f0dca5;border-radius:10px;padding:8px 12px;font-weight:700;list-style:none}
.body li.star{margin:6px 0 6px -22px}
.q4{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14.5px}.q4 td{border:1.5px solid #111;padding:10px 12px;vertical-align:top;width:50%;line-height:1.65}
.body mark{background:#fff1a8}
.more{margin-top:8px}
.more summary{cursor:pointer;font-weight:800;font-size:14.5px;color:#3b3833;list-style:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{background:#111;color:#fff;border-color:#111}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.gal button{border:1px solid var(--line);border-radius:10px;background:#faf8f5;padding:0;cursor:zoom-in;overflow:hidden;text-align:left}
.gal img{display:block;width:100%;height:150px;object-fit:cover;object-position:top}
.gal span{display:block;font-size:12px;color:#4a463f;padding:5px 7px;line-height:1.35}
.foot{margin-top:30px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.foot button{font:inherit;font-size:12.5px;border:0;background:none;color:#a0988e;text-decoration:underline;cursor:pointer}
/* 크게 보기 */
#lb{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;width:100vw;height:100vh}
#lb::backdrop{background:rgba(10,10,10,.88)}
#lb .in{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#lb img{max-width:96vw;max-height:88vh;transform-origin:center;transition:transform .05s;user-select:none}
#lb .bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;align-items:center;padding:12px;color:#fff;font-size:14px}
#lb .bar button{font:inherit;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.4);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
#lb .cap{position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 4px #000}
@media (max-width:600px){.ses{padding:18px 16px 14px}.q4 td{display:block;width:auto;border-bottom-width:0}.q4 tr:last-child td:last-child{border-bottom-width:1.5px}}
@media print{.lock,.tools,.toc,.more summary,.foot button{display:none}.ses{box-shadow:none;break-inside:avoid-page}}
</style>

<script>
(function () {
  var K_CODE = 'mokgagu_cm_code', K_STUDY = 'mokgagu_study_pw';
  var app = document.getElementById('app');
  var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };
  var key = null, DATA = null, cache = {};
  /* 선생님 말씀: 통계 페이지의 「수업 마치고 말씀 적기」에서 적은 말씀·메모(구글 시트 「질문」 탭)를 날짜별로 */
  var API = 'https://script.google.com/macros/s/AKfycbyQoDpYNaIA034Inb2J-SaW5-dhstcZQBJWOug7FxJKnP-evddQtprYUontg5GlSvkyBA/exec', K_TALK = 'mokgagu_study_talk_v1';
  var TALK = (function () { try { return JSON.parse(localStorage.getItem(K_TALK) || 'null'); } catch (e) { return null; } })();
  function loadTalk() {
    var code = ls.get(K_CODE) || ls.get(K_STUDY); if (!code) return;
    fetch(API, { method: 'POST', body: JSON.stringify({ action: 'stats', code: code }) }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j || !j.ok) return;
      var t = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
      var L = (j.questions || []).filter(function (q) { return q.cls && q.cls <= t && (q.ans || q.done || String(q.id).indexOf('memo_') === 0); })
        .map(function (q) { return { id: q.id, who: q.who, text: q.text, ans: q.ans || '', cid: q.cid || '', cls: q.cls, t: q.t, memo: String(q.id).indexOf('memo_') === 0 }; });
      var s1 = JSON.stringify(L); if (s1 === JSON.stringify(TALK)) return;
      TALK = L; ls.set(K_TALK, s1);
      if (DATA && !(document.activeElement && document.activeElement.id === 'q')) render();
    }).catch(function () {});
  }
  function talkDays() { var m = {}; (TALK || []).forEach(function (q) { (m[q.cls] = m[q.cls] || []).push(q); }); return m; }
  function talkHTML() {
    var m = talkDays(), days = Object.keys(m).sort().reverse();
    var h = '<nav class="toc">' + days.map(function (d) { return '<a href="#talk-' + d + '">' + fmtDate(d).replace(/^2026\. /, '') + '<small>' + m[d].length + '</small></a>'; }).join('') + '</nav><div id="list">';
    if (!days.length) h += '<div class="ses"><div class="body"><p>아직 적은 선생님 말씀이 없어요.</p><p class="note">수업을 마치고 <a href="stats.html#wrap">통계 → 「📝 수업 마치고 선생님 말씀 적기」</a>에서 질문마다 말씀을 적고, 수업에서 새로 여쭤본 것과 그 밖에 배운 것을 적으면 여기 날짜별로 쌓여요.</p></div></div>';
    days.forEach(function (d) {
      var L = m[d], memos = L.filter(function (q) { return q.memo; }), qa = L.filter(function (q) { return !q.memo; });
      var b = '';
      memos.forEach(function (x) { b += '<h3><i class="ow ' + (x.who === '힌' ? 'h' : 'g') + '">' + esc(x.who) + '</i>수업 메모 — 그 밖에 배운 것</h3><p class="tk-memo">' + esc(x.text) + '</p>'; });
      if (qa.length) b += '<h3>여쭤본 것 · 선생님 말씀 <small style="font-weight:500;color:#756e65">' + qa.length + '개</small></h3>' + qa.map(function (q) {
        return '<div class="tk-qa"><div class="tk-q"><i class="ow ' + (q.who === '힌' ? 'h' : 'g') + '">' + esc(q.who) + '</i>' + esc(q.text) + '</div>' +
          (q.ans ? '<div class="tk-a"><b>선생님 말씀</b>' + esc(q.ans) + '</div>' : '<div class="tk-a tk-none">여쭤봤어요 · 말씀은 아직 적지 않았어요</div>') +
          (q.cid ? '<a class="tk-see" href="index.html#see=' + q.cid.split('/').map(encodeURIComponent).join('/') + '">기물 사진 보기 ›</a>' : '') + '</div>';
      }).join('');
      h += '<article class="ses tk" id="talk-' + d + '" data-date="' + d + '"><div class="dt"><span class="no">선생님 말씀</span><b>' + fmtDate(d) + '</b><span>' + (qa.length ? '여쭤본 것 ' + qa.length : '') + (memos.length ? (qa.length ? ' · ' : '') + '메모 ' + memos.length : '') + '</span></div>' +
        '<div class="body">' + b + '</div><p class="tk-edit"><a href="stats.html#wrap">통계에서 더 적기 · 고치기 ›</a></p></article>';
    });
    return h + '</div>';
  }
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  async function derive(pw) {
    var meta = await fetch('study/salt.json', { cache: 'no-store' }).then(function (r) { return r.json(); });
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function dec(url) {
    var buf = new Uint8Array(await fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); }));
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  }
  async function unlock(pw, remember) {
    key = await derive(pw);
    var plain = await dec('study/data.bin');   // 암호가 틀리면 여기서 실패
    DATA = JSON.parse(new TextDecoder().decode(plain));
    loadTalk();
    window.MOKGAGU_NOTEEDIT.load(function () { if (DATA && !(document.activeElement && document.activeElement.id === 'q') && !document.querySelector('#ne-dlg[open]')) render(); });
    if (remember) { ls.set(K_STUDY, pw); if (!ls.get(K_CODE)) ls.set(K_CODE, pw); }
    render();
  }
  function lockView(msg) {
    app.innerHTML = '<div class="lock"><div class="ic">🔒</div><h2>가족 암호를 넣어 주세요</h2><p>거믄과 힌의 수업 노트가 들어 있는 공부방이에요.<br>내용은 암호로 잠가 두어 암호 없이는 열리지 않아요.</p>' +
      '<form id="f"><input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password" maxlength="64" aria-label="가족 암호" autofocus>' +
      '<label style="display:inline-flex;align-items:center;gap:8px;padding:8px 0"><input type="checkbox" id="rem" checked style="width:20px;height:20px"> 이 기기에서 기억하기</label><button id="go">열기</button><div class="err" id="err">' + esc(msg || '') + '</div></form></div>';
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault(); var pw = document.getElementById('pw').value.trim(); if (!pw) return;
      var b = document.getElementById('go'); b.disabled = true; b.textContent = '여는 중…'; document.getElementById('err').textContent = '';
      unlock(pw, document.getElementById('rem').checked).catch(function (er) { b.disabled = false; b.textContent = '열기'; document.getElementById('err').textContent = er && er.message === 'net' ? '인터넷 연결을 확인해 주세요.' : '암호가 맞지 않아요.'; });
    });
  }
  function fmtDate(d) { var p = d.split('-'); var w = '일월화수목금토'[new Date(d + 'T12:00:00').getDay()]; return p[0] + '. ' + (+p[1]) + '. ' + (+p[2]) + '. (' + w + ')'; }
  var allImgs = [];
  var K_TAB = 'mokgagu_study_tab';
  var tab = /^#write/.test(location.hash) ? '쓰기' : /^#quiz/.test(location.hash) ? '퀴즈' : /^#talk/.test(location.hash) ? '말씀' : (ls.get(K_TAB) || '거믄');
  function render() {
    if (['거믄', '힌', '함께', '말씀', '지도', '쓰기', '퀴즈'].indexOf(tab) < 0) tab = '거믄';
    var own = function (o) { return DATA.sessions.filter(function (s) { return (s.owner || '거믄') === o; }); };
    var cnt = { '거믄': own('거믄').length, '힌': own('힌').length };
    var S = (tab === '함께' ? DATA.sessions.slice() : own(tab)).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : ((a.owner || '거믄') < (b.owner || '거믄') ? -1 : 1); });
    allImgs = [];
    var html = '<div class="tabs" role="tablist">' + [['거믄', '거믄의 노트'], ['힌', '힌의 노트'], ['함께', '날짜별 함께'], ['말씀', '선생님 말씀'], ['지도', '지식 지도'], ['쓰기', '바로 쓰기'], ['퀴즈', '복습 퀴즈']].map(function (t) {
      return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (tab === t[0]) + '" class="t-' + (t[0] === '거믄' ? 'g' : t[0] === '힌' ? 'h' : t[0] === '말씀' ? 'k' : t[0] === '퀴즈' ? 'q' : t[0] === '쓰기' ? 'w' : t[0] === '지도' ? 'm' : 'b') + (tab === t[0] ? ' on' : '') + '">' + t[1] + (t[0] === '말씀' ? ' <small>' + Object.keys(talkDays()).length + '</small>' : (t[0] === '퀴즈' || t[0] === '쓰기' || t[0] === '지도') ? '' : t[0] !== '함께' ? ' <small>' + cnt[t[0]] + '</small>' : '') + '</button>'; }).join('') + '</div>';
    html += '<div class="tools"><input type="search" id="q" placeholder="노트에서 찾기 — 예: 경첩, 연대, 빗접" aria-label="노트 검색"><button id="order">오래된 수업부터</button></div>';
    if (tab === '쓰기') {
      app.innerHTML = html.split('<div class="tools">')[0] + '<div id="wr"></div>';
      window.MOKGAGU_WRITE.mount(document.getElementById('wr'));
      return;
    }
    if (tab === '지도') {
      app.innerHTML = html.split('<div class="tools">')[0] + '<div id="kgm"></div>';
      var kgEl = document.getElementById('kgm');
      var mountKg = function () { window.MOKGAGU_KG.mount(kgEl, {
        sessions: DATA.sessions,
        load: function () { return dec('study/kg.bin').then(function (b) { return JSON.parse(new TextDecoder().decode(b)); }); },
        goSession: function (se) {
          tab = se.owner || '거믄'; ls.set(K_TAB, tab); render();
          var id = 'd' + (se.owner === '힌' ? 'h' : 'g') + se.date;
          setTimeout(function () { var a = document.getElementById(id); if (a) a.scrollIntoView(); }, 60);
        }
      }); };
      /* 지식 지도는 d3가 필요하니 이 화면에 들어올 때만 받는다 */
      if (window.d3) mountKg(); else { var d3s = document.createElement('script'); d3s.src = 'd3.min.js'; d3s.onload = mountKg; d3s.onerror = function () { kgEl.innerHTML = '<p class="foot">지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>'; }; document.head.appendChild(d3s); }
      return;
    }
    if (tab === '퀴즈') {
      app.innerHTML = html.split('<div class="tools">')[0] + '<div id="qz"></div>';
      window.MOKGAGU_QUIZ.mount(document.getElementById('qz'), key);
      return;
    }
    if (tab === '말씀') {
      app.innerHTML = html + talkHTML() + '<div class="foot">통계의 「📝 수업 마치고 선생님 말씀 적기」에서 적은 말씀과 메모가 수업 날짜별로 여기 쌓여요.<br><button id="out">이 기기에서 잠그기</button></div>';
      if (location.hash) { var t0 = document.getElementById(location.hash.slice(1)); if (t0) setTimeout(function () { t0.scrollIntoView(); }, 50); }
      return;
    }
    var NE = window.MOKGAGU_NOTEEDIT;
    var sid = function (s) { return 'd' + (s.owner === '힌' ? 'h' : 'g') + s.date; };
    html += '<nav class="toc">' + S.map(function (s) { return '<a href="#' + sid(s) + '">' + (tab === '함께' ? '<i class="ow ' + (s.owner === '힌' ? 'h' : 'g') + '">' + esc(s.owner || '거믄') + '</i>' : '') + fmtDate(s.date).replace(/^2026\. /, '') + '<small>' + esc(NE.view(s).title.split(' — ')[0].split(' · ')[0]) + '</small></a>'; }).join('') + '</nav><div id="list">';
    S.forEach(function (s) {
      var o = s.owner || '거믄', mine = own(o).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      var no = mine.indexOf(s) + 1, v = NE.view(s);
      var gi = s.imgs.map(function (im) { allImgs.push({ f: im.f, cap: o + ' · ' + fmtDate(s.date) + ' · ' + im.cap }); return '<button type="button" data-i="' + (allImgs.length - 1) + '"><img loading="lazy" src="' + im.th + '" alt=""><span>' + esc(im.cap) + '</span></button>'; }).join('');
      html += '<article class="ses o-' + (o === '힌' ? 'h' : 'g') + '" id="' + sid(s) + '" data-date="' + s.date + '"><div class="dt"><span class="ow ' + (o === '힌' ? 'h' : 'g') + '">' + esc(o) + '</span><span class="no">' + no + '번째 노트</span><b>' + fmtDate(s.date) + '</b>' + (s.who && s.who !== o ? '<span>' + esc(s.who) + '</span>' : '') + NE.bar(s) + '</div>' +
        '<h2>' + esc(v.title) + '</h2><p class="lead">' + esc(v.lead) + '</p><div class="tags">' + v.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
        '<div class="body">' + v.body + '</div>' + NE.photos(s) +
        (gi ? '<details class="more"><summary>📝 ' + (o === '힌' ? '힌의 필기' : '손글씨 노트·선생님 자료') + ' ' + s.imgs.length + '장</summary><div class="gal">' + gi + '</div></details>' : '') + '</article>';
    });
    html += '</div><div class="foot">거믄의 노트 ' + cnt['거믄'] + '편 · 힌의 노트 ' + cnt['힌'] + '편 · (?)는 손글씨 판독이 불확실한 곳<br>새 수업 노트를 주시면 거믄·힌 따로 날짜별로 이어서 정리해 둘게요.<br><button id="out">이 기기에서 잠그기</button></div>';
    app.innerHTML = html; NE.after(app);
    if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(function () { t.scrollIntoView(); }, 50); }
  }
  /* 검색: 맞는 수업만 보이고 낱말에 형광펜 */
  function search(q) {
    document.querySelectorAll('.ses').forEach(function (a) {
      var b = a.querySelector('.body'); if (!b.dataset.orig) b.dataset.orig = b.innerHTML; b.innerHTML = b.dataset.orig;
      if (!q) { a.hidden = false; return; }
      var hit = a.textContent.indexOf(q) >= 0; a.hidden = !hit;
      if (hit) { var w = document.createTreeWalker(b, NodeFilter.SHOW_TEXT), ns = []; while (w.nextNode()) if (w.currentNode.nodeValue.indexOf(q) >= 0) ns.push(w.currentNode);
        ns.forEach(function (n) { var span = document.createElement('span'); span.innerHTML = esc(n.nodeValue).split(esc(q)).join('<mark>' + esc(q) + '</mark>'); n.parentNode.replaceChild(span, n); }); }
    });
  }
  /* 크게 보기 (확대·끌기) */
  var lb = document.getElementById('lb'), li = document.getElementById('lb-img'), cur = 0, z = 1, tx = 0, ty = 0;
  function apply() { li.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')'; }
  async function show(i) {
    cur = (i + allImgs.length) % allImgs.length; z = 1; tx = ty = 0; apply();
    var it = allImgs[cur]; document.getElementById('lb-cap').textContent = it.cap + '  (' + (cur + 1) + '/' + allImgs.length + ')';
    if (!cache[it.f]) { li.style.opacity = .3; var buf = await dec(it.f); cache[it.f] = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' })); }
    li.src = cache[it.f]; li.style.opacity = 1;
    if (!lb.open) lb.showModal();
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.i != null && b.closest('.gal')) { show(+b.dataset.i); return; }
    if (b.id === 'lb-prev') show(cur - 1); else if (b.id === 'lb-next') show(cur + 1); else if (b.id === 'lb-x') lb.close();
    else if (b.id === 'lb-zi') { z = Math.min(6, z * 1.4); apply(); } else if (b.id === 'lb-zo') { z = Math.max(1, z / 1.4); if (z === 1) tx = ty = 0; apply(); }
    else if (b.dataset.tab) { tab = b.dataset.tab; ls.set(K_TAB, tab); render(); }
    else if (b.id === 'out') { ls.del(K_STUDY); key = null; DATA = null; lockView('이 기기에서 잠갔어요.'); }
    else if (b.id === 'order') { var L = document.getElementById('list'), arr = [].slice.call(L.children).reverse(); arr.forEach(function (a) { L.appendChild(a); }); b.textContent = b.textContent === '오래된 수업부터' ? '최근 수업부터' : '오래된 수업부터'; }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'q') search(e.target.value.trim()); });
  document.addEventListener('keydown', function (e) { if (!lb.open) return; if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1); });
  document.getElementById('lb-in').addEventListener('wheel', function (e) { e.preventDefault(); z = Math.max(1, Math.min(6, z * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); if (z === 1) tx = ty = 0; apply(); }, { passive: false });
  document.getElementById('lb-in').addEventListener('click', function (e) { if (e.target.id === 'lb-in') lb.close(); });
  li.addEventListener('dblclick', function () { z = z > 1 ? 1 : 2.5; tx = ty = 0; apply(); });
  var pts = {}, start = null;
  li.addEventListener('pointerdown', function (e) { li.setPointerCapture(e.pointerId); pts[e.pointerId] = [e.clientX, e.clientY]; var k = Object.keys(pts); start = k.length === 2 ? { d: Math.hypot(pts[k[0]][0] - pts[k[1]][0], pts[k[0]][1] - pts[k[1]][1]), z: z } : { x: e.clientX - tx, y: e.clientY - ty }; });
  li.addEventListener('pointermove', function (e) { if (!pts[e.pointerId]) return; pts[e.pointerId] = [e.clientX, e.clientY]; var k = Object.keys(pts);
    if (k.length === 2 && start.d) { z = Math.max(1, Math.min(6, start.z * Math.hypot(pts[k[0]][0] - pts[k[1]][0], pts[k[0]][1] - pts[k[1]][1]) / start.d)); apply(); }
    else if (k.length === 1 && z > 1 && start.x != null) { tx = e.clientX - start.x; ty = e.clientY - start.y; apply(); } });
  ['pointerup', 'pointercancel'].forEach(function (t) { li.addEventListener(t, function (e) { delete pts[e.pointerId]; start = null; }); });
  li.addEventListener('dragstart', function (e) { e.preventDefault(); });

  if (!window.crypto || !crypto.subtle) { app.innerHTML = '<div class="lock"><p>이 브라우저에서는 열 수 없어요. 최신 크롬·사파리로 열어 주세요.</p></div>'; return; }
  var saved = ls.get(K_STUDY) || ls.get(K_CODE);
  if (saved) { app.innerHTML = '<p style="text-align:center;color:#756e65;margin:40px 0">여는 중…</p>'; unlock(saved, false).catch(function () { lockView(); }); }
  else lockView();
})();
