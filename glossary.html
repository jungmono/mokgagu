<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>목가구 용어 사전</title><meta name="theme-color" content="#111111">
<style>
body{margin:0;background:#fff;color:#111;font-family:-apple-system,"Malgun Gothic",sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
a.h{color:#111;font-weight:800;text-decoration:none;border:2px solid #111;border-radius:999px;padding:6px 14px;display:inline-block}
h1{font-size:24px;margin:18px 0 4px}p.s{color:#666;font-size:13px;margin:0 0 12px}
input{width:100%;box-sizing:border-box;font-size:16px;padding:10px 12px;border:2px solid #111;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{border:1.5px solid #111;background:#fff;border-radius:999px;padding:9px 13px;font-size:14px;cursor:pointer}
.chips button.on{background:#111;color:#fff}
.t{border:1px solid #ccc;border-radius:8px;padding:10px 12px;margin:8px 0}
.t:target{border-color:#111;box-shadow:0 0 0 2px #111}
.t b{font-size:16px}.t small{color:#666}.t .d{margin-top:4px;line-height:1.7;font-size:14.5px}
.ln{display:inline-block;font-size:12.5px;border:1px solid #111;border-radius:4px;padding:0 5px;margin-left:6px}
</style><script src="common.js?v=17" defer></script></head><body><div class="w">
<a class="h" href="index.html">← 처음으로</a>
<h1>목가구 용어 사전</h1><p class="s">수업에서 배운 말과 기본 용어를 모았습니다. 도록·공부방 글 속 점선 밑줄 용어를 누르면 뜻이 뜹니다.</p>
<input id="q" placeholder="용어·한자 검색 (예: 감잡이, 櫃)" autocomplete="off">
<div class="chips" id="chips"></div><div id="list"></div>
<script src="glossary.js?v=20261024"></script>
<script>
var L=MOKGAGU_GLOSSARY.list.slice().sort(function(a,b){return a[0].localeCompare(b[0],'ko');});
var cat='',cats=['전체'].concat(Array.from(new Set(L.map(function(g){return g[3];}))));
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function draw(){var q=document.getElementById('q').value.trim();
 var r=L.filter(function(g){return (!cat||g[3]===cat)&&(!q||(g[0]+g[1]+g[2]+(g[4]||[]).join('')).indexOf(q)>=0);});
 document.getElementById('list').innerHTML=r.map(function(g){return '<div class="t" id="'+encodeURIComponent(g[0])+'"><b>'+esc(g[0])+'</b> <small>'+esc(g[1])+'</small><span class="ln">'+g[3]+'</span>'+(g[5]?'<span class="ln">수업</span>':'')+'<div class="d">'+esc(g[2])+(g[4]&&g[4].length?'<br><small>같은 말·관련: '+esc(g[4].join(', '))+'</small>':'')+'</div></div>';}).join('')||'<p class="s">없습니다.</p>';
 if(location.hash){var e=document.getElementById(location.hash.slice(1));if(e)e.scrollIntoView();}}
document.getElementById('chips').innerHTML=cats.map(function(c){return '<button data-c="'+(c==='전체'?'':c)+'" class="'+(c==='전체'?'on':'')+'">'+c+'</button>';}).join('');
document.getElementById('chips').onclick=function(e){var b=e.target.closest('button');if(!b)return;cat=b.dataset.c;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});draw();};
document.getElementById('q').oninput=draw;draw();
</script></div></body></html>
