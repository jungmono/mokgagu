<style>
:root{--fg:#1d1b18;--muted:#6b665e;--line:#e5e1da;--panel:#faf9f6;--acc:#8a2f22;--sans:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
*{box-sizing:border-box}html{background:#fff}
body{margin:0;background:#fff;color:var(--fg);font-family:var(--sans);padding:20px 14px 70px;word-break:keep-all}
.wrap{max-width:980px;margin:0 auto}
.sa-top{margin:0 0 10px}.sa-close{display:inline-flex;align-items:center;gap:6px;border:2px solid #111;background:#fff;color:#111;border-radius:999px;padding:7px 16px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}.sa-close:hover{background:#f2f0ec}
h1{font-size:clamp(22px,3.4vw,30px);margin:4px 0 6px;text-align:center}#sub{text-align:center}

.empty{border:1.5px dashed #9c9179;border-radius:14px;padding:22px;background:#fbf6ea;line-height:1.8;font-size:15px}

.tbl{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}

.tbl td{vertical-align:top;padding:9px 6px;border-top:1px solid var(--line);font-size:14px;line-height:1.55;text-align:center;word-break:break-word}

.nm{font-weight:800;font-size:15px}.hj{display:block;color:var(--muted);font-size:12px;font-weight:400}
.rm{margin-top:6px;border:1.5px solid #111;border-radius:999px;background:#fff;font-size:13px;font-weight:700;padding:9px 14px;min-height:36px;cursor:pointer;font-family:inherit}
td.d{background:#fdf1ee;font-weight:800;color:var(--acc)}td .df{display:block;font-size:12px;font-weight:700}
td.mu{color:#a39d92}
.fig{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin:6px 0 2px;min-height:0}
.figbox{border:2px solid #111;border-radius:14px;padding:10px 12px 10px;margin:8px auto 12px;max-width:1000px;background:#fff}.fg3{display:grid;grid-template-columns:.6fr 1.1fr 1.5fr;gap:10px;align-items:stretch}.fg3 .fp{display:flex;flex-direction:column}.fg3 .fp>.fs+*{margin-top:auto!important;margin-bottom:auto!important}.fg3 .fp+.fp{border-left:1px solid #e5e1da;padding-left:10px}@media(max-width:760px){.fg3{grid-template-columns:1fr}.fg3 .fp+.fp{border-left:0;padding-left:0;border-top:1px solid #e5e1da;padding-top:10px}}.figt{font-weight:800;font-size:14px;text-align:center;margin-bottom:4px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}.fp{min-width:0}.fp+.fp{border-left:1px solid #e5e1da;padding-left:10px}.fs{font-size:15px;font-weight:800;color:#111;text-align:center;margin-bottom:6px}@media(max-width:560px){.fg{grid-template-columns:1fr}.fp+.fp{border:0;padding:0;margin-top:8px}}.fig{gap:16px;align-items:flex-end}.fi{text-align:center}.fr{border:2px solid #111;border-radius:4px;background:#e9e2d4;margin:0 auto}.fl{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}.fl b{color:#111}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin:12px 0 0}
a.lk{color:var(--acc);font-weight:700;font-size:13px;display:inline-block;padding:10px 4px}
dialog{border:0;padding:0;background:#fff;color:#1d1b18;width:min(640px,96vw);max-height:92vh;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
dialog::backdrop{background:rgba(20,20,24,.6)}
#lb .box{background:#f4f1ea;display:grid;place-items:center;height:min(46vh,420px)}
#lb .box{overflow:hidden}#lb img{display:block;max-width:100%;max-height:min(46vh,420px);width:auto;height:auto;object-fit:contain;user-select:none}
#lb .inf{padding:12px 16px 4px;max-height:28vh;overflow:auto}#lb .inf h3{margin:0 0 6px;font-size:18px}#lb .inf h3 small{font-weight:400;color:#6b665e;margin-left:6px;font-size:14px}
#lb dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0 0 6px}#lb dt{color:#6b665e}#lb dd{margin:0}
#lb .ft{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid #e5e1da}
#lb .ft button{border:2px solid #111;background:#fff;border-radius:999px;padding:8px 18px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer}
#lb-pos{font-size:13px;color:#6b665e}
.pic{touch-action:pan-y}.pic.sw{opacity:.4;transition:opacity .15s}
#cmp-toast2{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;z-index:9;display:flex;gap:12px;align-items:center}#cmp-toast2 button{background:none;border:0;color:#ffd75e;font-weight:800;cursor:pointer;font:inherit;font-weight:800}

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var PH = 'https://jungmono.github.io/mokgagu-photos/photos/';
  /* 공유 링크(#c=도록/번호,도록/번호…)로 들어오면 그 비교를 이 기기의 비교 목록으로 가져온다 */
  (function () {
    var m = location.hash.match(/^#c=(.+)$/); if (!m) return;
    var ks = m[1].split(',').map(function (x) { try { return decodeURIComponent(x); } catch (e) { return ''; } }).filter(Boolean).slice(0, 5);
    if (ks.length) { try { localStorage.setItem('mokgagu_cmp', JSON.stringify(ks.map(function (k) { return { k: k }; }))); } catch (e) {} }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  })();
  function list() { try { var a = JSON.parse(localStorage.getItem('mokgagu_cmp') || '[]'); return Array.isArray(a) ? a.slice(0, 5) : []; } catch (e) { return []; } }

  /* 크기 글자에서 가로·깊이·높이(cm)를 읽는다. 못 읽으면 null */
  function dims(sz, o, b) { return dims0(sz, b); }
  /* 크기 글자 읽기 (사진·실물 비율로 검증한 규칙)
     ① ×로 이은 세 수: 아이옥션(auction)은 높이×깊이×가로 순서, 그 밖의 도록은 가로·깊이 두 수 뒤에 높이.
        앞면(가로)은 깊이보다 긴 쪽으로 본다.
     ② 이름표가 있는 글자: 높이는 「높이」, 가로·깊이는 가로/세로/너비/길이/옆너비 중 두 수 → 큰 쪽이 가로, 작은 쪽이 깊이
        (국립민속박물관은 「너비」가 가로, 「길이」가 깊이라서 이름표 뜻 대신 크기로 가른다) */
  function dims0(sz, b) {
    if (!sz) return null; sz = String(sz).replace(/cm|㎝/g, '');
    var pair = function (x, y, h) { return { w: Math.max(x, y), d: Math.min(x, y), h: h }; };
    var m = sz.match(/^\s*([\d.]+)\s*[×xX]\s*([\d.]+)\s*[×xX]\s*([\d.]+)/);
    if (m) { var A = +m[1], B = +m[2], C = +m[3];
      return b === 'auction' ? pair(B, C, A) : pair(A, B, C); }
    var m2 = sz.match(/높이\s*([\d.]+)\s*[·,/]?\s*([\d.]+)\s*[×xX]\s*([\d.]+)/);
    if (m2) return pair(+m2[2], +m2[3], +m2[1]);
    if ((sz.match(/높이/g) || []).length > 1) return null;      /* 윗부분·아랫부분 따로 적은 것은 원문 그대로 */
    var h = sz.match(/높이\s*([\d.]+)/); if (!h) return null;
    var hs = [], re = /(?:가로|세로|너비|길이|옆너비|깊이|폭)\s*([\d.]+)/g, x;
    while ((x = re.exec(sz))) hs.push(+x[1]);
    if (!hs.length || hs.length > 2) return null;
    if (hs.length === 1) return { w: hs[0], d: null, h: +h[1] };
    hs.sort(function (p, q) { return q - p; });
    return pair(hs[0], hs[1], +h[1]);
  }
  function price(o) { var m = String(o || '').match(/낙찰\s*([\d,]+)원/); if (m) return (+m[1].replace(/,/g, '')).toLocaleString() + '원'; return /유찰/.test(o || '') ? '유찰' : ''; }
  function fmt(n) { return (Math.round(n * 10) / 10).toString(); }

  function render(recs) {
    var n = recs.length;
    if (n < 2) {
      $('sub').textContent = '';
      $('app').innerHTML = '<div class="empty"><b>비교할 기물이 ' + (n ? '한 점뿐' : '아직 없어요') + '.</b><br>도록에서 기물 사진 창을 열고 위쪽의 <b>「비교에 담기」</b>를 누르면 최대 5점까지 담겨요. 두 점 이상 담으면 이 화면에서 나란히 볼 수 있어요.<br><a href="index.html">처음 화면으로</a></div>';
      return;
    }
    $('sub').textContent = n + '점을 나란히 놓았어요. 다른 칸은 색으로 표시됩니다. 사진을 누르면 기물 설명이 열리고, 설명 창에서는 확대·축소(휠·두 번 톡·두 손가락)하고 옆으로 밀면 다음·이전 기물로 넘어가요.';
    var cols = recs.map(function (r) { var rec = r.rec || {}; return { k: r.k, r: rec, n: r.n, dm: dims(rec.size, rec.owner, rec.b), u: rec.h ? PH + rec.b + '/' + encodeURIComponent(rec.pid) + '.jpg' : (r.u || ''), name: String(rec.name || r.n || r.k).replace(/^소장\s*/, ''), f: rec.t && rec.b && rec.n ? 'thumbs/' + rec.b + '/' + rec.n + '.jpg' : '' }; });
    function row(label, vals, num) {
      var present = vals.filter(function (v) { return v !== '' && v != null; });
      var diff = present.length >= 2 && new Set(present.map(String)).size > 1, mn = num ? Math.min.apply(null, present) : null;
      return '<tr><th class="rh" scope="row">' + label + '</th>' + vals.map(function (v) {
        if (v === '' || v == null) return '<td class="mu">—</td>';
        var cls = '', extra = '';
        if (diff) { if (num) { if (v > mn) { cls = ' class="d"'; extra = '<span class="df">+' + fmt(v - mn) + '</span>'; } } else cls = ' class="d"'; }
        return '<td' + cls + '>' + esc(num ? fmt(v) + 'cm' : v) + extra + '</td>';
      }).join('') + '</tr>';
    }
    var h = '<table class="tbl"><tr><th class="rh"></th>' + cols.map(function (c, i) {
      return '<td class="pic"><button type="button" data-i="' + i + '" aria-label="' + esc(c.name) + ' 크게 보기"><img src="' + esc(c.u) + '"' + (c.f ? ' data-f="' + esc(c.f) + '" onerror="if(this.dataset.f&&this.src.indexOf(\'thumbs/\')<0){this.src=this.dataset.f}"' : '') + ' alt="' + esc(c.name) + '"></button><div class="nm">' + esc(c.name) + '</div><button type="button" class="rm" data-rm="' + esc(c.k) + '">빼기</button></td>';
    }).join('') + '</tr>';
    h += row('도록', cols.map(function (c) { return c.r.cat || ''; }));
    h += row('종류', cols.map(function (c) { return (c.r.kind || '').split(' · ')[0]; }));
    h += row('시대', cols.map(function (c) { return c.r.era || ''; }));
    var anyDm = cols.some(function (c) { return c.dm; });
    if (anyDm) {
      h += row('가로', cols.map(function (c) { return c.dm ? c.dm.w : ''; }), true);
      h += row('깊이', cols.map(function (c) { return c.dm && c.dm.d != null ? c.dm.d : ''; }), true);
      h += row('높이', cols.map(function (c) { return c.dm ? c.dm.h : ''; }), true);
      h += '<tr><th class="rh" scope="row">높이÷가로</th>' + cols.map(function (c) { return '<td>' + (c.dm ? (c.dm.h / c.dm.w).toFixed(2) : '—') + '</td>'; }).join('') + '</tr>';
    }
    h += row('크기(표기)', cols.map(function (c) { return c.r.size || ''; }));
    /* 검증: 이름과 읽은 비율이 어긋나면 눈에 띄게 알린다 (사방탁자·층탁자는 높이가 가로보다 커야 하고, 반닫이는 낮고 넓어야 한다) */
    var sus = cols.map(function (c) { var d = c.dm, nm = String(c.name || ''); if (!d) return '';
      if (/사방탁자|[사오삼]층\s*탁자/.test(nm) && !/책장/.test(nm) && d.h < d.w) return '⚠ 높이가 가로보다 작게 읽힘 — 확인 필요';
      if (/반닫이/.test(nm) && !/책반닫이|장|탁자/.test(nm) && d.h > d.w * 1.3) return '⚠ 반닫이치고 높음 — 확인 필요';
      return ''; });
    if (sus.some(Boolean)) h += '<tr><th class="rh" scope="row">검증</th>' + sus.map(function (t) { return '<td style="color:#c0392b;font-weight:700;font-size:12px">' + (t || '') + '</td>'; }).join('') + '</tr>';
    h += row('수종', cols.map(function (c) { return c.r.wood || ''; }));
    if (cols.some(function (c) { return price(c.r.owner); })) h += row('낙찰가', cols.map(function (c) { return price(c.r.owner); }));
    h += row('출처', cols.map(function (c) { return (c.r.owner || '').replace(/\s*·\s*(낙찰|유찰).*$/, ''); }));
    h += '<tr><th class="rh"></th>' + cols.map(function (c) { if (c.k.indexOf('col/') === 0) return '<td><a class="lk" href="collection.html#open=' + encodeURIComponent(c.k.slice(4)) + '">소장품에서 보기 →</a></td>'; return '<td><a class="lk" href="index.html#see=' + encodeURIComponent(c.r.b || c.k.split('/')[0]) + '/' + encodeURIComponent(c.r.pid || c.k.split('/').slice(1).join('/')) + '">도록에서 보기 →</a></td>'; }).join('') + '</tr>';
    h += '</table>';
    /* 앞모습 비율을 같은 눈금으로 — 표 위에 크게 */
    /* 크기 기준: 서안·소반·안궤류 → 소장 안궤, 반닫이·책장·궤류 → 소장 언양반닫이. 기준은 항상 빨간색 */
    var REFS = { a: { name: '소장 안궤', dm: { w: 72.3, d: 33, h: 44.1 } }, b: { name: '언양반닫이', dm: { w: 102.5, d: 49.8, h: 58.4 } } };
    var kinds = cols.map(function (c) { return (c.r.kind || '') + ' ' + (c.name || ''); }).join(' ');
    var rk = /서안|경상(?!도)|소반|안궤|사방탁자/.test(kinds) ? 'a' : /반닫이|책장|책궤|궤|장|농/.test(kinds) ? 'b' : '';
    var RED = '#c8102e', CL = ['#1f5f3a', '#2b5d8a', '#b07a12', '#6b3f8c', '#2a8a8a'], figH = '', fi = 0;
    var items = [];
    cols.forEach(function (c) {
      if (!c.dm) return;
      var isRef = rk && c.k.indexOf('col/') === 0 && (rk === 'a' ? /안궤/ : /언양/).test(c.name || '');
      items.push({ name: c.name, dm: c.dm, color: isRef ? RED : CL[fi++ % CL.length], ref: isRef });
    });
    if (rk && !items.some(function (x) { return x.ref; })) items.unshift({ name: REFS[rk].name, dm: REFS[rk].dm, color: RED, ref: true });
    var fc = items;
    if (fc.length >= 2) {
      var wide = window.innerWidth > 760, pw = wide ? 330 : Math.min(window.innerWidth - 60, 420), pwL = wide ? 150 : Math.min(window.innerWidth - 60, 300);
      var maxW = Math.max.apply(null, fc.map(function (c) { return c.dm.w; })), maxH = Math.max.apply(null, fc.map(function (c) { return c.dm.h; })), sumH = fc.reduce(function (s, c) { return s + c.dm.h; }, 0);
      var sL = Math.min(0.85, (pwL - 20) / maxW, 230 / sumH), base = fc.filter(function (c) { return c.ref; })[0] || fc[0];
      var CU = 'cursor:pointer;';
      var L = '<div class="fp"><div class="fs">크기 비교</div><div style="position:relative;width:' + Math.round(maxW * sL + 4) + 'px;margin:0 auto">';
      L += fc.map(function (c, i) {
        return '<div data-fi="' + i + '" style="' + CU + 'margin:0 0 8px"><div data-c="' + c.color + '" data-k="d" style="width:' + Math.round(c.dm.w * sL) + 'px;height:' + Math.round(c.dm.h * sL) + 'px;border:' + (c.ref ? 3 : 2) + 'px solid ' + c.color + ';background:' + c.color + '18"></div><div style="font-size:11px;color:' + c.color + ';font-weight:700">' + esc((c.name || '').slice(0, 9)) + (c.ref ? ' <span style="font-weight:400;color:#555">· 기준</span>' : '') + '</div></div>';
      }).join('') + '<div style="position:absolute;top:0;bottom:0;left:' + Math.round(base.dm.w * sL) + 'px;border-left:1.5px dashed ' + RED + ';pointer-events:none"></div></div></div>';
      var sM = Math.min(2.0, (pw - 70) / maxW, 330 / maxH);
      var tk = '';
      for (var v = 50; v <= maxW; v += 50) tk += '<div style="position:absolute;left:' + Math.round(v * sM) + 'px;top:0;bottom:0;border-left:1px dashed #ddd;pointer-events:none"></div><div style="position:absolute;left:' + Math.round(v * sM) + 'px;top:100%;width:1px;height:5px;background:#555;pointer-events:none"></div><div style="position:absolute;left:' + (Math.round(v * sM) - 14) + 'px;top:100%;margin-top:6px;width:28px;text-align:center;font-size:10px;color:#444;pointer-events:none">' + v + '</div>';
      for (var v2 = 50; v2 <= maxH; v2 += 50) tk += '<div style="position:absolute;bottom:' + Math.round(v2 * sM) + 'px;left:0;right:0;border-top:1px dashed #ddd;pointer-events:none"></div><div style="position:absolute;bottom:' + Math.round(v2 * sM) + 'px;left:-5px;width:5px;height:1px;background:#555;pointer-events:none"></div><div style="position:absolute;bottom:' + (Math.round(v2 * sM) - 6) + 'px;left:-32px;width:24px;text-align:right;font-size:10px;color:#444;pointer-events:none">' + v2 + '</div>';
      tk += '<div style="position:absolute;left:100%;top:100%;margin:6px 0 0 4px;font-size:10px;color:#444;pointer-events:none;white-space:nowrap">cm</div>';
