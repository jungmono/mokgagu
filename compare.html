<script>
(function () {

    var kinds = cols.map(function (c) { return (c.r.kind || '') + ' ' + (c.name || ''); }).join(' ');

    var RED = '#c8102e', CL = ['#1f5f3a', '#2b5d8a', '#b07a12', '#6b3f8c', '#2a8a8a'], figH = '', fi = 0;
    var items = [];
    cols.forEach(function (c) {
      if (!c.dm) return;
      var isRef = rk && c.k.indexOf('col/') === 0 && (rk === 'a' ? /안궤/ : /언양/).test(c.name || '');
      items.push({ name: c.name, dm: c.dm, color: isRef ? RED : CL[fi++ % CL.length], ref: isRef });
    });

      var maxW = Math.max.apply(null, fc.map(function (c) { return c.dm.w; })), maxH = Math.max.apply(null, fc.map(function (c) { return c.dm.h; })), sumH = fc.reduce(function (s, c) { return s + c.dm.h; }, 0);
      var sL = Math.min(0.85, (pwL - 20) / maxW, 230 / sumH), base = fc.filter(function (c) { return c.ref; })[0] || fc[0];
      var CU = 'cursor:pointer;';
      var L = '<div class="fp"><div class="fs">크기 비교</div><div style="position:relative;width:' + Math.round(maxW * sL + 4) + 'px;margin:0 auto">';
      L += fc.map(function (c, i) {

      }).join('') + '<div style="position:absolute;top:0;bottom:0;left:' + Math.round(base.dm.w * sL) + 'px;border-left:1.5px dashed ' + RED + ';pointer-events:none"></div></div></div>';

      var M = '<div class="fp"><div class="fs">겹쳐 보기</div><div style="position:relative;margin:0 auto 18px;width:' + Math.round(maxW * sM) + 'px;height:' + Math.round(maxH * sM) + 'px">' + fc.map(function (c, i) { return '<div data-fi="' + i + '" data-c="' + c.color + '" data-k="d" style="' + CU + 'position:absolute;left:0;bottom:0;width:' + Math.round(c.dm.w * sM) + 'px;height:' + Math.round(c.dm.h * sM) + 'px;border:' + (c.ref ? 3 : 2) + 'px solid ' + c.color + ';background:' + c.color + '14"></div>'; }).join('') + '<div style="position:absolute;left:-4px;bottom:-4px;width:8px;height:8px;border-radius:50%;background:#111;pointer-events:none"></div></div></div>';

      if (f3.length >= 2) {
        var K = 0.866, P = function (x, y, z, s) { return [(x - y) * K * s, (x + y) * 0.5 * s - z * s]; };
        var mw = Math.max.apply(null, f3.map(function (c) { return c.dm.w; })), md = Math.max.apply(null, f3.map(function (c) { return c.dm.d; })), mh = Math.max.apply(null, f3.map(function (c) { return c.dm.h; }));
        var cr = [[0, 0, 0], [mw * 1.1, 0, 0], [mw, md, 0], [0, md * 1.1, 0], [0, 0, mh * 1.1], [mw, 0, mh], [mw, md, mh], [0, md, mh]].map(function (p) { return P(p[0], p[1], p[2], 1); });
        var mnx = Math.min.apply(null, cr.map(function (p) { return p[0]; })), mxx = Math.max.apply(null, cr.map(function (p) { return p[0]; })), mny = Math.min.apply(null, cr.map(function (p) { return p[1]; })), mxy = Math.max.apply(null, cr.map(function (p) { return p[1]; }));

        var o0 = T(0, 0, 0);
        svg += '<circle cx="' + o0[0] + '" cy="' + o0[1] + '" r="4" fill="#111"/></svg>';
        var lg = '<div style="display:flex;flex-direction:column;gap:6px;justify-content:center;font-size:13px;min-width:110px">' + fc.map(function (c, i) { return '<span data-fi="' + i + '" style="cursor:pointer;display:flex;align-items:center;gap:6px;color:#222;padding:6px 8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent"><i style="width:14px;height:14px;border-radius:3px;background:' + c.color + ';flex:none"></i>' + esc((c.name || '').slice(0, 9)) + '</span>'; }).join('') + '</div>';
        R = '<div class="fp"><div class="fs">입체 겹쳐 보기</div><div style="display:flex;flex-wrap:' + (wide ? 'nowrap' : 'wrap') + ';align-items:center;justify-content:center;gap:6px">' + svg + lg + '</div>' + (f3.length < fc.length ? '<div style="font-size:11px;color:#777;text-align:center">깊이 정보가 없는 ' + (fc.length - f3.length) + '점은 빠졌어요</div>' : '') + '</div>';
      } else R = '<div class="fp"><div class="fs">입체 겹쳐 보기</div><div style="font-size:12px;color:#777;text-align:center;padding:30px 6px">깊이(옆너비) 정보가 있는 기물이 둘 이상이어야 그려져요</div></div>';
      var leg = '';
      figH = '<div class="figbox" id="fb" style="touch-action:manipulation"><div class="figt">크기를 같은 눈금으로 놓으면' + (rk ? ' <small style="font-weight:400;color:' + RED + '">· 빨간색은 우리 ' + (rk === 'a' ? '안궤' : '언양반닫이') + '(기준)</small>' : '') + '</div><div class="fg3">' + L + M + R + '</div>' + leg + '<div style="text-align:center;font-size:11px;color:#777;margin-top:4px">기물을 누르면 돋보입니다. 빨간 기준 기물을 누르면 색 채움이 켜지고 꺼집니다.</div></div>';
      window.__fc = fc;
    }
    h += '<p class="note">크기는 도록에 적힌 글자를 읽어서 가로·깊이·높이로 나눈 것이고, <b>「가로×깊이×높이」 순서로 적힌 도록</b>이라고 보고 읽었습니다. 도록마다 표기가 달라 읽지 못한 것은 「크기(표기)」 줄에 원문 그대로 둡니다. 「길이」는 가로, 「너비」는 깊이로 읽었습니다. 앞모습 그림은 같은 눈금으로 그린 대략의 비율입니다.</p>';
    h = h.replace('<table class="tbl">', figH + '<table class="tbl">');
    $('app').innerHTML = h;
    var fb = $('fb'), fcs = window.__fc;
    if (fb && fcs) {
      var sel = -1, refOn = true, SA = ['48', '78', '30'];
      var apply = function () {
        fb.querySelectorAll('[data-fi]').forEach(function (e) {
          var i = +e.getAttribute('data-fi'), c = fcs[i], on = sel === i, strong = c.ref ? refOn : on;
          e.style.opacity = (sel >= 0 && !on) ? (c.ref ? .6 : .16) : 1; e.style.transition = 'opacity .2s';
          var paint = function (n) { var k = n.getAttribute('data-k'), col = n.getAttribute('data-c'); if (k === 'd') n.style.background = col + (strong ? '55' : (n.parentNode.style.position === 'relative' ? '14' : '18')); else n.style.fill = col + (strong ? SA[+k] : ['1c', '38', '10'][+k]); };
          if (e.hasAttribute('data-c')) paint(e); e.querySelectorAll('[data-c]').forEach(paint);
          if (e.tagName === 'SPAN') e.style.fontWeight = on ? 900 : 400;
        });
      };
      fb.addEventListener('click', function (ev) {
        var e = ev.target.closest && ev.target.closest('[data-fi]');
        if (!e) { sel = -1; apply(); return; }
        var i = +e.getAttribute('data-fi');
        if (fcs[i].ref) refOn = !refOn; else sel = (sel === i) ? -1 : i;
        apply();
      });
      apply();
    }
  }

  var photos = [], cur = 0, lb = $('lb');
  function openLb(i) { photos = list().map(function (x) { return x; }); cur = i; showLb(); if (!lb.open) lb.showModal(); }
  function showLb() {
    var ph = window.__cols[cur], r = ph.r || {};
    $('lb-img').src = ph.u;
    var row = function (k, v) { return v ? '<dt>' + k + '</dt><dd>' + esc(v) + '</dd>' : ''; };
    var pr = price(r.owner);
    $('lb-inf').innerHTML = '<h3>' + esc(ph.name) + (r.hanja ? '<small>' + esc(r.hanja) + '</small>' : '') + '</h3><dl>' + row('도록', r.cat) + row('종류', (r.kind || '').split(' · ')[0]) + row('시대', r.era) + row('크기', r.size) + row('수종', r.wood) + row('출처', (r.owner || '').replace(/\s*·\s*(낙찰|유찰).*$/, '')) + row('낙찰가', pr) + '</dl>';
    $('lb-pos').textContent = (cur + 1) + ' / ' + window.__cols.length;
  }
  function step(d) { cur = (cur + d + window.__cols.length) % window.__cols.length; showLb(); }
  $('lb-p').onclick = function () { step(-1); }; $('lb-n').onclick = function () { step(1); }; $('lb-x').onclick = function () { lb.close(); };
  /* 사진 확대·축소·끌기·두 번 톡 확대, 좌우로 밀기 — 다른 도록의 기물 창과 같은 손놀림(photozoom.js) */
  if (window.MOKGAGU_PHOTOZOOM) MOKGAGU_PHOTOZOOM.attach({ dialog: lb, area: lb.querySelector('.box'),
    canNext: function () { return window.__cols && window.__cols.length > 1; }, canPrev: function () { return window.__cols && window.__cols.length > 1; },
    next: function () { step(1); }, prev: function () { step(-1); } });
  var sx = null, sy = null;
  lb.addEventListener('pointerdown', function (e) { if (e.target.closest('button') || e.target.closest('.box')) { sx = null; return; } sx = e.clientX; sy = e.clientY; });
  lb.addEventListener('pointerup', function (e) { if (sx == null) return; var dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1); });
  lb.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });

  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#cls')) { window.close(); setTimeout(function () { location.href = 'index.html'; }, 250); return; }
    var b = e.target.closest && e.target.closest('[data-i]');
    if (b) { var ii = +b.getAttribute('data-i'), c = window.__cols[ii];
      if (c && c.k && c.k.indexOf('col/') !== 0) {
        var ks = window.__cols.filter(function (x) { return x.k && x.k.indexOf('col/') !== 0; }).map(function (x) { return x.k; });
        try { sessionStorage.setItem('mokgagu_see_list', JSON.stringify({ list: ks, label: '비교' })); } catch (er) {}
        window.open('index.html#see=' + c.k.split('/')[0] + '/' + encodeURIComponent(c.k.split('/').slice(1).join('/')), '_blank'); return; }
      openLb(ii); return; }
    var r = e.target.closest && e.target.closest('[data-rm]'); if (r) { (function(){var k=r.getAttribute('data-rm');try{var a=list().filter(function(x){return x.k!==k;});localStorage.setItem('mokgagu_cmp',JSON.stringify(a));}catch(er){}start();})(); }
  });

  var idx = null;
  function start() {
    var a = list();
    function go() {
      var by = {}; (window.SEARCH || []).forEach(function (r) { by[r.b + '/' + r.pid] = r; });
      var recs = a.map(function (x) { return { k: x.k, n: x.n, u: x.u, rec: x.rec || by[x.k] }; });
      window.__cols = recs.map(function (r) { var rec = r.rec || {}; return { u: rec.h ? PH + rec.b + '/' + encodeURIComponent(rec.pid) + '.jpg' : (r.u || ''), name: rec.name || r.n || r.k, r: rec, k: r.k }; });
      render(recs);
    }
    if (a.length < 2) { render(a.map(function (x) { return { k: x.k, n: x.n, u: x.u, rec: x.rec }; })); return; }
    if (window.SEARCH) { go(); return; }
    $('app').innerHTML = '<div class="empty">불러오는 중…</div>';
    if (!idx) idx = new Promise(function (ok) { var s = document.createElement('script'); s.src = 'search.js'; s.onload = ok; s.onerror = ok; document.head.appendChild(s); });
    idx.then(go);
  }
  start();
})();
