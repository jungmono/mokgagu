<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이화여자대학교 박물관 목기·목가구 — 조선의 목가구</title>
<meta name="color-scheme" content="light">
<style>
:root{--fg:#1d1b18;--muted:#6b665e;--line:#e5e1da;--panel:#faf9f6;--accent:#8a2f22;
  --sans:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;--serif:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo","Batang",serif}
*{box-sizing:border-box}
html{background:#fff}
body{margin:0;background:#fff;color:var(--fg);font-family:var(--sans);padding:24px 16px 48px;word-break:keep-all}
.wrap{max-width:1200px;margin:0 auto}
.sa-top{max-width:1200px;margin:0 auto 18px}
.sa-home{display:inline-flex;align-items:center;gap:10px;color:#111;background:#fff;border:2px solid #111;border-radius:999px;padding:8px 18px;box-shadow:0 4px 14px rgba(0,0,0,.12);transition:transform .15s,background .15s}
.sa-home:hover{background:#f2f0ec;transform:translateY(-1px)}
.sa-home img{height:34px;width:auto;display:block}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:4px 0 8px}
ul.lead{margin:0 0 20px;padding-left:20px;color:#3b3833;line-height:1.75;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 22px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.tile .k{font-size:13px;color:var(--muted)}.tile .v{font-family:var(--serif);font-size:28px;margin-top:4px}.tile .v small{font-size:14px;color:var(--muted);margin-left:2px}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}button.tile:hover{border-color:#bdb6aa}button.tile.on{border-color:#1d1b18;box-shadow:inset 0 0 0 1px #1d1b18}
.zbar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3}.zbar button{width:34px;height:34px;border-radius:8px;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;font-size:17px;line-height:1}
.zhint{position:absolute;left:10px;bottom:12px;font-size:11.5px;color:#6b665e;background:rgba(255,255,255,.85);border-radius:6px;padding:2px 7px;z-index:3}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 16px}
.filters .lab{font-size:13px;color:var(--muted);min-width:44px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--fg);font-family:inherit}
.chip:hover{border-color:#bdb6aa}.chip.on{background:#1d1b18;color:#fff;border-color:#1d1b18}.chip .n{opacity:.6;margin-left:4px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;padding:0;font:inherit;color:inherit;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.09);transform:translateY(-2px)}
.card .ph{aspect-ratio:4/3;background:#f6f4f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:contain}
.card .ph .no{font-size:13px;color:var(--muted)}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.badge{display:inline-block;width:max-content;font-size:11.5px;font-weight:700;color:var(--accent);border:1px solid #e8cfc8;background:#fbf4f2;border-radius:6px;padding:2px 7px}
.nm{font-family:var(--serif);font-size:18px;line-height:1.35}
.hj{font-size:13px;color:var(--muted)}
.mt{font-size:12.5px;color:var(--muted);line-height:1.5}
.pc{font-size:11.5px;color:var(--muted)}
p.note{font-size:13px;color:var(--muted);line-height:1.7;margin-top:28px}
dialog{border:0;border-radius:14px;padding:0;width:min(1180px,96vw);max-height:94vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,18,15,.55)}
.d-body{display:flex;gap:22px;padding:20px;max-height:calc(94vh - 60px);overflow:auto}
.d-img{flex:1.35;min-width:0;display:flex;flex-direction:column;gap:10px}
.d-main{position:relative;background:#f6f4f0;border-radius:10px;min-height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;overscroll-behavior:contain}
.d-main img{max-width:100%;max-height:66vh;object-fit:contain;display:block;transform-origin:0 0;user-select:none;-webkit-user-drag:none;cursor:zoom-in}.d-main.zoomed img{cursor:grab}.d-main.zoomed.drag img{cursor:grabbing}
.d-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;font-size:18px}
.d-arrow.l{left:10px}.d-arrow.r{right:10px}
.d-cap{font-size:12.5px;color:var(--muted)}
.d-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.d-strip button{flex:0 0 auto;width:64px;height:52px;border:2px solid transparent;border-radius:6px;padding:0;background:#f6f4f0;cursor:pointer;overflow:hidden}
.d-strip button.on{border-color:#1d1b18}.d-strip img{width:100%;height:100%;object-fit:cover}
.d-info{flex:1;min-width:0}
.d-info h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:6px 0 2px}
.d-info .hj{margin-bottom:12px}
.d-info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0 0 14px}
.d-info dt{color:var(--muted)}.d-info dd{margin:0}
.d-desc{font-size:14.5px;line-height:1.85;white-space:pre-line;color:#2e2b27}
.d-en{font-size:13px;line-height:1.7;color:var(--muted);margin-top:12px}
.d-en summary{cursor:pointer}
.d-src{display:inline-block;margin-top:14px;font-size:13.5px;color:var(--accent)}
.d-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.d-foot button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--fg)}
@media (max-width:760px){.d-body{flex-direction:column;padding:14px}.d-main{min-height:220px}.d-main img{max-height:46vh}}
.sa-foot{max-width:1200px;margin:40px auto 0;text-align:center;font-size:13px;color:var(--muted);line-height:1.7}
.sa-foot .ft-mark{display:inline-flex;vertical-align:middle;margin-right:8px;font-size:12px;font-weight:900}
.sa-foot .ft-mark span{display:inline-block;min-width:2.9em;padding:.12em .4em;border:1.5px solid #111;line-height:1.2;text-align:center}
.sa-foot .ew-blk{background:#fff;color:#111}.sa-foot .ew-wht{background:#111;color:#fff}
.sa-foot .ft-icon{display:block;margin:18px auto 8px;width:144px;height:auto}

<script>
const ITEMS = [{"id": "E01", "kind": "소반", "name": "나전흑칠 연지문 시명 하엽반", "hanja": "螺鈿黑漆蓮池文詩銘荷葉盤", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "은행나무", "size": "높이 23.2cm, 너비 36cm", "no": "", "kr": "거북 형태의 받침대에 나뭇가지를 꽂은 일주반 형식이다. 연봉오리로 장식된 보조 가지가 꽂혀 천판(天板)을 고정한다. 소반의 윗면[盤面]은 나전으로 연꽃이 핀 연못[蓮池]을 묘사하고 물결 위에 우주의 순환원리를 생각하며 연꽃을 바라보는 심정을 그린 시문(詩文)을 함께 넣었다.\n出于洛負丹書, 北斗南辰精彩奇.\n濂溪霽月, 太極圖圓, 周茂叔去後, 蓮之愛幾人.\n낙수(洛水)에서 나온 거북이의 등에 보이는 붉은 글씨일까.\n북두성이나 남극노인성처럼 정채가 기이하네.\n주렴계의 광풍제월(光風霽月) 같고 <태극도(太極圖)>처럼 둥그네.\n주무숙이 가고 난 뒤에 연꽃을 사랑하는 사람은 몇이나 될까.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/calligraphy.do?mode=view&articleNo=11670&article.offset=0&articleLimit=8", "pics": [{"src": "photos/ewha/E01.jpg", "w": 1500, "h": 1736}]}, {"id": "E02", "kind": "소반", "name": "주흑칠 원반", "hanja": "朱黑漆圓盤", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "은행나무(누리집 영문명 기준)", "size": "높이 29.5cm", "no": "", "kr": "소반은 좌식생활을 하는 우리의 주거환경에 맞추어 발달한 식탁이면서 주방과 거실이 분리된 생활공간에서 음식을 그릇에 담아 나르는 운반기능을 겸한 조선시대에 발달한 생활용구이다. 또한 민간이나 궁중에서 모두 사용하였으며 칠을 한 상은 궁중에서 사용하던 것이다. 이 반은 여러 쪽의 판을 맞이음하여 원통형 다리를 만들고 변죽이 낮은 접시형 반 전체에 주칠(朱漆)을 한 후 가장자리에는 다시 덧칠을 하였다. 흑칠을 한 원통형 다리 세 곳에 여의두형(如意頭形) 창을 투각하고 둘레를 살짝 파내어 주칠을 하였는데, 주칠을 한 천판과의 조화를 고려한 것이다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/calligraphy.do?mode=view&articleNo=9463&article.offset=0&articleLimit=8", "pics": [{"src": "photos/ewha/E02.jpg", "w": 1736, "h": 1736}]}, {"id": "E03", "kind": "소반", "name": "흑칠 풍혈반", "hanja": "黑漆風穴盤", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "소나무", "size": "높이 28.4cm, 지름 49cm", "no": "", "kr": "이 소반은 천판(天板) 뒷면에 `뎡미가례시 순화궁 고간 이뉴 듕쇼 삼ᄡᅡᆼ`이라는 명문이 있어 1847년 헌종(1827~1849)과 경빈 김씨(1832~1907)의 가례에서 사용된 것으로 추정된다. 순화궁(順化宮)은 경빈 김씨의 궁호이다.\n※ 누리집의 시대 칸에는 「조선 1837년」으로 적혀 있으나, 해설의 가례 연도(1847년)와 맞지 않아 이 도록에는 「조선 19세기」로 적었습니다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10453&article.offset=48&articleLimit=8", "pics": [{"src": "photos/ewha/E03.jpg", "w": 1800, "h": 1368}]}, {"id": "E04", "kind": "소반", "name": "십이각 풍혈반", "hanja": "十二角風穴盤", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "은행나무", "size": "높이 26.4cm, 지름 37cm", "no": "", "kr": "이 소반은 천판(天板) 뒷면에 `뎡미가례시 순화궁 고간 이뉴 듕쇼 삼ᄡᅡᆼ`이라는 명문이 있어 1847년 헌종(1827~1849)과 경빈 김씨(1832~1907)의 가례에서 사용된 것으로 추정된다. 순화궁(順化宮)은 경빈 김씨의 궁호이다.\n※ 누리집 시대 칸에는 「조선 1847년」으로 적혀 있습니다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10454&article.offset=48&articleLimit=8", "pics": [{"src": "photos/ewha/E04.jpg", "w": 1800, "h": 1566}]}, {"id": "E25", "kind": "소반", "name": "주흑칠 호족 원반", "hanja": "朱黑漆虎足圓盤", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "은행나무", "size": "높이 35cm, 지름 72cm", "no": "", "kr": "이 원반은 궁중용 소반으로, 둥근 천판의 뒷면에 `임진년 삼월일 운현궁`이라는 음각 명문이 있어 1892년 흥선대원군 이하응(李昰應, 1820~1898)의 거처였던 운현궁(雲峴宮)에서 사용되었던 것임을 알 수 있다.\n※ 누리집 시대 칸에는 「조선 1892년」으로 적혀 있습니다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10496&article.offset=88&articleLimit=8", "pics": [{"src": "photos/ewha/E25.jpg", "w": 1800, "h": 1483}]}, {"id": "E05", "kind": "탁자·책장", "name": "시명 사층 책탁자", "hanja": "詩銘四層冊卓子", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "오동나무, 가래나무", "size": "높이 118.4cm", "no": "", "kr": "이 탁자는 높이도 낮고 폭도 좁은 책탁자로 장식 없이 소박하게 제작되었다. 작은 규모와는 대조적으로 2층과 4층의 문짝에는 예서체의 오언 율시가 가득 음각되어 짙은 문기(文氣)를 풍긴다. 이처럼 탁자 전면에 시를 조각한 예는 많지 않다.\n淸溪白石上   맑은 시내 흰 돌 위\n垂釣坐柳陰   버드나무 그늘 아래 낚시 드리우고 앉으니\n群籟雖參差   뭇 산소리들 시끄럽게 뒤얽혀도\n適玖無比親   좋은 옥돌 더할 수 없이 친숙하구나.\n山影富戶入   산 그림자 집 안에 드리우고\n花露落硏香   꽃이슬 벼루 위에 떨어지니\n大矣造化功   크구나 조화의 공이여\n萬殊莫不均   만 가지 다른 것들이 고르지 않은 게 없구나.\n一院花爭發   뜨락 꽃들 다투어 피니\n香色僚閑人   향그러운 빛깔 한인을 희롱하는구나.\n鎭日無事坐   하루 내 일없이 앉아 있으니\n峀雲亦無心   산구름도 역시 무심하구나.\n爾從山中來   너는 산 속에서 왔을 터인데\n早晩發天目   호수로 언제 떠났나.\n風月多佳懷   바람과 달 속에 아름다운 회포 많으니\n登臨意自閒   산 위에 오르면 한가롭겠지.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/calligraphy.do?mode=view&articleNo=9462&article.offset=0&articleLimit=8", "pics": [{"src": "photos/ewha/E05.jpg", "w": 1300, "h": 1736}]}, {"id": "E06", "kind": "탁자·책장", "name": "사층 탁자", "hanja": "四層卓子", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "배나무, 오동나무, 자단목", "size": "높이 163.5cm", "no": "", "kr": "탁자는 책이나 완상용 문방구 등을 두기 위해 여러층으로 만든 서재용 가구이다. 이 탁자는 사면이 뚫린 사층 탁자로 하부에 책이나 물건을 수납할 수 있는 서랍과 장이 있어 실용적이다. 판재는 화류와 오동나무로, 기둥은 배나무로 만들었다. 단순한 구조 속에서 나뭇결의 아름다움을 최대한 표현하여 세련된 형태와 비례를 자랑하고 있다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10461&article.offset=56&articleLimit=8", "pics": [{"src": "photos/ewha/E06.jpg", "w": 1310, "h": 1800}]}, {"id": "E07", "kind": "탁자·책장", "name": "오층 탁자", "hanja": "五層卓子", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "은행나무", "size": "높이 186.5cm", "no": "", "kr": "5층으로 나뉜 이 탁자의 면분할은 중국 청나라의 탁자형식을 취하고 있으며 각 층널의 난간에는 만(卍)자, 화문(花文) 바탕에 오언시(五言詩)가 섬세하게 투조되어 있다. 이와 더불어 아래 여닫이문에서는 나전장식과 자연의 나뭇결이 조화를 이루고, 양 옆면에는 여의두, 불로초, 운보문을 양각하고, 장롱 등에 주로 사용되는 구족형 발을 설치하는 등 기존의 탁자와는 다른 섬세하고 화려한 장식이 가미된 독특한 탁자이다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10477&article.offset=72&articleLimit=8", "pics": [{"src": "photos/ewha/E07.jpg", "w": 1312, "h": 1800}]}, {"id": "E08", "kind": "탁자·책장", "name": "반닫이 탁자", "hanja": "半닫이卓子", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "느티나무, 소나무, 가래나무", "size": "높이 112cm", "no": "", "kr": "이 3층 탁자는 1층은 반닫이 형태, 2층은 여닫이문이 달린 형태, 3층은 4면이 뚫려있는 형태 등 다양한 형식으로 제작되었다. 책과 문방소품을 수장할 수 있는 탁자로 1층과 2층의 나뭇결과 장석이 대조를 이루며 다채로운 미감을 보여준다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10471&article.offset=64&articleLimit=8", "pics": [{"src": "photos/ewha/E08.jpg", "w": 1384, "h": 1800}]}, {"id": "E09", "kind": "탁자·책장", "name": "이층 책장", "hanja": "二層冊欌", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "느티나무, 소나무, 배나무, 자단목", "size": "높이 85.5cm", "no": "", "kr": "이 책장은 배나무를 골조로 하고 가운데 문짝은 느티나무의 나무결을 살려 제작된 작은 크기의 책장이다. 테두리와 기둥부분의 배나무는 넓이를 넉넉하게 하여 안정감을 주었다. 백동의 수선화 장식과 간결한 경첩은 19세기 후반이나 20세기 초반에 제작된 것으로 추정케 한다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10466&article.offset=56&articleLimit=8", "pics": [{"src": "photos/ewha/E09.jpg", "w": 1358, "h": 1800}]}, {"id": "E10", "kind": "장·농", "name": "화각 4층 장", "hanja": "華角四層欌", "cls": "목공예(이화여대박물관 분류)", "era": "20세기 초", "mat": "오동나무, 가래나무", "size": "높이 96cm", "no": "", "kr": "화각(華角)이란 소의 뿔을 얇게 펴서 매끄럽게 만든 후, 그 위에 채색 그림을 그려 장식하는 기법이다. 이 화각장은 머릿장 또는 버선장으로 불리우는 아주 작은 규모의 4층 장이다. 층마다 운룡문(雲龍文), 쌍희자(雙喜字), 복자(福字) 등을 좌우대칭으로 배치하여 균형을 이루고 있으며, 길상과 부귀를 나타내는 다양한 문양을 백(白)·흑(黑)·적(赤)·황(黃)·녹(綠)·금채(金彩) 6색으로 장식하였다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/calligraphy.do?mode=view&articleNo=9460&article.offset=0&articleLimit=8", "pics": [{"src": "photos/ewha/E10.jpg", "w": 1200, "h": 1736}]}, {"id": "E11", "kind": "장·농", "name": "이층 장", "hanja": "二層欌", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "느티나무", "size": "높이 134.5cm", "no": "", "kr": "장은 여성들의 생활공간이었던 안방의 주된 가구로, 의복이나 기타 생활용품을 보관하였다. 농과 달리 층이 분리되지 않는 일체형인 것이 특징이다. 용도와 보관물의 규모에 따라 단층이나 2·3층 등으로 구성된다. 여닫이로 된 문이 층마다 달려있으며 일부 서랍이 달린 것도 있다. 내부는 의복을 넣을 수 있는 공간으로 나뉘어 있다. 용도에 따라 의장, 의걸이장, 버선장, 이불장 등 다양한 쓰임새를 보이며 재료에 따라 죽장, 나전장, 화각장 등으로 제작되었다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/calligraphy.do?mode=view&articleNo=9459&article.offset=0&articleLimit=8", "pics": [{"src": "photos/ewha/E11.jpg", "w": 1500, "h": 1736}]}, {"id": "E12", "kind": "장·농", "name": "삼층 장", "hanja": "三層欌", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "느티나무", "size": "높이 164cm", "no": "", "kr": "이 장은 앞면과 골재를 느티나무로 만든 3층 장이다. 문판은 나무결이 좋은 면을 골라 서로 좌우대칭이 되도록 하였다. 만자문(卍字文)이 투각된 경첩과 팔괘문(八卦文)이 투각된 둥근 앞바탕을 주석장식으로 달았다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10482&article.offset=72&articleLimit=8", "pics": [{"src": "photos/ewha/E12.jpg", "w": 1428, "h": 1800}]}, {"id": "E13", "kind": "장·농", "name": "의걸이장", "hanja": "衣巨里欌", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "가래나무, 소나무", "size": "높이 174.5cm", "no": "", "kr": "이 의걸이 장은 소나무 판재를 불에 그을린 후 볏짚으로 문질러 색감을 냈고 가래나무로 된 단단한 골재와 간결한 주석 장식이 이와 어울려 담백한 느낌을 준다. 중앙의 쥐꼬리 자물쇠 장식 하나로 긴 문짝을 고정시키면 위아래 부분이 밖으로 벌어지기 쉬우므로 작은 고정쇠를 달아 보완했다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/calligraphy.do?mode=view&articleNo=9461&article.offset=0&articleLimit=8", "pics": [{"src": "photos/ewha/E13.jpg", "w": 1300, "h": 1736}]}, {"id": "E26", "kind": "장·농", "name": "시명 의걸이장", "hanja": "詩銘衣巨里欌", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기-20세기 초", "mat": "배나무, 오동나무", "size": "높이 164.5cm", "no": "", "kr": "이 의걸이는 전형적인 의걸이장 형식으로 넓고 긴 두 짝의 문이 있는 2층 구조이다. 배나무 골재에 오동나무 판재를 사용하였으며 오동나무 표면을 인두로 지진 후 볏짚으로 문질러 나뭇결을 살리는 낙동법(烙桐法)을 사용하였다. 문판에 예서체로 잠언과 오언시를 음각하고 그 위에 아교와 황색 안료를 혼합하여 글씨가 돋보이도록 하였다.\n積金以遺子孫, 不能盡守   돈을 모아서 자손에게 남겨 주어도 다 지킬 수 없고\n積書以遺子孫, 不能盡讀   책을 모아서 자손에게 물려주어도 다 읽을 수 없으니\n積德於冥中, 以爲子孫計   남모르는 가운데 덕을 쌓아 자손을 위한 계책으로 삼는다.\n正其義不謀其利   그 의리를 바르게 하고 그 이익을 도모하지 않으며\n明其道不計其功   그 도리를 밝히고 그 공적을 계산하지 않는다.\n己所不欲, 勿施於人   자기가 하고자 하지 않는 바이면, 남에게 베풀지 말라.\n行有不得, 返求諸己   해도 되지 않는 일이 있으면 자신에게서 그 원인을 찾아야 한다.\n草堂春睡足   초당의 봄잠이 넉넉하고\n窓外日遲遲   창 밖에 해가 더디 가네.\n大夢誰先覺   큰 꿈을 누가 먼저 깰까\n平生我自知   평소에 나는 스스로 아네.\n松下問童子   소나무 아래서 동자에게 물으니\n言師採藥去   스승님은 약을 캐러 가셨어요.\n只在此山中   다만 이 산중에 계시겠지만\n雲深不知處   구름이 깊어 계신 곳을 모릅니다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10498&article.offset=88&articleLimit=8", "pics": [{"src": "photos/ewha/E26.jpg", "w": 1308, "h": 1800}]}, {"id": "E27", "kind": "장·농", "name": "죽장 이층 농", "hanja": "竹張二層籠", "cls": "목공예(이화여대박물관 분류)", "era": "20세기 초", "mat": "대나무, 참죽나무", "size": "높이 93.5cm", "no": "", "kr": "죽장(竹張)은 나무로 된 백골(白骨) 위에 얇고 편편한 대나무를 씌워 붙인 것이다. 이 가구는 죽피(竹皮)에 검은 반점이 있는 반죽(斑竹)의 효과를 낸 대나무를 사용하였다. 경첩이나 앞바탕으로 인해 힘을 많이 받는 문변자(門邊子)나 벽선(壁線) 부분에는 단단한 참죽나무를 대나무처럼 만들어 붙였다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10508&article.offset=104&articleLimit=8", "pics": [{"src": "photos/ewha/E27.jpg", "w": 1499, "h": 1800}]}, {"id": "E28", "kind": "장·농", "name": "나전흑칠 귀갑문 이층 농", "hanja": "螺鈿黑漆龜甲文二層籠", "cls": "목공예(이화여대박물관 분류)", "era": "20세기 초", "mat": "소나무", "size": "높이 114.7cm", "no": "", "kr": "농은 장과 함께 안방에서 사용된 대표적인 가구로 의복 등을 보관하는 데 사용되었다. 농은 장과 달리 각 층이 분리되는 형태로, 이동하거나 포개어 쌓아놓기에 편리하게 제작되었다. 이 농은 끊음질 기법을 사용하여 농의 앞면과 양 측면을 귀갑문으로 촘촘하게 장식하였는데 장인들의 정교하고 섬세한 기술을 보여 준다.\n* 끊음질 기법 : 일정한 크기로 가늘고 길게 오려낸 자개를 이어 붙이는 방법으로, 기하무늬를 구성하거나 산수화의 필선을 따라 섬세하고 정교한 표현을 할 때 사용하는 기법이다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10515&article.offset=104&articleLimit=8", "pics": [{"src": "photos/ewha/E28.jpg", "w": 1488, "h": 1800}]}, {"id": "E29", "kind": "장·농", "name": "나전주칠 십장생문 삼층 장", "hanja": "螺鈿朱漆十長生文三層欌", "cls": "목공예(이화여대박물관 분류)", "era": "20세기 초", "mat": "소나무", "size": "높이 181cm", "no": "", "kr": "이 장은 한 쌍의 여성용 옷장이다. 맨 위층이 따로 분리되도록 제작하여 운반과 사용이 편리하게 하였다. 주칠과 백동 장석이 잘 어우러지며, 자개로 십장생을 비롯한 꽃, 새, 산수누각 등을 장식하였다. 자개를 무늬대로 오려내어 붙이는 줄음질 기법과 가늘고 길게 오려낸 자개를 이어 붙이는 끊음질 기법으로 장 전면이 화려하게 장식되어 있다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10516&article.offset=112&articleLimit=8", "pics": [{"src": "photos/ewha/E29.jpg", "w": 1772, "h": 1800}]}, {"id": "E14", "kind": "함·상자", "name": "나전흑칠 십장생문 각게수리", "hanja": "螺鈿黑漆十長生文頂櫃", "cls": "목공예(이화여대박물관 분류)", "era": "20세기 초", "mat": "소나무", "size": "높이 66.2cm, 너비 78.8cm", "no": "", "kr": "각게수리는 안방과 사랑방에서 함께 쓰이던 가구로, 귀금속이나 중요한 문서를 보관하는 데 사용하거나 소형 약장으로 사용하였다. 이를 위해 여닫이문 안에 여러 개의 서랍을 설치하였다.\n이 각게수리는 윗면, 앞면, 양측면과 내부 서랍 앞면에 각각 다른 내용을 한 폭의 그림처럼 자개로 장식되어 있다. 십장생문양으로 장식된 앞문을 열면, 펼쳐진 화첩처럼 한 눈에 여러 그림이 드러나도록 되어 있어 화려함이 더하다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/calligraphy.do?mode=view&articleNo=11669&article.offset=0&articleLimit=8", "pics": [{"src": "photos/ewha/E14.jpg", "w": 1496, "h": 1732}]}, {"id": "E15", "kind": "함·상자", "name": "흑칠 영정함", "hanja": "黑漆影幀函", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "은행나무", "size": "높이 11.3cm, 너비 75.9cm", "no": "", "kr": "이 영정함은 표면 전체에 검은 옻칠을 두텁게 하고 각 면은 거멀잡이 장석으로 견고하게 엮어, 간결하면서도 단정한 느낌을 준다. 선대 조상의 영정을 받들어 보관하던 함으로 둔중하면서도 근엄한 분위기를 나타낸다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10457&article.offset=48&articleLimit=8", "pics": [{"src": "photos/ewha/E15.jpg", "w": 1800, "h": 912}]}, {"id": "E16", "kind": "함·상자", "name": "목제양각 매죽문 담배갑", "hanja": "木製陽刻梅竹文煙草匣", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "가래나무", "size": "높이 5.4cm, 너비 10.5cm", "no": "", "kr": "가래나무로 만들어진 소형의 담배갑으로, 측면에는 대나무, 매화, 국화와 오리를, 천판에는 쌍학을 양각했다. 바탕에는 흑칠을, 무늬에는 황색 칠을 하여 화려함을 더했다. 바닥의 네 귀에는 주석으로 발을 달고 앞에는 박쥐 바탕에 활형 들쇠장석을 달았다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10458&article.offset=48&articleLimit=8", "pics": [{"src": "photos/ewha/E16.jpg", "w": 1800, "h": 1499}]}, {"id": "E17", "kind": "함·상자", "name": "주칠 팔각 갓집", "hanja": "朱漆八角笠函", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "소나무", "size": "높이 22cm, 지름 39cm", "no": "", "kr": "이 함은 팔각의 갓집으로, 여덟 개의 각 모서리에 고춧잎 감잡이를 대었고 정면에는 자물쇠가, 양 측면에는 들쇠가 있다. 겉에는 붉은 칠을 하였고 안에는 붉은 종이를 발랐는데, 바닥 중앙에 십자형으로 나무판을 세우고 주위에 실을 늘여서 갓이 흔들리지 않게 하였다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10480&article.offset=72&articleLimit=8", "pics": [{"src": "photos/ewha/E17.jpg", "w": 1523, "h": 1800}]}, {"id": "E18", "kind": "함·상자", "name": "목제 함", "hanja": "木製函", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "느티나무", "size": "높이 5.2cm, 너비 26cm", "no": "", "kr": "함은 깊은 몸체에 얕은 뚜껑이 있는 소형 상자로, 뚜껑에 경첩을 달아 여닫도록 하기도 하였다. 문서나 인장, 패물, 재화 등 귀중품을 넣는 용도로 앞면에는 자물쇠를 채우도록 되어 있다. 느티나무로 만들어진 이 함은 모서리에 국수형 거멀잡이를, 앞판과 옆판의 이음새에는 큰 약과판 감잡이를 붙여 단단하게 보강했다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10481&article.offset=72&articleLimit=8", "pics": [{"src": "photos/ewha/E18.jpg", "w": 1800, "h": 1544}]}, {"id": "E21", "kind": "함·상자", "name": "나전지장 운문 함", "hanja": "螺鈿紙粧雲文函", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "소나무", "size": "높이 23.2cm, 23.4cm, 너비 67.2cm, 66.8cm", "no": "", "kr": "나무 상자 안팎에 종이를 바른 지함(紙函) 1쌍으로, 겉은 기름먹인 유지(油紙)로 발라 갈색으로 길이 잘 들었으며 안은 닥지 그대로이다. 몸체 앞면 좌우에 자개와 종이장식을 덧붙였다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10484&article.offset=80&articleLimit=8", "pics": [{"src": "photos/ewha/E21.jpg", "w": 1800, "h": 1402}]}, {"id": "E22", "kind": "함·상자", "name": "나전주칠 십장생문 함", "hanja": "螺鈿朱漆十長生文函", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "소나무", "size": "높이 27.5cm, 너비 38.9cm", "no": "", "kr": "쌍으로 제작된 주칠 함으로, 함 전체에 십장생, 봉황, 학, 복숭아, 대나무, 모란문을 나전으로 화려하게 장식했다. 거멀잡이, 들쇠, 경첩 등은 백동을 사용했다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10485&article.offset=80&articleLimit=8", "pics": [{"src": "photos/ewha/E22.jpg", "w": 1800, "h": 1238}]}, {"id": "E23", "kind": "함·상자", "name": "화각 함", "hanja": "華角函", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "소나무", "size": "높이 14.5cm, 너비 21.7cm", "no": "", "kr": "귀중품을 보관했던 소나무 재질의 작은 함으로, 전면을 화각으로 화려하게 장식했다. 얇게 켜서 곱게 마연한 소뿔에 구름, 학, 봉황, 용 등을 민화풍으로 장식했으며, 자물쇠 앞바탕 장석에는 천도(天桃)와 문자문이, 뻗침쇠장석에는 연화문이 장식되어 있다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10488&article.offset=80&articleLimit=8", "pics": [{"src": "photos/ewha/E23.jpg", "w": 1800, "h": 1295}]}, {"id": "E24", "kind": "함·상자", "name": "화각 각게수리", "hanja": "華角頂櫃", "cls": "목공예(이화여대박물관 분류)", "era": "20세기 초", "mat": "피나무", "size": "높이 35.8cm, 너비 36cm", "no": "", "kr": "앞면, 옆면, 윗면을 흰색 소뿔로 구획한 뒤 화각 장식하고, 뒷면을 역시 소뿔로 구획하고 대모장식을 한 각게수리이다. 앞면의 여닫이 문을 열면 내부에 화각이 장식된 3개의 서랍이 있으며 문짝의 뒷면은 8면으로 구획하여 적, 녹색 화각을 장식했다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10513&article.offset=104&articleLimit=8", "pics": [{"src": "photos/ewha/E24.jpg", "w": 1800, "h": 1723}]}, {"id": "E19", "kind": "서안·경상·문방구", "name": "죽장 서안", "hanja": "竹張書案", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "대나무, 소나무", "size": "높이 35.7cm", "no": "", "kr": "서안은 책을 읽거나 글을 쓸 때 사용하는 낮은 책상이다. 이 서안은 장농의 형식을 빌려 깊숙한 공간을 만들고 여러 기물을 수납하기 편리하도록 하였다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10465&article.offset=56&articleLimit=8", "pics": [{"src": "photos/ewha/E19.jpg", "w": 1800, "h": 1402}]}, {"id": "E20", "kind": "서안·경상·문방구", "name": "죽제 매국학문 필통", "hanja": "竹製梅竹鶴文筆筒", "cls": "목공예(이화여대박물관 분류)", "era": "조선 19세기", "mat": "대나무", "size": "높이 17.8cm, 너비 20.5cm", "no": "", "kr": "중앙의 높고 큰 대통(竹筒)을 중심으로 가장자리에 5개의 똑같은 크기의 대통을 붙여서 만든 필통이다. 중앙의 대통에는 말하기를 조심하라는 의미의 `수구여병(守口如甁)`의 네 글자를, 주위의 대통에는 각각 매화, 국화, 학 등을 박지기법으로 장식하였다.\n* 박지기법 : 문양 이외의 배경 부분을 없애서 문양을 도드라지게 보이도록 하는 장식기법", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10468&article.offset=64&articleLimit=8", "pics": [{"src": "photos/ewha/E20.jpg", "w": 1456, "h": 1800}]}, {"id": "E30", "kind": "서안·경상·문방구", "name": "주칠 경상", "hanja": "朱漆經床", "cls": "목공예(이화여대박물관 분류)", "era": "20세기 초", "mat": "소나무", "size": "높이 28.5cm", "no": "", "kr": "경상은 불교와 함께 중국으로부터 도입되어 사찰에서 경전을 읽을 때 사용하었으나 조선 후기에는 서안으로도 제작되었다. 이 경상은 일반민가에서는 사용할 수 없는 주칠이 되어 있고 조각 또한 화려하여 궁중용으로 짐작된다.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10509&article.offset=104&articleLimit=8", "pics": [{"src": "photos/ewha/E30.jpg", "w": 1800, "h": 1408}]}, {"id": "E31", "kind": "서안·경상·문방구", "name": "나전흑칠 시문 서안", "hanja": "螺鈿黑漆詩文書案", "cls": "목공예(이화여대박물관 분류)", "era": "20세기 초", "mat": "소나무", "size": "높이 29.4cm", "no": "", "kr": "서안은 책을 읽거나 글을 쓸 때 사용하는 낮은 책상이다. 이 서안은 윗면과 옆면에 행서체의 시문(詩文)이 자개로 화려하게 장식되어 있다. 소나무 위에 흑칠을 하고 자개로 된 시문을 감입하였지만 매끄럽게 잘 손질되어 있다. 각 면에 배치된 시문의 내용으로 보아 고전에 해박했던 부유한 상류층에서 시문의 길이와 형태를 고려하여 주문 제작해 사용한 것으로 추정된다.\n六經爲庖廚   육경은 고깃간이고\n諸子爲珍羞   제자는 진귀한 음식이며\n百家爲異饌   백가는 특별한 요리이니\n主人之自奉   주인 자신이 먹는 음식을\n得無太侈   너무 사치스럽게 하지 말아야 한다.\n昨夜江邊春水生   어제 밤 강변에 봄물이 불어나더니\n艨艟巨艦一毛輕   전함같이 큰 배가 깃털처럼 둥실 떴네.\n向來枉費推移力   지난번엔 옮기느라 공연히 힘을 썼는데\n此日中流自在行   오늘은 강 가운데서 자유로이 떠가네.\n半畝方塘一鑑開   반 마지기 네모진 연못 한 거울이 열리니\n天光雲影共徘徊   하늘빛 구름 그림자 함께 비치어 보이네.\n問渠那得淸如許   연못아, 너는 어쩌면 이처럼 맑을 수 있나.\n爲有源頭活水來   원천에서 살아있는 물이 나오기 때문이지.", "imp": false, "url": "https://museum.ewha.ac.kr/museum/collection/artifactsSearch.do?mode=view&articleNo=10512&article.offset=104&articleLimit=8", "pics": [{"src": "photos/ewha/E31.jpg", "w": 1800, "h": 1498}]}];

  [['', '전체', ITEMS.length], ...list.map((g) => [g, g, ITEMS.filter((i) => ofn(i) === g).length]).filter((x) => x[2])].forEach(([v, t, n]) => {

const dlg = document.getElementById('dlg'); let cur = 0, pi = 0;

function open_(n) {
  cur = (n + view.length) % view.length; pi = 0; const i = view[cur]; dlg.dataset.cid = 'ewha/' + i.id;
  document.getElementById('d-strip').innerHTML = i.pics.length > 1 ? i.pics.map((p, k) => `<button type="button" data-k="${k}" aria-label="${k + 1}번째 사진"><img loading="lazy" src="${p.src}" alt=""></button>`).join('') : '';
  showPic();
  document.getElementById('d-info').innerHTML = `<span class="badge">${esc(i.kind)}</span>${i.imp ? ' <span class="badge" style="background:#8a2f22">중요</span>' : ''}<h3>${esc(i.name)}</h3><div class="hj">${esc(i.hanja)}</div><dl>
    <dt>시대</dt><dd>${esc(i.era || '—')}</dd><dt>재질</dt><dd>${esc(i.mat || '—')}</dd><dt>크기</dt><dd>${esc(i.size || '—')}</dd>
    <dt>분류</dt><dd>${esc(i.cls || '—')}</dd><dt>소장</dt><dd>이화여자대학교 박물관</dd></dl>
    ${i.kr ? `<div class="d-desc">${esc(i.kr)}</div>` : ''}
    `;
  document.getElementById('d-pos').textContent = `${cur + 1} / ${view.length}`;
  if (!dlg.open) dlg.showModal();
}

/* 사진만 확대·축소 — 휠(또는 Ctrl+휠)·두 손가락·두 번 누르기, 확대한 뒤에는 끌어서 옮기기 */
const zm = document.getElementById('d-main'), zi = document.getElementById('d-img');
let zs = 1, zx = 0, zy = 0; const ptrs = new Map(); let pinch = null, pan = null, moved = false;
function zApply() { zi.style.transform = `translate(${zx}px,${zy}px) scale(${zs})`; zm.classList.toggle('zoomed', zs > 1.01); document.getElementById('p-prev').style.visibility = document.getElementById('p-next').style.visibility = zs > 1.01 ? 'hidden' : ''; }
function zReset() { zs = 1; zx = 0; zy = 0; zApply(); }
function zClamp() {
  if (zs <= 1.01) { zs = 1; zx = 0; zy = 0; return; }
  const w = zi.offsetWidth * zs, h = zi.offsetHeight * zs, W = zi.offsetWidth, H = zi.offsetHeight;
  zx = Math.min(0, Math.max(W - w, zx)); zy = Math.min(0, Math.max(H - h, zy));
  if (w < W) zx = (W - w) / 2; if (h < H) zy = (H - h) / 2;
}
function zAt(cx, cy, ns) {   // cx,cy: 사진 왼쪽 위를 기준으로 한 화면 좌표
  ns = Math.min(8, Math.max(1, ns));
  zx = cx - (cx - zx) * (ns / zs); zy = cy - (cy - zy) * (ns / zs); zs = ns; zClamp(); zApply();
}
const rel = (e) => { const r = zi.getBoundingClientRect(); return [e.clientX - r.left + zx, e.clientY - r.top + zy]; };
zm.addEventListener('wheel', (e) => { if (!zi.src) return; e.preventDefault(); const [x, y] = rel(e); zAt(x, y, zs * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018))); }, { passive: false });
zi.addEventListener('dblclick', (e) => { const [x, y] = rel(e); zAt(x, y, zs > 1.01 ? 1 : 2.5); });
zi.addEventListener('pointerdown', (e) => {
  zi.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = false;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const r = zi.getBoundingClientRect(); pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: zs, cx: (a[0] + b[0]) / 2 - r.left + zx, cy: (a[1] + b[1]) / 2 - r.top + zy }; pan = null; }
  else if (ptrs.size === 1) pan = { x: e.clientX, y: e.clientY, zx, zy };
});
zi.addEventListener('pointermove', (e) => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && ptrs.size >= 2) { const [a, b] = [...ptrs.values()]; zAt(pinch.cx, pinch.cy, pinch.s * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d); moved = true; return; }
  if (pan) { const dx = e.clientX - pan.x, dy = e.clientY - pan.y; if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
    if (zs > 1.01) { zm.classList.add('drag'); zx = pan.zx + dx; zy = pan.zy + dy; zClamp(); zApply(); } }
});
function zEnd(e) {
  const p = pan; ptrs.delete(e.pointerId); zm.classList.remove('drag');
  if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 1) { const [v] = [...ptrs.values()]; pan = { x: v[0], y: v[1], zx, zy }; return; }
  if (!ptrs.size && p && zs <= 1.01 && moved && e.type === 'pointerup') { const dx = e.clientX - p.x; if (Math.abs(dx) > 50) document.getElementById(dx < 0 ? 'd-next' : 'd-prev').click(); }
  pan = null;
}
zi.addEventListener('pointerup', zEnd); zi.addEventListener('pointercancel', zEnd);
document.getElementById('z-in').onclick = () => zAt(zi.offsetWidth / 2, zi.offsetHeight / 2, zs * 1.5);
document.getElementById('z-out').onclick = () => zAt(zi.offsetWidth / 2, zi.offsetHeight / 2, zs / 1.5);
document.getElementById('z-reset').onclick = zReset;
dlg.addEventListener('close', zReset);
document.getElementById('d-strip').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; pi = +b.dataset.k; showPic(); });
document.getElementById('p-prev').onclick = () => { const i = view[cur]; pi = (pi - 1 + i.pics.length) % i.pics.length; showPic(); };
document.getElementById('p-next').onclick = () => { const i = view[cur]; pi = (pi + 1) % i.pics.length; showPic(); };
document.getElementById('d-prev').onclick = () => open_(cur - 1);
document.getElementById('d-next').onclick = () => open_(cur + 1);
document.getElementById('d-close').onclick = () => dlg.close();
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
document.addEventListener('keydown', (e) => { if (!dlg.open) return; if (e.key === 'ArrowRight') document.getElementById('p-next').click(); if (e.key === 'ArrowLeft') document.getElementById('p-prev').click(); });
(function () { const m = location.hash.match(/^#(H\d+)$/); if (m) { const n = ITEMS.findIndex((i) => i.id === m[1]); if (n >= 0) { view = ITEMS; open_(n); } } })();
render();
</script>
