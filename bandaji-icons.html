<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>도 아이콘 시안</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#fff;color:#2b2418;font-family:"Noto Sans KR",sans-serif}main{max-width:900px;margin:0 auto;padding:16px}h1{font-size:24px}h2{font-size:18px;margin:26px 0 8px}p{color:#7a6c50;margin:0 0 10px}
.r{display:flex;flex-wrap:wrap;gap:8px}.c{display:inline-flex;align-items:center;gap:7px;border:2.5px solid var(--c);color:var(--c);border-radius:12px;padding:6px 13px 6px 7px;font-size:19px;font-weight:900;background:#fff}.c small{font-size:14px;opacity:.9}
.c .i{flex:none;width:34px;height:34px;display:grid;place-items:center}
/* 가: 도장 */.a .i{background:var(--c);color:#fff;border-radius:5px;font-family:"Noto Serif KR",serif;font-weight:900;font-size:15px;line-height:1;padding:0;text-align:center;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 3.5px var(--c);}
.a .i span{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1}
/* 나: 지도 상자 */.b .i{border:2.5px solid var(--c);border-radius:4px;background:#f3e6c4;color:#2b2418;font-family:"Noto Serif KR",serif;font-weight:900;font-size:15px;line-height:1;width:38px;height:30px}
.b .i::after{content:"";position:absolute}
/* 다: 장석 */.d .i svg{width:34px;height:34px}
</style></head><body><main><h1>도 아이콘 시안 3가지</h1><p>「반닫이(궤)여지도」에 어울리게 만든 도 이름표 아이콘이에요. 마음에 드는 것을 알려 주세요.</p>
<h2>가 · 도장(인장) — 붉은 낙관 느낌, 한자 두 글자</h2><div class="r a" id="a"></div>
<h2>나 · 지도 상자 — 선생님 지도의 고을 상자와 같은 모양, 한자 한 글자</h2><div class="r b" id="b"></div>
<h2>다 · 장석 — 반닫이 앞바탕 무쇠 장식 모양에 한자</h2><div class="r d" id="d"></div></main>
<script>
var P=[['평안도','平安','#2f6fb0'],['함경도','咸鏡','#6b4fa3'],['황해도','黃海','#b0572f'],['경기도','京畿','#0F6E56'],['강원도','江原','#c2185b'],['충청도','忠淸','#8a6d00'],['경상도','慶尙','#d4541a'],['전라도','全羅','#1a7a8c'],['제주도','濟州','#5a7d1a']];
function hinge(c,h){return '<svg viewBox="0 0 40 40"><path d="M20 2c3 0 4 4 7 5s7-1 8 3-2 6-1 9 4 5 3 8-5 3-7 5-2 7-5 7-4-3-5-3-3 3-6 3-4-5-6-7-6-2-7-5 2-5 2-8-3-5-2-8 6-1 8-3 3-5 6-5z" fill="'+c+'"/><circle cx="20" cy="20" r="14" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="2 2.4"/><text x="20" y="25.5" text-anchor="middle" font-family="Noto Serif KR,serif" font-weight="900" font-size="'+(h.length>1?13:16)+'" fill="#fff">'+h[0]+'</text></svg>';}
P.forEach(function(p){var s='style="--c:'+p[2]+'"';
 a.innerHTML+='<span class="c" '+s+'><span class="i"><span><b>'+p[1][0]+'</b><b>'+p[1][1]+'</b></span></span>'+p[0]+' <small>12</small></span>';
 b.innerHTML+='<span class="c" '+s+'><span class="i" style="position:relative">'+p[1][0]+'</span>'+p[0]+' <small>12</small></span>';
 d.innerHTML+='<span class="c" '+s+'><span class="i">'+hinge(p[2],p[1])+'</span>'+p[0]+' <small>12</small></span>';});
</script></body></html>
