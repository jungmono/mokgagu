<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>거믄과 힌의 소장품 — 조선의 목가구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('emb');</script>
<script>/* 나란히 보기에서 띄운 기물 창(embed): 이전·다음은 비교한 순서대로 부모(compare)가 넘겨 준다 */
window.MOKGAGU_EMB = {
  on: document.documentElement.classList.contains('emb'),
  all: function () { try { return JSON.parse(sessionStorage.getItem('mokgagu_cmp_all') || '[]'); } catch (e) { return []; } },
  go: function (key, d) { var a = this.all(), i = a.indexOf(key), t = a[i + d]; if (t) parent.postMessage({ t: 'mokgagu-see-go', k: t }, location.origin); },
  label: function (key) { var a = this.all(), i = a.indexOf(key); return i < 0 ? null : { text: '비교 ' + (i + 1) + ' / ' + a.length, first: i === 0, last: i === a.length - 1 }; }
};</script>
<style>
html.emb,html.emb body{background:transparent!important}html.emb body{visibility:hidden!important;overflow:hidden!important}html.emb dialog,html.emb dialog *{visibility:visible}html.emb #vw .acts{display:none}

:root{--fg:#1d1b18;--muted:#7a736a;--line:#e6e1d9;--soft:#f6f4f0;--k:#151311;--brand:#4b55d6;--warn:#8a2f22}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--fg)}
body{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:1180px;margin:0 auto;padding:10px 16px 80px}
button{font:inherit;cursor:pointer}
/* 잠금 */
.lock{max-width:420px;margin:60px auto;text-align:center}
.lock .ic{width:150px;margin:0 auto 18px;padding:20px 18px;background:var(--k);border-radius:16px}
.lock .ic img{width:100%;filter:invert(1);mix-blend-mode:screen;display:block}
.lock h2{margin:0 0 8px;font-size:24px;font-weight:900}
.lock p{margin:0 0 18px;color:var(--muted);line-height:1.6;font-size:14.5px}
.lock form{display:flex;flex-direction:column;gap:10px;align-items:center}
.lock input[type=password]{font:inherit;font-size:18px;letter-spacing:.2em;text-align:center;width:220px;padding:10px;border:1.5px solid var(--fg);border-radius:10px}
.lock label{font-size:13.5px;color:var(--muted)}
.lock .go{border:0;background:var(--k);color:#fff;font-weight:700;border-radius:10px;padding:10px 30px;font-size:15px}
.err{color:var(--warn);font-size:13.5px;min-height:1.2em}
/* 머리 */
.hd{display:flex;align-items:center;gap:22px;background:var(--k);color:#fff;border-radius:18px;padding:22px 26px;margin:14px 0 18px}
.hd .pic{flex:none;width:clamp(96px,14vw,150px)}
.hd .pic img{width:100%;display:block;filter:invert(1);mix-blend-mode:screen}
.hd h1{margin:0;font-size:clamp(24px,3.4vw,34px);font-weight:900;letter-spacing:-.035em}
.hd h1 .ew{display:inline-flex;vertical-align:4px;margin-right:6px}.hd h1 .ew span{display:inline-block;box-sizing:border-box;width:2.9em;text-align:center;font-size:.55em;padding:.1em 0;border:1.5px solid #fff;line-height:1.2}.hd h1 .ew .w{background:#fff;color:var(--k)}
.hd p{margin:6px 0 0;color:#c9c3ba;font-size:14.5px;line-height:1.55}
.hd .out{margin-left:auto;align-self:flex-start;background:none;border:1px solid #5b544c;color:#c9c3ba;border-radius:999px;padding:5px 12px;font-size:12.5px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.add{border:0;background:var(--k);color:#fff;font-weight:700;border-radius:10px;padding:11px 18px;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.add b{font-size:20px;line-height:1}
.bar input[type=search]{flex:1 1 220px;max-width:360px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:9px 16px;outline:none}
.bar input[type=search]:focus{border-color:var(--fg)}
.seg{display:inline-flex;border:1px solid #d9d4cc;border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;font-size:13px;padding:7px 12px;color:#3b3833}.seg button+button{border-left:1px solid #d9d4cc}
.seg button.on{background:var(--fg);color:#fff;font-weight:700}
.stb{position:absolute;left:8px;bottom:8px;background:#fff;color:#8a5a14;border:1.5px solid #c9a35a;font-size:11.5px;font-weight:900;border-radius:999px;padding:1px 9px}.stb.done{color:#fff;background:#6b665e;border-color:#6b665e}.stb.in{position:static;vertical-align:1px;margin-left:4px}
.it .mt.sl{color:#8a5a14;font-weight:700}.seg.st button small{color:inherit;opacity:.65;margin-left:2px}
.who.sts button.on{background:var(--k)!important;color:#fff!important;box-shadow:none!important}
.sold-box{background:#fbf7ec;border:1px solid #eadfbf;border-radius:12px;padding:12px}.sold-box[hidden]{display:none}
.cnt{margin-left:auto;font-size:13.5px;color:var(--muted)}.cnt b{color:var(--fg)}
.note{background:#fbf7ec;border:1px solid #eadfbf;color:#6b5a2a;border-radius:10px;padding:10px 14px;font-size:13.5px;line-height:1.55;margin:0 0 16px}
.note.bad{background:#fbefed;border-color:#ecc9c3;color:var(--warn)}
/* 목록 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.it{display:flex;flex-direction:column;text-align:left;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;transition:box-shadow .15s,transform .15s}
.it:hover{box-shadow:0 10px 26px rgba(0,0,0,.1);transform:translateY(-2px)}
.it:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.it .ph{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;overflow:hidden;position:relative}
.it .ph img{width:100%;height:100%;object-fit:cover}
.it .ph .none{width:46%;opacity:.25}
.it .ph .n{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11.5px;border-radius:999px;padding:2px 8px}
.it .ph .pend{position:absolute;left:8px;top:8px;background:#fbf7ec;color:#6b5a2a;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.it .tx{padding:12px 14px 14px}
.it .nm{font-weight:900;font-size:16.5px;letter-spacing:-.02em;line-height:1.3}
.it .kd{margin-top:3px;font-size:12.5px;color:var(--brand);font-weight:700}
.it .mt{margin-top:4px;font-size:12.5px;color:var(--muted);line-height:1.45}
.ow{display:inline-block;min-width:2.6em;text-align:center;font-size:11px;font-weight:900;padding:0 5px;border:1.5px solid var(--k);margin-right:5px;line-height:1.4;vertical-align:1px}
.ow.g{background:var(--k);color:#fff}.ow.h{background:#fff;color:var(--k)}.ow.b{background:linear-gradient(90deg,var(--k) 50%,#fff 50%);color:transparent;min-width:1.6em}
.empty{grid-column:1/-1;border:2px dashed #d9d4cc;border-radius:16px;padding:46px 20px;text-align:center;color:var(--muted);line-height:1.7}
.empty b{color:var(--fg)}
/* 사진 창 */
dialog{border:none;border-radius:18px;padding:0;width:min(1100px,95vw);max-height:94vh;box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--fg)}
dialog::backdrop{background:rgba(20,20,24,.58)}
.vw{display:flex;gap:22px;padding:20px;max-height:calc(94vh - 62px);overflow:auto}
.vw .big{flex:1 1 60%;min-width:0}
.vw .main{background:#fafaf8;border-radius:12px;min-height:300px;display:grid;place-items:center;overflow:hidden}
.vw .main img{max-width:100%;max-height:64vh;object-fit:contain;display:block}
.vw .main .none{width:40%;opacity:.25;padding:40px 0}
.strip{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.strip button{flex:none;width:64px;height:64px;border:2px solid transparent;border-radius:8px;padding:0;overflow:hidden;background:var(--soft)}
.strip button.on{border-color:var(--fg)}.strip img{width:100%;height:100%;object-fit:cover}
.vw .info{flex:1 1 40%;min-width:240px}
.vw .info h3{margin:2px 0 10px;font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1.25}
.vw dl{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0;font-size:15px}
.vw dt{color:var(--muted)}.vw dd{margin:0;white-space:pre-wrap;word-break:break-word}
.vw .acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.btn{border:1px solid #d9d4cc;background:#fff;color:var(--fg);border-radius:9px;padding:8px 14px;font-size:14px;font-weight:700}
.btn.k{background:var(--k);border-color:var(--k);color:#fff}
.btn.del{color:var(--warn);border-color:#ecc9c3}
.btn:disabled{opacity:.45;cursor:default}
.ft{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 20px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
/* 입력 창 */
.fm{padding:20px 22px;max-height:calc(94vh - 66px);overflow:auto}
.fm h3{margin:0 0 14px;font-size:22px;font-weight:900}
.drop{border:2px dashed #cfc8bd;border-radius:14px;padding:18px;text-align:center;color:var(--muted);background:var(--soft);transition:background .15s,border-color .15s}
.drop.over{background:#efece6;border-color:var(--fg);color:var(--fg)}
.drop b{color:var(--fg)}
.drop .pick{margin-top:8px}
.pics{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.pic{position:relative;width:104px}
.pic .im{width:104px;height:104px;border-radius:10px;overflow:hidden;background:var(--soft);border:2px solid transparent}
.pic.first .im{border-color:var(--fg)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic .x{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--k);color:#fff;font-size:13px;line-height:24px;padding:0}
.pic .mk{display:block;width:100%;margin-top:4px;border:0;background:none;font-size:12px;color:var(--muted);padding:0}
.pic.first .mk{color:var(--fg);font-weight:900}
.pic .bz{position:absolute;inset:0;bottom:22px;display:grid;place-items:center;background:rgba(255,255,255,.75);font-size:12px;border-radius:10px}
.pic .cr-b{display:block;width:100%;margin-top:2px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;font-weight:700;color:var(--fg);padding:3px 0;cursor:pointer}
#cr{border:0;padding:0;border-radius:16px;width:min(980px,96vw);max-height:96vh;background:#1a1918;color:#fff;overflow:hidden}
#cr::backdrop{background:rgba(0,0,0,.7)}
.cr-top{display:flex;align-items:center;gap:10px;padding:12px 16px}.cr-top b{font-size:16px}.cr-sz{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.cr-xx{margin-left:auto;border:0;background:none;color:#fff;font-size:18px;cursor:pointer}
.cr-st{display:flex;justify-content:center;align-items:center;padding:14px 16px;touch-action:none;user-select:none}
.cr-wrap{position:relative;line-height:0}
.cr-clip{position:absolute;inset:0;overflow:hidden;pointer-events:none}.cr-dim{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
#cr-cv{display:block}
.cr-box{position:absolute;outline:2px solid #fff;cursor:move;touch-action:none}
.cr-g{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:33.333% 33.333%;background-position:-1px -1px}
.cr-box i{position:absolute;width:26px;height:26px;z-index:2;touch-action:none}
.cr-box i::after{content:"";position:absolute;inset:8px;background:#fff;border-radius:2px;box-shadow:0 0 2px rgba(0,0,0,.6)}
.cr-box i[data-h=nw]{left:-13px;top:-13px;cursor:nwse-resize}.cr-box i[data-h=se]{right:-13px;bottom:-13px;cursor:nwse-resize}
.cr-box i[data-h=ne]{right:-13px;top:-13px;cursor:nesw-resize}.cr-box i[data-h=sw]{left:-13px;bottom:-13px;cursor:nesw-resize}
.cr-box i[data-h=n],.cr-box i[data-h=s]{left:50%;margin-left:-13px;cursor:ns-resize}.cr-box i[data-h=n]{top:-13px}.cr-box i[data-h=s]{bottom:-13px}
.cr-box i[data-h=e],.cr-box i[data-h=w]{top:50%;margin-top:-13px;cursor:ew-resize}.cr-box i[data-h=e]{right:-13px}.cr-box i[data-h=w]{left:-13px}
.cr-box i[data-h=n]::after,.cr-box i[data-h=s]::after{inset:10px 4px}.cr-box i[data-h=e]::after,.cr-box i[data-h=w]::after{inset:4px 10px}
.cr-ft{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 16px}
.cr-ratio{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.cr-ratio button{border:0;background:none;color:#fff;font:inherit;font-size:13px;padding:6px 11px;cursor:pointer}.cr-ratio button.on{background:#fff;color:#111;font-weight:800}
#cr .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.35)}
#cr .btn.k{margin-left:auto;background:#fff;color:#111;font-weight:800;border-color:#fff}
.fs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px;margin-top:18px}
.fs .full{grid-column:1/-1}
.fs label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:#4a453f}
.fs label small{font-weight:400;color:var(--muted)}
.fs input,.fs textarea,.fs select{font:inherit;font-size:15px;font-weight:400;border:1px solid #d9d4cc;border-radius:9px;padding:9px 11px;background:#fff;color:var(--fg);width:100%}
.fs input:focus,.fs textarea:focus{outline:2px solid var(--fg);outline-offset:-1px;border-color:var(--fg)}
.fs textarea{min-height:80px;resize:vertical;line-height:1.6}
.who{display:flex;gap:6px}
.who button{flex:1;border:1.5px solid var(--k);background:#fff;border-radius:8px;padding:8px 0;font-weight:700}
.who button.on[data-o="거믄"]{background:var(--k);color:#fff}.who button.on[data-o="힌"]{box-shadow:inset 0 0 0 2px var(--k)}.who button.on[data-o="함께"]{background:#5a544d;border-color:#5a544d;color:#fff}
.fbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 22px;border-top:1px solid var(--line)}
.fbar .msg{margin-right:auto;font-size:13.5px;color:var(--muted)}
body.dragging::after{content:"사진을 놓으면 새 소장품으로 넣어요";position:fixed;inset:12px;border:3px dashed var(--fg);border-radius:20px;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:20px;font-weight:900;z-index:50;pointer-events:none}
@media (max-width:720px){.hd{flex-wrap:wrap;padding:18px}.hd .out{margin-left:0}.vw{flex-direction:column;padding:14px}.fs{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.it .nm{font-size:15px}.cnt{margin-left:0;width:100%}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="조선의 목가구">
<script src="common.js?v=13" defer></script>
</head>
<body>
<div class="wrap" id="app"></div>

<dialog id="vw" aria-label="소장품 보기">
  <div class="vw"><div class="big"><div class="main" id="v-main"></div><div class="strip" id="v-strip"></div></div><div class="info" id="v-info"></div></div>
  <div class="ft"><button class="btn" id="v-prev">← 이전</button><span id="v-pos"></span><span style="display:flex;gap:8px"><button class="btn" id="v-next">다음 →</button><button class="btn" id="v-x">닫기</button></span></div>
</dialog>

<dialog id="cr" aria-label="사진 자르기">
  <div class="cr-top"><b>✂ 사진 자르기</b><span class="cr-sz" id="cr-sz"></span><button type="button" class="cr-xx" id="cr-x" aria-label="닫기">✕</button></div>
  <div class="cr-st" id="cr-st"><div class="cr-wrap"><canvas id="cr-cv"></canvas><div class="cr-clip"><div class="cr-dim" id="cr-dim"></div></div><div class="cr-box" id="cr-box"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i><i data-h="n"></i><i data-h="s"></i><i data-h="e"></i><i data-h="w"></i><span class="cr-g"></span></div></div></div>
  <div class="cr-ft"><span class="seg cr-ratio" id="cr-ratio"><button type="button" data-r="0">자유</button><button type="button" data-r="1">1:1</button><button type="button" data-r="1.3333">4:3</button><button type="button" data-r="0.75">3:4</button></span>
    <button type="button" class="btn" id="cr-rot">⟳ 돌리기</button><button type="button" class="btn" id="cr-reset">처음대로</button><button type="button" class="btn k" id="cr-go">자르기</button></div>
</dialog>

<dialog id="fm" aria-label="소장품 넣기">
  <form id="fm-f" novalidate>
    <div class="fm">
      <h3 id="fm-t">소장품 넣기</h3>
      <div class="drop" id="drop"><b>사진을 여기에 끌어다 놓으세요</b><br><small>여러 장 한꺼번에 · 붙여넣기(Ctrl+V)도 돼요 · 처음 사진이 대표 사진</small><div class="pick"><button type="button" class="btn" id="pick">사진 고르기</button><input type="file" id="file" accept="image/*" multiple hidden></div></div>
      <div class="pics" id="pics"></div>
      <div class="fs">
        <label class="full">이름 <small>예: 안궤, 언양 반닫이</small><input name="name" required maxlength="100" autocomplete="off"></label>
        <label>종류<input name="kind" list="kinds" maxlength="40" autocomplete="off"><datalist id="kinds"><option>반닫이</option><option>궤</option><option>안궤</option><option>서안</option><option>경상</option><option>소반</option><option>함</option><option>장·농</option><option>사방탁자</option><option>책장·책궤</option><option>뒤주</option><option>약장</option><option>문갑</option><option>떡살</option><option>도자기</option><option>기타</option></datalist></label>
        <label>누구의 소장품<div class="who" id="who"><button type="button" data-o="거믄">거믄</button><button type="button" data-o="힌">힌</button><button type="button" data-o="함께">함께</button></div></label>
        <label class="full">상태<div class="who sts" id="sts"><button type="button" data-s2="소장">소장</button><button type="button" data-s2="판매 예정">판매 예정</button><button type="button" data-s2="판매함">판매함</button></div></label>
        <div class="full sold-box" id="sold-box"><div class="fs" style="margin-top:0">
          <label>판매일<input type="date" name="sold"></label>
          <label><span id="sp-l">판매가</span><input name="sprice" maxlength="60" autocomplete="off"></label>
          <label class="full">판매처 <small>누구에게, 어디서</small><input name="sto" maxlength="120" autocomplete="off"></label>
        </div></div>
        <label>구입일<input type="date" name="bought"></label>
        <label>구입처 <small>가게·경매·사람·지역</small><input name="place" maxlength="120" autocomplete="off"></label>
        <label>크기 <small>가로×깊이×높이 cm</small><input name="size" maxlength="120" placeholder="72.3 × 33 × 44.2" autocomplete="off"></label>
        <label>구입가 <small>원하면</small><input name="price" maxlength="60" autocomplete="off"></label>
        <label>연대<input name="era" maxlength="80" placeholder="19세기" autocomplete="off"></label>
        <label>재질·수종<input name="wood" maxlength="120" placeholder="느티나무, 무쇠 장석" autocomplete="off"></label>
        <label class="full">비고<textarea name="note" maxlength="6000" placeholder="수리 흔적, 보관 장소, 받은 서류 등"></textarea></label>
        <label class="full">감정·관찰 메모 <small>선생님 말씀, 짜임·못·장석에서 본 것</small><textarea name="memo" maxlength="6000"></textarea></label>
      </div>
    </div>
    <div class="fbar"><span class="msg" id="fm-msg"></span><button type="button" class="btn" id="fm-x">그만두기</button><button type="submit" class="btn k" id="fm-go">저장</button></div>
  </form>
</dialog>

<script src="books.js?v=1"></script><script src="site.js"></script>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyQoDpYNaIA034Inb2J-SaW5-dhstcZQBJWOug7FxJKnP-evddQtprYUontg5GlSvkyBA/exec';
  var K_CODE = 'mokgagu_cm_code', K_STUDY = 'mokgagu_study_pw', K_SORT = 'mokgagu_col_sort', K_OWNER = 'mokgagu_col_owner';
  var $ = function (id) { return document.getElementById(id); }, app = $('app');
  var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  var PW = '', items = [], mode = 'server', note = '', sort = ls.get(K_SORT) || 'new', q = '', stf = ls.get('mokgagu_col_st') || '소장';
  var ST = ['소장', '판매 예정', '판매함'];
  function won(v) { v = String(v == null ? '' : v).trim(); return /^\d{4,}$/.test(v) ? Number(v).toLocaleString('ko-KR') : v; }
  function st(x) { return ST.indexOf(x.status) >= 0 ? x.status : '소장'; }

  /* ── 암호: 공부방과 같은 암호. 공부방 노트를 실제로 풀어 보아 맞는지 이 자리에서 확인한다 ── */
  function b64u(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  async function check(pw) {
    var meta = await fetch('study/salt.json', { cache: 'no-store' }).then(function (r) { return r.json(); });
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64u(meta.salt), iterations: meta.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var buf = new Uint8Array(await fetch('study/data.bin', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('net'); return r.arrayBuffer(); }));
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  }
  function lockView(msg) {
    app.innerHTML = '<div class="lock"><div class="ic"><img src="mark_angwe.png" alt="안궤"></div><h2>가족 암호를 넣어 주세요</h2><p>거믄과 힌의 소장품 도록이에요.<br>암호로 잠가 두어 가족만 볼 수 있어요.</p>' +
      '<form id="f"><input id="pw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password" maxlength="64" aria-label="가족 암호" autofocus>' +
      '<label><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label><button class="go" id="go">열기</button><div class="err" id="err">' + esc(msg || '') + '</div></form></div>';
    $('f').addEventListener('submit', function (e) {
      e.preventDefault(); var pw = $('pw').value.trim(); if (!pw) return;
      var b = $('go'); b.disabled = true; b.textContent = '여는 중…'; $('err').textContent = '';
      check(pw).then(function () {
        PW = pw; if ($('rem').checked) { ls.set(K_STUDY, pw); ls.set(K_CODE, pw); }
        start();
      }).catch(function (er) { b.disabled = false; b.textContent = '열기'; $('err').textContent = er && er.message === 'net' ? '인터넷 연결을 확인해 주세요.' : '암호가 맞지 않아요.'; });
    });
  }

  /* ── 이 기기 안의 저장소(IndexedDB): 사진 캐시, 아직 시트에 못 올린 소장품 ── */
  var dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (ok, no) {
      var r = indexedDB.open('mokgagu_collection', 1);
      r.onupgradeneeded = function () { var d = r.result; d.createObjectStore('img'); d.createObjectStore('local', { keyPath: 'id' }); };
      r.onsuccess = function () { ok(r.result); }; r.onerror = function () { no(r.error); };
    });
    return dbp;
  }
  function tx(store, fn, rw) { return db().then(function (d) { return new Promise(function (ok, no) { var t = d.transaction(store, rw ? 'readwrite' : 'readonly'), s = t.objectStore(store), res = fn(s); t.oncomplete = function () { ok(res && 'result' in res ? res.result : undefined); }; t.onerror = function () { no(t.error); }; }); }); }
  var idb = {
    get: function (st, k) { return tx(st, function (s) { return s.get(k); }); },
    put: function (st, v, k) { return tx(st, function (s) { return k === undefined ? s.put(v) : s.put(v, k); }, true); },
    del: function (st, k) { return tx(st, function (s) { return s.delete(k); }, true); },
    all: function (st) { return tx(st, function (s) { return s.getAll(); }); }
  };

  /* ── 시트와 주고받기 ── */
  function apiGet(params) {
    var b = {}; Object.keys(params).forEach(function (k) { b[k] = params[k]; }); b.code = PW;   // 암호는 주소가 아니라 본문으로
    return fetch(API, { method: 'POST', body: JSON.stringify(b) }).then(function (r) { return r.json(); });
  }
  function apiPost(body) { body.code = PW; return fetch(API, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }

  var urls = {};   // 사진 id → 화면용 주소
  /* 시트에서 사진 받기는 한 번에 4장씩 (한꺼번에 수십 장을 부르면 모두 느려진다) */
  var netQ = [], netN = 0;
  function netGet(id, front) {
    return new Promise(function (ok, no) { var job = { id: id, ok: ok, no: no }; if (front) netQ.unshift(job); else netQ.push(job); pump(); });
  }
  function pump() {
    while (netN < 4 && netQ.length) {
      var j = netQ.shift(); netN++;
      (function (j) { apiGet({ action: 'cimg', id: j.id }).then(j.ok, j.no).then(function () { netN--; pump(); }); })(j);
    }
  }
  var inflight = {};
  function imgURL(id, front) {
    if (!id) return Promise.resolve('');
    if (urls[id]) return Promise.resolve(urls[id]);
    if (inflight[id]) return inflight[id];
    return inflight[id] = idb.get('img', id).catch(function () { return null; }).then(function (blob) {
      if (blob) return blob;
      if (/^L/.test(id)) return null;
      return netGet(id, front).then(function (j) {
        if (!j.ok) return null;
        var b = new Blob([b64u(j.data)], { type: j.type || 'image/jpeg' });
        idb.put('img', b, id).catch(function () {});
        return b;
      });
    }).then(function (b) { delete inflight[id]; return b ? (urls[id] = URL.createObjectURL(b)) : ''; }).catch(function () { delete inflight[id]; return ''; });
  }
  /* 화면에 보이는(곧 보일) 사진부터 채운다. 이 기기에 저장된 사진은 바로 */
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { io.unobserve(e.target); fillOne(e.target, true); } });
  }, { rootMargin: '600px 0px' }) : null;
  function fillOne(im, front) {
    var id = im.dataset.pid; if (!id) return; im.removeAttribute('data-pid');
    imgURL(id, front).then(function (u) { if (u) im.src = u; else im.replaceWith(Object.assign(document.createElement('img'), { src: 'mark_angwe.png', className: 'none', alt: '' })); });
  }
  function fillImgs(root) {
    (root || document).querySelectorAll('img[data-pid]').forEach(function (im) {
      var id = im.dataset.pid;
      if (urls[id]) { im.removeAttribute('data-pid'); im.src = urls[id]; return; }
      if (io && im.closest('#grid')) io.observe(im); else fillOne(im, true);
    });
    clearTimeout(fillImgs.t);       // 보이는 사진을 먼저 채운 뒤, 나머지도 천천히 미리 받아 둔다
    fillImgs.t = setTimeout(function () { document.querySelectorAll('#grid img[data-pid]').forEach(function (im) { if (io) io.unobserve(im); fillOne(im, false); }); }, 1500);
  }

  function load() {
    return apiGet({ action: 'clist' }).then(function (j) {
      if (j && j.ok && Array.isArray(j.list) && !('fam' in j)) { mode = 'server'; return j.list; }
      if (j && j.err === 'code') { ls.del(K_STUDY); throw new Error('code'); }
      mode = 'local'; return [];     // 시트 스크립트가 아직 소장품을 모르는 옛 배포본
    }).catch(function (e) { if (e && e.message === 'code') throw e; mode = mode === 'server' ? 'offline' : mode; return null; });
  }
  /* 주소가 collection.html#open=소장품id 이면 그 소장품 창을 바로 연다(반닫이 지도에서 새 창으로 올 때) */
  var hashDone = false;
  function openFromHash() {
    if (hashDone) return; var m = location.hash.match(/^#open=(.+)$/); if (!m) return; hashDone = true;
    var id = decodeURIComponent(m[1]), at = shown.findIndex(function (x) { return String(x.id) === id; });
    if (at < 0 && typeof stf !== 'undefined') { stf = '전체'; render(); at = shown.findIndex(function (x) { return String(x.id) === id; }); }
    if (at >= 0) openView(at);
  }
  function start() {
    var cached = null; try { cached = JSON.parse(ls.get('mokgagu_col_cache') || 'null'); } catch (e) {}
    var shownKey = '';
    if (cached && cached.length) {     // 지난번 목록으로 바로 그리고, 시트에서 새로 받으면 바뀐 것만 다시 그린다
      idb.all('local').catch(function () { return []; }).then(function (loc) {
        if (items.length) return;
        items = cached.concat((loc || []).map(function (x) { x.pending = 1; return x; })); shownKey = JSON.stringify(items); render();
      });
    } else app.innerHTML = '<p style="text-align:center;color:#7a736a;padding:60px 0">소장품을 불러오는 중…</p>';
    Promise.all([load(), idb.all('local').catch(function () { return []; })]).then(function (r) {
      var server = r[0], loc = r[1] || [];
      if (server === null) { server = JSON.parse(ls.get('mokgagu_col_cache') || '[]'); note = '인터넷에 연결되지 않아 이 기기에 저장해 둔 목록을 보여 드려요.'; }
      else ls.set('mokgagu_col_cache', JSON.stringify(server));
      if (mode === 'local') note = '아직 구글 시트 스크립트를 새로 배포하지 않아, 넣은 소장품이 <b>이 기기에만</b> 저장돼요. 배포하고 나면 다음에 열 때 자동으로 시트로 올라가 모든 기기에서 보여요.';
      items = server.concat(loc.map(function (x) { x.pending = 1; return x; }));
      if (JSON.stringify(items) !== shownKey || note) { var y = window.scrollY; render(); if (shownKey) window.scrollTo(0, y); }
      if (mode === 'server' && loc.length) syncLocal(loc);
      openFromHash();
    }).catch(function (e) { lockView(e && e.message === 'code' ? '암호가 바뀌었어요. 다시 넣어 주세요.' : '불러오지 못했어요.'); });
  }

  /* ── 사진 줄이기: 큰 사진(긴 변 1800px)과 작은 사진(480px) ── */
  function decode(file) {
    return new Promise(function (ok, no) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () { ok(im); }; im.onerror = function () { URL.revokeObjectURL(u); no(new Error('decode')); }; im.src = u;
    });
  }
  function shrink(im, max, qual) {
    var w = im.naturalWidth || im.width, h = im.naturalHeight || im.height, s = Math.min(1, max / Math.max(w, h));
    var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
    return new Promise(function (ok) { c.toBlob(ok, 'image/jpeg', qual); });
  }
  function toB64(blob) { return new Promise(function (ok) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(',')[1]); }; r.readAsDataURL(blob); }); }

  /* ── 목록 ── */
  function owners(o) { return o === '힌' ? '<span class="ow h">힌</span>' : o === '함께' ? '<span class="ow b" title="거믄·힌 함께">·</span>' : o ? '<span class="ow g">거믄</span>' : ''; }
  function fmtD(d) { if (!d) return ''; var p = String(d).slice(0, 10).split('-'); return p.length === 3 ? p[0] + '. ' + (+p[1]) + '. ' + (+p[2]) + '.' : d; }
  /* 맨 앞에 둘 소장품 (이름에 들어 있는 말, 순서대로) — 나머지는 구입일 순 */
  var PIN = [/언양/, /안궤/];
  function pin(x) { for (var i = 0; i < PIN.length; i++) if (PIN[i].test(String(x.name || ''))) return i; return PIN.length; }
  function view() {
    var L = items.filter(function (x) { return (stf === '전체' || st(x) === stf) && (!q || [x.name, x.kind, x.place, x.note, x.memo, x.wood, x.era, x.sto].join(' ').toLowerCase().indexOf(q) >= 0); });
    L.sort(function (a, b) {
      if (sort === 'name') return String(a.name).localeCompare(String(b.name), 'ko');
      var pa = pin(a), pb = pin(b); if (pa !== pb) return pa - pb;
      var x = a.bought || a.created || '', y = b.bought || b.created || '';
      return (x < y ? 1 : x > y ? -1 : 0) * (sort === 'old' ? -1 : 1);
    });
    return L;
  }
  var shown = [];
  function render() {
    shown = view();
    var h = '<header class="hd"><div class="pic"><img src="mark_angwe.png" alt="안궤"></div><div><h1><span class="ew"><span>거믄</span><span class="w">힌</span></span>의 소장품</h1>' +
      '<p>우리 집에 들인 목가구와 기물 — 사진, 구입일, 구입처, 비고를 적어 두는 도록</p></div><button class="out" id="out">이 기기에서 잠그기</button></header>';
    if (note) h += '<p class="note' + (mode === 'offline' ? ' bad' : '') + '">' + note + '</p>';
    h += '<div class="bar"><button class="add" id="add"><b>＋</b> 소장품 넣기</button><input type="search" id="q" placeholder="소장품에서 찾기 — 이름, 구입처, 메모" value="' + esc(q) + '">' +
      '<span class="seg" id="sort">' + [['new', '최근 구입'], ['old', '오래된 구입'], ['name', '이름순']].map(function (s) { return '<button type="button" data-s="' + s[0] + '" class="' + (sort === s[0] ? 'on' : '') + '">' + s[1] + '</button>'; }).join('') + '</span>' +
      '<span class="cnt">소장 <b>' + items.filter(function (x) { return st(x) === '소장'; }).length + '</b>점</span></div>' +
      '<div class="bar"><span class="seg st" id="stf">' + ['소장', '판매 예정', '판매함', '전체'].map(function (k) { var n = k === '전체' ? items.length : items.filter(function (x) { return st(x) === k; }).length; return '<button type="button" data-st="' + k + '" class="' + (stf === k ? 'on' : '') + '">' + k + ' <small>' + n + '</small></button>'; }).join('') + '</span></div>';
    h += '<div class="grid" id="grid">' + (shown.length ? shown.map(function (x, i) {
      var p = (x.photos || [])[0];
      return '<button type="button" class="it" data-i="' + i + '"><div class="ph">' + (p ? '<img data-pid="' + esc(p.t || p.f) + '" alt="">' : '<img class="none" src="mark_angwe.png" alt="">') +
        ((x.photos || []).length > 1 ? '<span class="n">📷 ' + x.photos.length + '</span>' : '') + (x.pending ? '<span class="pend">이 기기에만</span>' : '') + (st(x) !== '소장' ? '<span class="stb' + (st(x) === '판매함' ? ' done' : '') + '">' + st(x) + '</span>' : '') + '</div>' +
        '<div class="tx"><div class="nm">' + owners(x.owner) + esc(x.name) + '</div>' + (x.kind ? '<div class="kd">' + esc(x.kind) + '</div>' : '') +
        '<div class="mt">' + esc([fmtD(x.bought), x.place].filter(Boolean).join(' · ')) + '</div>' + (st(x) !== '소장' && (x.sprice || x.sold) ? '<div class="mt sl">' + esc([st(x) === '판매함' ? '판매' : '판매 예정', fmtD(x.sold), won(x.sprice)].filter(Boolean).join(' · ')) + '</div>' : '') + '</div></button>';
    }).join('') : '<div class="empty">' + (items.length ? (q ? '찾는 소장품이 없어요.' : '「' + stf + '」에 해당하는 소장품이 없어요.') : '아직 넣은 소장품이 없어요.<br><b>＋ 소장품 넣기</b>를 누르거나, 사진을 이 화면에 끌어다 놓으면 바로 시작해요.') + '</div>') + '</div>';
    app.innerHTML = h; fillImgs(app);
  }
  app.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.id === 'add') openForm(null, []);
    else if (b.id === 'out') { ls.del(K_STUDY); PW = ''; items = []; lockView('이 기기에서 잠갔어요.'); }
    else if (b.dataset.s) { sort = b.dataset.s; ls.set(K_SORT, sort); render(); }
    else if (b.dataset.st) { stf = b.dataset.st; ls.set('mokgagu_col_st', stf); render(); }
    else if (b.dataset.i != null && b.classList.contains('it')) openView(+b.dataset.i);
  });
  app.addEventListener('input', function (e) { if (e.target.id === 'q') { q = e.target.value.trim().toLowerCase(); var pos = e.target.selectionStart; render(); var n = $('q'); n.focus(); n.setSelectionRange(pos, pos); } });

  /* ── 보기 창 ── */
  var vi = -1, vp = 0;
  window.MOKGAGU_COLCUR = function () { return shown[vi] || null; };
  function openView(i) {
    var x = shown[i]; if (!x) return; vi = i; vp = 0; drawView();
    if (!$('vw').open) $('vw').showModal();
  }
  if (MOKGAGU_EMB.on) {
    var _ov = openView;
    openView = function (i) {
      var cx = shown[vi]; if (vi >= 0 && i !== vi && cx) { MOKGAGU_EMB.go('col/' + cx.id, i > vi ? 1 : -1); return; }
      _ov(i);
    };
    $('vw').addEventListener('close', function () { try { parent.postMessage('mokgagu-see-close', location.origin); } catch (e) {} });
  }
  function drawView() {
    var x = shown[vi], P = x.photos || [];
    $('v-main').innerHTML = P.length ? '<img data-pid="' + esc(P[vp].f) + '" alt="' + esc(x.name) + '">' : '<img class="none" src="mark_angwe.png" alt="">';
    /* 큰 사진이 오기 전에 이미 받아 둔 작은 사진(썸네일)을 먼저 보여 준다 (2026-10-29) */
    if (P.length && P[vp].t && P[vp].t !== P[vp].f) {
      var mi = $('v-main').querySelector('img'), fid = P[vp].f;
      if (urls[fid]) { mi.removeAttribute('data-pid'); mi.src = urls[fid]; }
      else imgURL(P[vp].t, true).then(function (u) { if (u && mi.isConnected && !mi.getAttribute('src')) mi.src = u; });
    }
    /* 다음·이전 기물의 큰 사진을 미리 받아 둔다 */
    [vi + 1, vi - 1].forEach(function (k) { var q = shown[k] && shown[k].photos && shown[k].photos[0]; if (q) imgURL(q.f, false); });
    $('v-strip').innerHTML = P.length > 1 ? P.map(function (p, k) { return '<button type="button" data-p="' + k + '" class="' + (k === vp ? 'on' : '') + '"><img data-pid="' + esc(p.t || p.f) + '" alt=""></button>'; }).join('') : '';

    apiPost({ action: 'cdel', id: it.id }).then(function (j) { if (!j.ok) throw j; ls.set('mokgagu_col_cache', JSON.stringify(items.filter(function (x) { return !x.pending; }))); })
      .catch(function () { items.push(it); note = '지우지 못했어요. 잠시 뒤에 다시 해 주세요.'; render(); });
  }
  /* 이 기기에만 있던 소장품을 시트로 올리기 */
  function syncLocal(loc) {
    loc.reduce(function (p, it) {
      return p.then(function () {
        var ph = [];
        return (it.photos || []).reduce(function (q2, x) {
          return q2.then(function () {
            if (!/^L/.test(x.f)) { ph.push(x); return; }
            return Promise.all([idb.get('img', x.f), idb.get('img', x.t)]).then(function (b) { return uploadPic({ blobF: b[0], blobT: b[1] }, 0, 0); }).then(function (r) { ph.push(r); });
          });
        }, Promise.resolve()).then(function () {
          var send = Object.assign({}, it, { photos: ph }); delete send.pending;
          return apiPost({ action: 'csave', item: send });
        }).then(function (j) {
          if (!j.ok) throw j;
          (it.photos || []).forEach(function (x) { if (/^L/.test(x.f)) { idb.del('img', x.f); idb.del('img', x.t); } });
          return idb.del('local', it.id).then(function () { var k = items.findIndex(function (x) { return x.id === it.id; }); if (k >= 0) items[k] = j.item; });
        });
      });
    }, Promise.resolve()).then(function () { note = '이 기기에만 있던 소장품을 시트로 올렸어요. 이제 모든 기기에서 보여요.'; render(); }).catch(function () {});
  }

  var saved = ls.get(K_STUDY);
  if (saved) { app.innerHTML = '<p style="text-align:center;color:#7a736a;padding:60px 0">여는 중…</p>'; check(saved).then(function () { PW = saved; start(); }).catch(function (er) { if (er && er.message === 'net') lockView('인터넷 연결을 확인해 주세요.'); else { ls.del(K_STUDY); lockView(); } }); } else lockView();
})();
</script>
