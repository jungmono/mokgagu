<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>기물 이야기 모아보기 — 조선의 목가구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--fg:#1d1b18;--muted:#7a736a;--line:#e6e1d9;--card:#fff;--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 64px}
h1{margin:22px 0 6px;font-size:clamp(24px,3.4vw,34px);font-weight:900;letter-spacing:-.035em;display:flex;align-items:center;gap:10px}
h1 svg{width:28px;height:28px}
.lead{margin:0 0 18px;color:var(--muted);font-size:15px;line-height:1.6;font-weight:500}
.who-box{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#f7f5f1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.who-box b{font-weight:900}
.who-box input{font:inherit;font-size:16px;border:1px solid #d9d4cc;border-radius:8px;padding:7px 10px;width:150px}
.btn{font:inherit;font-size:13.5px;font-weight:700;border:0;border-radius:8px;background:#1d1b18;color:#fff;padding:7px 14px;cursor:pointer}
.btn.ghost{background:#fff;color:#6b665e;border:1px solid #d9d4cc}
.err{color:#8a2f22;font-size:13px}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lab{min-width:3.2em;font-size:13px;font-weight:800;color:var(--muted)}
.seg{display:inline-flex;border:1px solid #d9d4cc;border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;font:inherit;font-size:13.5px;padding:6px 13px;cursor:pointer;color:#3b3833;display:inline-flex;align-items:center;gap:4px}
.seg button+button{border-left:1px solid #d9d4cc}
.seg button.on{background:#1d1b18;color:#fff;font-weight:800}
.seg button svg{width:15px;height:15px}
select{font:inherit;font-size:13.5px;border:1px solid #d9d4cc;border-radius:8px;padding:6px 10px;background:#fff;max-width:100%}
.count{font-size:14px;color:var(--muted);margin:4px 0 14px}.count b{color:var(--fg);font-weight:900}
.list{display:flex;flex-direction:column;gap:12px}
.cl-card{display:flex;gap:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s}
.cl-card:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-1px)}
.cl-card.priv{background:#f9f8f5;border-style:dashed}
.cl-ph{flex:none;width:96px;height:96px;border-radius:10px;background:#f4f2ee;display:grid;place-items:center;overflow:hidden}
.cl-ph img{width:100%;height:100%;object-fit:contain}
.cl-ph span{font-size:11px;color:#a0988e}
.cl-bd{min-width:0;flex:1}
.cl-hd{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.cl-who{display:inline-block;min-width:2.9em;text-align:center;font-weight:900;font-size:12px;padding:1px 7px;border:1.5px solid #111;line-height:1.35}
.cl-who.g{background:#111;color:#fff}.cl-who.h{background:#fff;color:#111}.cl-who.o{background:#f1efeb;color:#3b3833;border-color:#bdb6aa;font-weight:700}
.cl-vis{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;border:1px solid #d9d4cc;color:#6b665e;background:#fff}.cl-vis.pub{border-color:#9db8a4;color:#2f6b45;background:#f1f8f3}
.cl-item{font-weight:900;font-size:15.5px;letter-spacing:-.02em}
.cl-book{font-size:12.5px;color:var(--muted);font-weight:500;margin-left:4px}
.cl-tx{margin-top:4px;font-size:14.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.cl-act{margin-left:auto;display:inline-flex;gap:10px}
.cl-act button{border:0;background:none;color:#a0988e;font-size:12.5px;cursor:pointer;padding:0}.cl-act button:hover{color:#1d1b18}
.grp-h{margin:18px 0 6px;font-size:14px;font-weight:900;color:#3b3833;display:flex;align-items:center;gap:8px}
.cl-card.editing{cursor:default;transform:none;box-shadow:0 0 0 2px #1d1b18}
.cl-edit{display:block;width:100%;min-height:96px;margin-top:6px;font:inherit;font-size:14.5px;line-height:1.7;border:1px solid #d9d4cc;border-radius:8px;padding:8px 10px;resize:vertical;box-sizing:border-box}
.cl-ebtn{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
@media (max-width:560px){.cl-ph{width:72px;height:72px}.lab{min-width:100%}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="조선의 목가구">
<script src="common.js?v=10" defer></script>
</head>
<body>
<div class="wrap">
  <h1><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>기물 이야기 모아보기</h1>
  <p class="lead">모든 도록에 남긴 이야기를 한곳에서 봅니다. 카드를 누르면 그 기물 사진 창이 열리고, 이 목록 순서대로 좌우로 넘겨 볼 수 있어요.</p>
  <div class="who-box" id="who"></div>
  <div class="filters">
    <div class="row"><span class="lab">보기</span><span class="seg" id="f-vis"></span></div>
    <div class="row"><span class="lab">누가</span><span class="seg" id="f-who"></span></div>
    <div class="row"><span class="lab">정렬</span><span class="seg" id="f-sort"></span><select id="f-book" aria-label="도록"><option value="">모든 도록</option></select></div>
  </div>
  <div class="count" id="count"></div>
  <div class="list" id="list"><p class="empty">불러오는 중…</p></div>
</div>
<script src="search.js"></script>
<script src="books.js?v=1"></script><script src="site.js"></script>
<script src="comments.js?v=20261031"></script>
<script>
(function () {
  var C = window.MOKGAGU_COMMENTS, $ = function (id) { return document.getElementById(id); };
  var BOOK = {}; (window.SEARCH || []).forEach(function (r) { BOOK[r.b] = BOOK[r.b] || r.cat; });
  var IDX = {}; (window.SEARCH || []).forEach(function (r) { IDX[r.b + '/' + r.pid] = r; });
  var st = { vis: 'all', who: 'all', sort: 'new', book: '' };
  try { var sv = JSON.parse(localStorage.getItem('mokgagu_cl_filter') || '{}'); for (var k in sv) if (k in st) st[k] = sv[k]; } catch (e) {}
  var sure = '', editing = '', lastOrder = [];
  function seg(el, key, opts) {
    el.innerHTML = opts.map(function (o) { return '<button type="button" data-k="' + key + '" data-v="' + o[0] + '" class="' + (st[key] === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('');
  }
  function drawFilters() {
    seg($('f-vis'), 'vis', C.isFam() ? [['all', '전체'], ['priv', '🔒 비공개'], ['pub', '공개']] : [['all', '공개된 이야기']]);
    seg($('f-who'), 'who', [['all', '전체'], ['거믄', C.starsHTML('거믄') + '거믄'], ['힌', C.starsHTML('힌') + '힌'], ['벗', '벗']]);
    seg($('f-sort'), 'sort', [['new', '최신순'], ['old', '오래된순'], ['item', '기물별']]);
  }
  function drawWho() {
    var w = $('who');
    if (C.isFam()) w.innerHTML = '<span>🔑 <b>가족 암호 확인됨</b> — 거믄·힌의 비공개 이야기까지 모두 보여요.</span><button type="button" class="btn ghost" id="out" style="margin-left:auto">이 기기에서 암호 지우기</button>';
    else w.innerHTML = '<span>지금은 <b>공개된 이야기</b>만 보여요. 거믄·힌은 가족 암호를 넣으면 비공개 이야기도 볼 수 있어요.</span>' +
      '<span style="display:inline-flex;gap:6px;margin-left:auto"><input type="password" id="code" placeholder="가족 암호" inputmode="text" autocapitalize="off" autocomplete="off"><button type="button" class="btn" id="go">확인</button></span>' +
      (C.state.codeErr ? '<span class="err">' + C.esc(C.state.codeErr) + '</span>' : '');
  }
  function books(items) {
    var sel = $('f-book'), have = {};
    items.forEach(function (c) { have[c.cid.split('/')[0]] = 1; });
    var cur = st.book;
    sel.innerHTML = '<option value="">모든 도록</option>' + Object.keys(have).sort().map(function (b) { return '<option value="' + b + '"' + (b === cur ? ' selected' : '') + '>' + C.esc(BOOK[b] || b) + '</option>'; }).join('');
  }
  function card(c) {
    var r = IDX[c.cid] || {}, b = c.cid.split('/')[0];
    var cls = c.author === '거믄' ? 'g' : c.author === '힌' ? 'h' : 'o';
    var label = c.author === '벗' ? (c.name ? '벗 · ' + c.name : '벗') : c.author;
    var pub = C.isPub(c), fam = c.author === '거믄' || c.author === '힌';
    var ph = r.t ? '<img loading="lazy" src="thumbs/' + r.b + '/' + r.n + '.jpg" alt="">' : '<span>사진 없음</span>';
    var acts = '';
    if (editing === c.id) {
      return '<div class="cl-card editing' + (pub ? '' : ' priv') + '" data-cid="' + C.esc(c.cid) + '" data-no-star="1">' +
        '<div class="cl-ph">' + ph + '</div><div class="cl-bd"><div class="cl-hd"><span class="cl-who ' + cls + '">' + C.esc(label) + '</span><span class="cl-item" style="font-size:14px">' + C.esc(r.name || c.cid) + '</span><span>고치는 중</span></div>' +
        '<textarea class="cl-edit" id="cl-edit">' + C.esc(c.text) + '</textarea>' +
        '<div class="cl-ebtn"><button type="button" class="btn ghost" data-ecancel="1">그만두기</button><button type="button" class="btn" data-esave="' + C.esc(c.id) + '">고친 내용 저장</button></div></div></div>';
    }
    if (sure === c.id) acts = '<span class="cl-act">지울까요? <button type="button" data-yes="' + C.esc(c.id) + '">예</button><button type="button" data-no="1">아니오</button></span>';
    else {
      if (C.canEdit && C.canEdit(c)) acts += '<button type="button" data-edit="' + C.esc(c.id) + '">✎ 고치기</button>';
      if (C.isFam() && fam && !c.pending) acts += '<button type="button" data-pub="' + C.esc(c.id) + '" data-to="' + (pub ? 0 : 1) + '">' + (pub ? '비공개로' : '공개하기') + '</button>';
      if (C.canDel(c)) acts += '<button type="button" data-del="' + C.esc(c.id) + '">지우기</button>';
      if (acts) acts = '<span class="cl-act">' + acts + '</span>';
    }
    return '<a class="cl-card' + (pub ? '' : ' priv') + '" href="index.html#see=' + encodeURIComponent(b) + '/' + encodeURIComponent(c.cid.slice(b.length + 1)) + '" data-cid="' + C.esc(c.cid) + '" data-no-star="1">' +
      '<div class="cl-ph">' + ph + '</div><div class="cl-bd"><div class="cl-hd"><span class="cl-who ' + cls + '">' + C.esc(label) + '</span>' +
      (fam ? '<span class="cl-vis' + (pub ? ' pub' : '') + '">' + (pub ? '공개' : '🔒 비공개') + '</span>' : '') + '<span>' + C.esc(C.when(c.t)) + (c.edited ? ' · 고침' : '') + '</span>' + acts + '</div>' +
      '<div><span class="cl-item">' + C.esc(r.name || c.cid) + '</span><span class="cl-book">' + C.esc(BOOK[b] || b) + '</span></div>' +
      '<div class="cl-tx">' + C.esc(c.text) + '</div></div></a>';
  }
  function draw() {
    var ed = $('cl-edit'), keepEdit = ed ? ed.value : null;
    drawWho(); drawFilters();
    var items = C.list(); books(items);
    var f = items.filter(function (c) {
      if (st.vis === 'priv' && C.isPub(c)) return false;
      if (st.vis === 'pub' && !C.isPub(c)) return false;
      if (st.who !== 'all' && c.author !== st.who) return false;
      if (st.book && c.cid.split('/')[0] !== st.book) return false;
      return true;
    });
    var n = { g: 0, h: 0, b: 0, priv: 0 }; items.forEach(function (c) { if (c.author === '거믄') n.g++; else if (c.author === '힌') n.h++; else n.b++; if (!C.isPub(c)) n.priv++; });
    $('count').innerHTML = '보이는 이야기 <b>' + f.length + '</b>개 <span style="margin-left:8px">· 전체 ' + items.length + ' (거믄 ' + n.g + ' · 힌 ' + n.h + ' · 벗 ' + n.b + (C.isFam() ? ' · 비공개 ' + n.priv : '') + ')</span>';
    if (!f.length) { $('list').innerHTML = '<p class="empty">' + (items.length ? '조건에 맞는 이야기가 없어요.' : (C.state.loading ? '불러오는 중…' : '아직 남긴 이야기가 없어요. 기물 사진 창 아래에서 남겨 보세요.')) + '</p>'; return; }
    if (st.sort === 'item') {
      var g = {}, order = [];
      f.slice().sort(function (a, b) { return a.t < b.t ? 1 : -1; }).forEach(function (c) { if (!g[c.cid]) { g[c.cid] = []; order.push(c.cid); } g[c.cid].push(c); });
      $('list').innerHTML = order.map(function (cid) { var r = IDX[cid] || {}; return '<div class="grp-h">' + C.esc(r.name || cid) + ' <span class="cl-book">' + C.esc(BOOK[cid.split('/')[0]] || '') + ' · ' + g[cid].length + '개</span></div>' + g[cid].slice().reverse().map(card).join(''); }).join('');
    } else {
      f.sort(function (a, b) { return (a.t < b.t ? 1 : -1) * (st.sort === 'old' ? -1 : 1); });
      $('list').innerHTML = f.map(card).join('');
    }
    // 카드 순서를 기억해 두었다가, 카드를 눌러 사진 창을 열면 이 순서대로 좌우로 넘겨 볼 수 있게 한다
    lastOrder = []; var seen = {};
    [].forEach.call($('list').querySelectorAll('.cl-card[data-cid]'), function (el) { var k = el.dataset.cid; if (!seen[k]) { seen[k] = 1; lastOrder.push(k); } });
    var ne = $('cl-edit'); if (ne && keepEdit != null) ne.value = keepEdit;
  }
  $('list').addEventListener('click', function (e) {
    var a = e.target.closest('a.cl-card'); if (!a || e.target.closest('button')) return;
    try { sessionStorage.setItem('mokgagu_see_list', JSON.stringify({ from: 'comments', list: lastOrder })); } catch (x) {}
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k) { st[b.dataset.k] = b.dataset.v; try { localStorage.setItem('mokgagu_cl_filter', JSON.stringify(st)); } catch (x) {} draw(); return; }
    if (b.closest('.cl-card')) e.preventDefault();
    if (b.id === 'go') { var v = ($('code').value || '').trim(); if (v) C.login(v).then(draw); return; }
    if (b.id === 'out') { C.logout().then(function () { st.vis = 'all'; draw(); }); return; }
    if (b.dataset.pub) { C.setPub(b.dataset.pub, b.dataset.to === '1'); return; }
    if (b.dataset.edit) { editing = b.dataset.edit; sure = ''; draw(); var t = $('cl-edit'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } return; }
    if (b.dataset.ecancel) { editing = ''; draw(); return; }
    if (b.dataset.esave) { var et = $('cl-edit'); if (!et || !et.value.trim()) { if (et) et.focus(); return; } var id2 = b.dataset.esave, v2 = et.value; editing = ''; C.edit(id2, v2); return; }
    if (b.dataset.del) { sure = b.dataset.del; editing = ''; draw(); return; }
    if (b.dataset.no) { sure = ''; draw(); return; }
    if (b.dataset.yes) { var id = b.dataset.yes; sure = ''; C.del(id); return; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'code') $('go').click();
    if (e.target.id === 'cl-edit' && (e.ctrlKey || e.metaKey) && e.key === 'Enter') { var s = document.querySelector('[data-esave]'); if (s) s.click(); }
    if (e.target.id === 'cl-edit' && e.key === 'Escape') { editing = ''; draw(); }
  });
  $('f-book').addEventListener('change', function (e) { st.book = e.target.value; try { localStorage.setItem('mokgagu_cl_filter', JSON.stringify(st)); } catch (x) {} draw(); });
  C.onChange(draw); draw();
})();
</script>
</body>
</html>
