<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet"><title>화가가 애호하는 조선시대 목가구(두가헌) — 조선의 목가구</title>
<meta name="color-scheme" content="light">
<style>
:root{--fg:#1d1b18;--muted:#6b665e;--line:#e5e1da;--panel:#faf9f6;--accent:#8a2f22;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--serif:"Noto Serif KR","AppleMyungjo","Nanum Myeongjo","Batang",serif}
*{box-sizing:border-box}
html{background:#fff}
body{margin:0;background:#fff;color:var(--fg);font-family:var(--sans);padding:24px 16px 48px;word-break:keep-all}
.wrap{max-width:1200px;margin:0 auto}
.sa-top{max-width:1200px;margin:0 auto 18px}
.sa-home{display:inline-flex;align-items:center;gap:10px;color:#111;background:#fff;border:2px solid #111;border-radius:999px;padding:8px 18px;box-shadow:0 4px 14px rgba(0,0,0,.12);transition:transform .15s,background .15s}
.sa-home:hover{background:#f2f0ec;transform:translateY(-1px)}
.sa-home img{height:34px;width:auto;display:block}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.4vw,34px);margin:4px 0 8px}
ul.lead{margin:0 0 20px;padding-left:20px;color:#3b3833;line-height:1.75;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 22px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.tile .k{font-size:13px;color:var(--muted)}.tile .v{font-family:var(--serif);font-size:24px;margin-top:4px}.tile .v small{font-size:15px;color:var(--muted);margin-left:2px}
.tile .s{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}button.tile:hover{border-color:#bdb6aa}button.tile.on{border-color:#1d1b18;box-shadow:inset 0 0 0 1px #1d1b18}
.zbar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3}.zbar button{width:34px;height:34px;border-radius:8px;border:0;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;font-size:18px;line-height:1}
.zhint{position:absolute;left:10px;bottom:12px;font-size:12px;color:#6b665e;background:rgba(255,255,255,.85);border-radius:6px;padding:2px 7px;z-index:3}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 16px}
.filters .lab{font-size:13px;color:var(--muted);min-width:44px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--fg);font-family:inherit}
.chip:hover{border-color:#bdb6aa}.chip.on{background:#1d1b18;color:#fff;border-color:#1d1b18}.chip .n{opacity:.6;margin-left:4px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;padding:0;font:inherit;color:inherit;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 22px rgba(0,0,0,.09);transform:translateY(-2px)}
.card .ph{aspect-ratio:4/3;background:#f6f4f0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:contain}
.card .ph .no{font-size:13px;color:var(--muted)}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.badge{display:inline-block;width:max-content;font-size:12px;font-weight:700;color:var(--accent);border:1px solid #e8cfc8;background:#fbf4f2;border-radius:6px;padding:2px 7px}
.nm{font-family:var(--serif);font-size:18px;line-height:1.35}
.hj{font-size:13px;color:var(--muted)}
.mt{font-size:13px;color:var(--muted);line-height:1.5}
.pc{font-size:12px;color:var(--muted)}
p.note{font-size:13px;color:var(--muted);line-height:1.7;margin-top:28px}
dialog{border:0;border-radius:14px;padding:0;width:min(1180px,96vw);max-height:94vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,18,15,.55)}
.d-body{display:flex;gap:22px;padding:20px;max-height:calc(94vh - 60px);overflow:auto}
.d-img{flex:1.35;min-width:0;display:flex;flex-direction:column;gap:10px}
.d-main{position:relative;background:#f6f4f0;border-radius:10px;min-height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:contain}
.d-main img{max-width:100%;max-height:66vh;object-fit:contain;display:block;transform-origin:0 0;user-select:none;-webkit-user-drag:none;cursor:zoom-in}.d-main.zoomed img{cursor:grab}.d-main.zoomed.drag img{cursor:grabbing}
.d-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer;font-size:18px}
.d-arrow.l{left:10px}.d-arrow.r{right:10px}
.d-cap{font-size:13px;color:var(--muted)}
.d-strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.d-strip button{flex:0 0 auto;width:64px;height:52px;border:2px solid transparent;border-radius:6px;padding:0;background:#f6f4f0;cursor:pointer;overflow:hidden}
.d-strip button.on{border-color:#1d1b18}.d-strip img{width:100%;height:100%;object-fit:cover}
.d-info{flex:1;min-width:0}
.d-info h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:6px 0 2px}
.d-info .hj{margin-bottom:12px}
.d-info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin:0 0 14px}
.d-info dt{color:var(--muted)}.d-info dd{margin:0}
.d-desc{font-size:15px;line-height:1.85;white-space:pre-line;color:#2e2b27}
.d-en{font-size:13px;line-height:1.7;color:var(--muted);margin-top:12px}
.d-en summary{cursor:pointer}
.d-src{display:inline-block;margin-top:14px;font-size:13px;color:var(--accent)}
.d-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.d-foot button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--fg)}
@media (max-width:760px){.d-body{flex-direction:column;padding:14px}.d-main{min-height:220px}.d-main img{max-height:46vh}}
.sa-foot{max-width:1200px;margin:40px auto 0;text-align:center;font-size:13px;color:var(--muted);line-height:1.7}
.sa-foot .ft-mark{display:inline-flex;vertical-align:middle;margin-right:8px;font-size:12px;font-weight:900}
.sa-foot .ft-mark span{display:inline-block;min-width:2.9em;padding:.12em .4em;border:1.5px solid #111;line-height:1.2;text-align:center}
.sa-foot .ew-blk{background:#fff;color:#111}.sa-foot .ew-wht{background:#111;color:#fff}
.sa-foot .ft-icon{display:block;margin:18px auto 8px;width:144px;height:auto}

const THUMB = Object.fromEntries(JSON.parse(document.getElementById('ds-photos').textContent).map((p) => [p.id, p.img]));
const GRPS = ["반닫이·궤", "장·농·뒤주", "탁자·책장", "상·서안·문갑", "문방·함·소품"];
const ERAS = [];
const gOf = (i) => i.kind;
const eOf = (i) => '';
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nPics = ITEMS.reduce((s, i) => s + i.pics.length, 0);
const cnt = (g) => ITEMS.filter((i) => gOf(i) === g).length;
document.getElementById('lead').innerHTML = [
  `두가헌 갤러리 『화가가 애호하는 조선시대 목가구』 — 여섯 화가가 소장한 가구 <b>${ITEMS.length}</b>점, 사진 ${nPics}장`,
  `기종별로 골라 보거나 이름으로 찾을 수 있습니다. 크기는 도록에 적힌 순서(가로×옆너비×높이, cm) 그대로입니다.`,
  `사진으로 찍은 도록이라 도록 번호 63~66은 빠져 있고, 사진은 회색 바탕 부분만 잘랐습니다.`,
].map((s) => `<li>${s}</li>`).join('');
const TILES = [['', '기물 전체', ITEMS.length, '전체 보기'], ['반닫이·궤', '반닫이·궤', cnt('반닫이·궤'), '반닫이와 궤'], ['장·농·뒤주', '장·농·뒤주', cnt('장·농·뒤주'), '이층장·이층농·머릿장·뒤주'], ['탁자·책장', '탁자·책장', cnt('탁자·책장'), '사방탁자·찬탁자·책장'], ['상·서안·문갑', '상·서안·문갑', cnt('상·서안·문갑'), '서안·경상·탁상·문갑·찻상·향상'], ['문방·함·소품', '문방·함·소품', cnt('문방·함·소품'), '연상·필통·서류함·망건통·목침·좌경']];







function tiles() {
  document.getElementById('tiles').innerHTML = TILES.map(([g, k, n, s]) => `<button type="button" class="tile${grp === g ? ' on' : ''}" data-g="${g}"><div class="k">${k}</div><div class="v">${n}<small>점</small></div><div class="s">${s}</div></button>`).join('');
}
document.getElementById('tiles').addEventListener('click', (e) => { const b = e.target.closest('.tile'); if (!b) return; grp = b.dataset.g; era = ''; render(); document.getElementById('f-grp').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
let grp = '', era = '', q = '', view = [];
function chipRow(id, list, cur, ofn, set) {
  const el = document.getElementById(id); el.querySelectorAll('.chip').forEach((c) => c.remove());
  [['', '전체', ITEMS.length], ...list.map((g) => [g, g, ITEMS.filter((i) => ofn(i) === g).length]).filter((x) => x[2])].forEach(([v, t, n]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (cur === v ? ' on' : '');
    b.innerHTML = `${t}<span class="n">${n}</span>`; b.onclick = () => { set(v); render(); }; el.appendChild(b);
  });
}
function chips() { chipRow('f-grp', GRPS, grp, gOf, (v) => { grp = v; }); }
document.getElementById('q').addEventListener('input', (e) => { q = e.target.value.trim(); render(); });
function render() {
  chips(); tiles();
  view = ITEMS.filter((i) => (!grp || gOf(i) === grp) && (!q || (i.name + ' ' + (i.hanja || '') + ' ' + (i.cat || '') + ' ' + (i.memo || '')).includes(q)));
  document.getElementById('cnt').textContent = view.length + '점';
  document.getElementById('grid').innerHTML = view.map((i, n) => `<button type="button" class="card" data-n="${n}" data-cid="dugaheon/${i.id}"><div class="ph">${THUMB[i.id] ? `<img loading="lazy" src="${THUMB[i.id]}" alt="${esc(i.name)}">` : '<span class="no">사진 없음</span>'}</div><div class="bd"><span class="badge">${esc(i.kind)}</span><span class="nm">${esc(i.name)}</span>${i.hanja ? `<span class="hj">${esc(i.hanja)}</span>` : ''}<span class="mt">${i.size ? esc(i.size) + ' cm' : ''}</span><span class="pc">${i.pics.length ? '사진 ' + i.pics.length + '장' : ''}</span></div></button>`).join('');
}
document.getElementById('grid').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) open_(+c.dataset.n); });
const dlg = document.getElementById('dlg'); let cur = 0, pi = 0;
function showPic() {
  const i = view[cur], im = document.getElementById('d-img'), p = i.pics[pi];
  if (p) { im.src = THUMB[i.id] && pi === 0 ? THUMB[i.id] : p.src; if (pi === 0) { const hi = new Image(); hi.onload = () => { if (view[cur] === i && pi === 0) im.src = hi.src; }; hi.src = p.src; } im.alt = i.name; im.hidden = false; }
  else { im.removeAttribute('src'); im.hidden = true; }
  document.getElementById('d-cap').textContent = p ? `${pi + 1} / ${i.pics.length}` : '사진이 없습니다.';
  const multi = i.pics.length > 1;
  document.getElementById('p-prev').hidden = document.getElementById('p-next').hidden = !multi;
  document.querySelectorAll('#d-strip button').forEach((b, k) => b.classList.toggle('on', k === pi));
}
function open_(n) {
  cur = (n + view.length) % view.length; pi = 0; const i = view[cur]; dlg.dataset.cid = 'dugaheon/' + i.id;
  document.getElementById('d-strip').innerHTML = i.pics.length > 1 ? i.pics.map((p, k) => `<button type="button" data-k="${k}" aria-label="${k + 1}번째 사진"><img loading="lazy" src="${p.src}" alt=""></button>`).join('') : '';
  showPic();
  document.getElementById('d-info').innerHTML = `<span class="badge">${esc(i.kind)}</span>${i.imp ? ' <span class="badge" style="background:#8a2f22">중요</span>' : ''}<h3>${esc(i.name)}</h3><div class="hj">${esc(i.hanja)}</div><dl>
    <dt>크기</dt><dd>${esc(i.size ? i.size + ' cm' : '— (도록 캡션이 잘려 읽지 못함)')}</dd>${i.era ? `<dt>시대</dt><dd>조선 ${esc(i.era)}</dd>` : ''}${i.cat ? `<dt>영문 표기</dt><dd>${esc(i.cat)}</dd>` : ''}${i.memo ? `<dt>메모</dt><dd>${esc(i.memo)}</dd>` : ''}<dt>도록 번호</dt><dd>${i.no}</dd><dt>출처</dt><dd>『화가가 애호하는 조선시대 목가구』 — 두가헌 갤러리, 여섯 화가의 소장 가구</dd></dl>
    
    `;
  document.getElementById('d-pos').textContent = `${cur + 1} / ${view.length}`;
  if (!dlg.open) dlg.showModal();
}

/* 사진 확대·끌기·좌우로 밀어 넘기기 — 다른 도록과 같은 공용 photozoom.js */
if (window.MOKGAGU_PHOTOZOOM) MOKGAGU_PHOTOZOOM.attach({ dialog: dlg, area: document.getElementById('d-main'),
  next: () => open_(cur + 1), prev: () => open_(cur - 1), canNext: () => view.length > 1, canPrev: () => view.length > 1,
  pics: { n: () => (view[cur] && view[cur].pics.length) || 0, i: () => pi, set: (k) => { pi = k; showPic(); } } });
document.getElementById('d-strip').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; pi = +b.dataset.k; showPic(); });
document.getElementById('p-prev').onclick = () => { const i = view[cur]; pi = (pi - 1 + i.pics.length) % i.pics.length; showPic(); };
document.getElementById('p-next').onclick = () => { const i = view[cur]; pi = (pi + 1) % i.pics.length; showPic(); };
document.getElementById('d-prev').onclick = () => open_(cur - 1);
document.getElementById('d-next').onclick = () => open_(cur + 1);
document.getElementById('d-close').onclick = () => dlg.close();
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
document.addEventListener('keydown', (e) => { if (!dlg.open) return; if (e.key === 'ArrowRight') document.getElementById('p-next').click(); if (e.key === 'ArrowLeft') document.getElementById('p-prev').click(); });
(function () { const m = location.hash.match(/^#(D\d+)$/); if (m) { const n = ITEMS.findIndex((i) => i.id === m[1]); if (n >= 0) { view = ITEMS; open_(n); } } })();
render();
</script>
