<script>/* (반닫이여지도와 같은 코드) 가족(가족 암호 + 거믄·힌)일 때만 『조선의 궤』 반닫이를 비례 자에 더한다. 도판은 공개 저장소에 평문으로 두지 않고 가족 암호로 잠근 study/joseongwe.bin 에서 풀어 쓴다(메모리에서만). 벗·모르는 분에게는 메뉴가 나오지 않는다 */
window.MOKGAGU_READY=(async function(){try{var g=function(k){return localStorage.getItem(k)||''},w=g('mokgagu_lk_shared')==='1'?(sessionStorage.getItem('mokgagu_lk_who_s')||''):g('mokgagu_cm_who'),code=g('mokgagu_cm_code');
if(!(g('mokgagu_cm_fam')==='1'&&code&&(w==='거믄'||w==='힌')))return;
var b64=function(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
var meta=await fetch('study/salt.json',{cache:'no-store'}).then(function(r){return r.json()});
var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(meta.salt),iterations:meta.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
var buf=new Uint8Array(await fetch('study/joseongwe.bin',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()}));
var o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12))));
new Function(o.j)();new Function(o.g)();}catch(e){}})();</script>

<script>
Promise.resolve(window.MOKGAGU_READY).then(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const REG = ['경상','전라','충청','강원','경기','황해','평안','함경','제주','서울','평양','개성','강화','박천','해주','안동','진주','통영','나주','남원','전주','밀양','울산','동래'];
  const MAP = { 안동: '경상', 진주: '경상', 통영: '경상', 밀양: '경상', 울산: '경상', 동래: '경상', 나주: '전라', 남원: '전라', 전주: '전라', 평양: '평안', 박천: '평안', 해주: '황해', 개성: '경기', 강화: '경기', 서울: '경기' };
  const regOf = (r) => { const m = ((r.name || '') + ' ' + (r.hanja || '')).match(new RegExp(REG.join('|'))); return m ? (MAP[m[0]] || m[0]) : ''; };
  /* 치수 글자 → 가로·높이. 이름표(가로·높이)가 있으면 그대로, 없으면 ×로 이은 세 수 중 앞 둘의 큰 쪽이 가로, 마지막이 높이 */
  function dims(s, b) {
    s = String(s || ''); let w, h;
    const gs = (k) => { const out = []; const re = new RegExp('(?<!옆)' + k + '\\s*([0-9]+(?:\\.[0-9]+)?)', 'g'); let m; while ((m = re.exec(s))) out.push(+m[1]); return out; };
    if (/높이/.test(s) && /(가로|세로|너비|길이)\s*[0-9]/.test(s) && !/×/.test(s)) {
      /* 이름표 방식: 높이는 높이, 가로(앞면 너비)는 가로·세로 중 큰 쪽 / 길이 / 너비 중 가장 큰 값 */
      h = gs('높이')[0];
      const ga = gs('가로'), se = gs('세로'), gi = gs('길이'), ne = gs('너비');
      if (ga.length && se.length) w = Math.max(...ga, ...se);
      else if (ga.length) w = ga[0];
      else if (gi.length) w = gi[0];
      else if (ne.length) w = Math.max(...ne);
    }
    else if (/높이/.test(s) && /×/.test(s)) { h = +(s.match(/높이\s*([0-9.]+)/) || [])[1]; const m = s.split('·').pop().match(/([0-9.]+)\s*×\s*([0-9.]+)/); if (m) w = Math.max(+m[1], +m[2]); }
    else { const m = s.match(/([0-9.]+)\s*×\s*([0-9.]+)\s*×\s*([0-9.]+)/); if (m) { if (b === 'auction') { h = +m[1]; w = +m[3]; } else { w = Math.max(+m[1], +m[2]); h = +m[3]; } } }   /* 경매 도록은 높이×깊이×가로 순서 (사진으로 확인) */
    return w && h && w >= 40 && w <= 140 && h >= 25 && h <= 120 ? { w, h } : null;
  }
  const P = [];
  (window.BANDAJI_IDX || []).forEach((r) => {
    if (!/반닫이/.test((r.name || '') + (r.hanja || ''))) return;
    if (/반닫이\s*(장|탁자|연상|농|함|문갑|책)/.test(r.name || '')) return;   /* 반닫이장·반닫이 탁자 등 다른 가구 제외 */
    if (/책\s*반닫이|冊/.test((r.name || '') + (r.hanja || ''))) return;   /* 책반닫이는 옷 반닫이와 쓰임·비례가 달라 뺌(논문과 같은 기준) */
    const g = regOf(r), d = dims(r.size, r.b); if (g && d) P.push(Object.assign({ g, r }, d));
  });
  { const inN = new Set(P.filter((p) => p.r.b === 'nmk').map((p) => String(p.r.pid))); for (let i = P.length - 1; i >= 0; i--) if (P[i].r.nmk && inN.has(P[i].r.nmk)) P.splice(i, 1); }   /* 이건희 ↔ 국립중앙박물관 같은 기물은 한 번만 */
  /* 가족이면 『조선의 궤』 반닫이도 더한다: 치수는 가로×깊이×높이. 족대 포함·제외 두 값을 함께 적은 것(괄호)·윗닫이는 뺌(논문과 같은 기준) */
  const JDO = { haeju: '황해', gaeseong: '경기', ganghwa: '경기', gyeongdo: '경기', namhan: '경기', geumsan: '충청', sangju: '경상', yecheon: '경상', eonyang: '경상', miryang: '경상', yangsan: '경상', jinju: '경상', gimhae: '경상', namhae: '경상', tongyeong: '경상', iksan: '전라', jeonju: '전라', namwon: '전라', naju: '전라', yeonggwang: '전라', jangheung: '전라', jeju: '제주' };
  let NJ = 0;
  (window.JOSEONGWE || []).forEach((r) => {
    if (/윗닫이/.test(r.name || '')) return;
    const g = JDO[r.r] || String(r.p || '').replace(/도$/, ''), m = String(r.size || '').match(/^([0-9.]+)×([0-9.]+)×([0-9.]+)$/);
    if (!g || !m) return; const w = +m[1], h = +m[3]; if (w < 40 || w > 140 || h < 25 || h > 120) return;
    P.push({ g, r, w, h }); NJ++;
  });
  const COL = { 경상: '#c0532b', 전라: '#2f7d5b', 충청: '#7a5aa6', 강원: '#2b6cb0', 경기: '#b8892a', 평안: '#3b3b3b', 제주: '#d0508a', 황해: '#6b8e23', 함경: '#008b8b' };
  const regs = Object.keys(COL).filter((g) => P.some((p) => p.g === g));   /* 지역이 정해진 반닫이는 점 수와 상관없이 모두 */
  const med = (a) => { a = a.slice().sort((x, y) => x - y); const n = a.length; return n ? (n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2) : 0; };
  const qs = (a, q) => { a = a.slice().sort((x, y) => x - y); return a[Math.floor((a.length - 1) * q)]; };
  /* 부채꼴 그래프: 가로·세로 모두 0에서 시작, 1cm 같은 길이
     - 0에서 뻗는 직선 = 같은 비율(가로:세로)  - 0을 중심으로 한 호 = 같은 크기(0에서 앞면 모서리까지 거리) */
  /* 휴대폰(좁은 화면)에서는 그림 폭을 줄여 그려 눈금·비율 글자가 덜 작아지게 */
  const XM = 140, YM = 125, W = (window.innerWidth || 800) < 560 ? 470 : 700, L = 44, B = 36, T = 34, R = 12, S = (W - L - R) / XM, H = Math.round(T + B + YM * S);
  const sx = (v) => L + v * S, sy = (v) => H - B - v * S;
  const REFM = { w: 102.5, h: 58.4 };   /* 소장 언양반닫이 (compare.js 의 기준과 같은 값) */
  const RAYS = [1, 1.25, 1.5, 1.75, 2];   /* 가로:세로 */
  const PS = P.filter((p) => regs.includes(p.g));
  const DG = PS.map((p) => Math.hypot(p.w, p.h)).sort((x, y) => x - y), R1 = Math.round(qs(DG, 1 / 3)), R2 = Math.round(qs(DG, 2 / 3));   /* 크기 경계: 자료를 셋으로 나눈 값 */
  const sizeOf = (w, h) => { const d = Math.hypot(w, h); return d < R1 ? '소' : d < R2 ? '중' : '대'; };
  const bandOf = (w, h) => { const k = w / h; let i = 0; while (i < RAYS.length && k >= RAYS[i]) i++; return [i ? RAYS[i - 1] : 0, i < RAYS.length ? RAYS[i] : Infinity]; };
  const bandTxt = ([k1, k2]) => !k1 ? `${RAYS[0]} : 1 보다 높음` : k2 === Infinity ? `${k1} : 1 보다 납작함` : `${k1} : 1 ~ ${k2} : 1`;
  const pt = (r, a) => `${sx(r * Math.cos(a)).toFixed(1)} ${sy(r * Math.sin(a)).toFixed(1)}`;
  function cell(w, h) {   /* (w,h)가 들어 있는 부채꼴 칸 */
    const d = Math.hypot(w, h), [k1, k2] = bandOf(w, h);
    const r1 = d < R1 ? 0 : d < R2 ? R1 : R2, r2 = d < R1 ? R1 : d < R2 ? R2 : Math.hypot(XM, YM);
    const a1 = k1 ? Math.atan(1 / k1) : Math.PI / 2, a2 = k2 === Infinity ? 0 : Math.atan(1 / k2);
    return `<path d="M ${pt(r1, a1)} L ${pt(r2, a1)} A ${r2 * S} ${r2 * S} 0 0 1 ${pt(r2, a2)} L ${pt(r1, a2)}${r1 ? ` A ${r1 * S} ${r1 * S} 0 0 0 ${pt(r1, a1)}` : ''} Z" fill="#f2c94c" fill-opacity=".4" stroke="#b8892a"/>`;
  }
  /* 구간 색인: 세로 20cm(세로 방향 줄) × 가로 20cm(가로 방향 칸). 구간은 '아래값 초과 ~ 위값 이하' */
  const HB = [[100, 120], [80, 100], [60, 80], [40, 60], [20, 40]], WB = [[40, 60], [60, 80], [80, 100], [100, 120], [120, 140]];
  const inB = (v, [a, b]) => v > a && v <= b;
  let sel = { h: 0, w: -1 };   /* 처음에는 세로 80~100 줄 */
  function bands(cw, ch) {
    const box = $('bands'); if (!box) return;
    const list = PS.filter((p) => (sel.h < 0 || inB(p.h, HB[sel.h])) && (sel.w < 0 || inB(p.w, WB[sel.w])));
    const cnt = (hi, wi) => PS.filter((p) => (hi < 0 || inB(p.h, HB[hi])) && (wi < 0 || inB(p.w, WB[wi]))).length;
    const on = (hi, wi) => sel.h === hi && sel.w === wi;
    const bt = (hi, wi, txt, cls) => { const n = cnt(hi, wi); return `<button type="button" data-h="${hi}" data-w="${wi}" aria-pressed="${on(hi, wi)}"${cls ? ` class="${cls}"` : ''}${n || hi < 0 || wi < 0 ? '' : ' disabled'}>${txt}</button>`; };
    let t = '<table class="bx"><tr><th class="ch all">' + bt(-1, -1, `전체 <b>${PS.length}</b>점<small>세로↓ 가로→</small>`) + '</th>' + WB.map(([a, b], wi) => `<th class="ch">${bt(-1, wi, `${a}~${b}`)}</th>`).join('') + '</tr>';
    HB.forEach(([a, b], hi) => {
      t += `<tr><th class="rh">${bt(hi, -1, `${a}~${b}`)}</th>` + WB.map((wb, wi) => { const n = cnt(hi, wi), me = inB(ch, HB[hi]) && inB(cw, wb); return `<td>${bt(hi, wi, n ? `<b>${n}</b>` : '·', (n ? '' : 'z') + (me ? ' me' : ''))}</td>`; }).join('') + '</tr>';
    });
    t += '</table>';
    const lab = sel.h < 0 && sel.w < 0 ? '모든 반닫이' : [sel.h >= 0 ? `세로 ${HB[sel.h][0]}~${HB[sel.h][1]}cm` : '', sel.w >= 0 ? `가로 ${WB[sel.w][0]}~${WB[sel.w][1]}cm` : ''].filter(Boolean).join(' · ');
    const L = list.slice().sort((x, y) => y.h - x.h || x.g.localeCompare(y.g));
    const keys = L.map((p) => p.r.b + '/' + p.r.pid);
    const cards = L.map((p) => { const r = p.r; return `<a data-see="${r.b}/${esc(String(r.pid))}" data-band="1" href="index.html#see=${r.b}/${encodeURIComponent(r.pid)}"><img loading="lazy" src="thumbs/${r.b}/${r.n}.jpg" alt="${esc(r.name)}" onerror="this.style.visibility='hidden'"><div><span class="rg" style="background:${COL[p.g] || '#888'}">${p.g}</span> ${esc(r.name)}<br>가로 ${p.w} · 세로 <span class="hv">${p.h}</span><br><span class="sr">${esc(r.owner || r.cat || r.b)}</span></div></a>`; }).join('');
    box.innerHTML = `<div class="bx-h"><b>크기 구간으로 보기</b><small>세로 줄·가로 칸을 누르면 그 구간의 반닫이가 나옵니다. 빨간 테두리 칸 = ${$('w').value && $('h').value ? '넣은 치수' : '우리 언양반닫이'}</small></div><div class="bx-wrap">${t}</div><p style="margin:12px 0 0;font-weight:700">${lab} <span style="color:#8a7f66;font-weight:400">${L.length}점</span></p>` + (L.length ? `<div class="bl">${cards}</div>` : '<p class="sub">이 구간에는 반닫이가 없습니다.</p>');
    box.onclick = (e) => {
      const b = e.target.closest('button[data-h]'); if (b && !b.disabled) { sel = { h: +b.dataset.h, w: +b.dataset.w }; bands(cw, ch); return; }
      if (e.target.closest('a[data-band]')) window.__bandKeys = keys.slice();
    };
    const svg = $('svg'); if (svg) {
      const all = sel.h < 0 && sel.w < 0, set = new Set(list.map((p) => PS.indexOf(p)));
      svg.classList.toggle('dim', !all);
      svg.querySelectorAll('circle.pt').forEach((c) => c.classList.toggle('on', !all && set.has(+c.dataset.i)));
    }
  }
  /* 점을 누르면 그래프 바로 아래에 그 기물이 나온다 (겹친 점은 가까운 순으로 최대 6점) */
  let picked = [];
  const hiUrl = (r) => 'https://jungmono.github.io/mokgagu-photos/photos/' + r.b + '/' + encodeURIComponent(r.pid) + '.jpg';
  function showPick(scroll) {
    const box = $('pick'), svg = $('svg'); if (!box || !svg) return;
    svg.querySelectorAll('circle.pt').forEach((c) => { const on = picked.indexOf(+c.dataset.i) >= 0; c.classList.toggle('sel', on); if (on) svg.insertBefore(c, svg.querySelector('text[font-size="13"][fill="#d12b2b"]')); });
    if (!picked.length) { box.innerHTML = ''; window.__pickKeys = []; return; }
    window.__pickKeys = picked.map((i) => PS[i].r.b + '/' + PS[i].r.pid);
    box.innerHTML = '<div class="card"><div class="hd"><b>고른 점</b><small>' + picked.length + '점 · 겹친 점은 함께 나옵니다</small><button type="button" id="pk-x">닫기</button></div>' + picked.map((i) => {
      const p = PS[i], r = p.r, k = (p.w / p.h).toFixed(2);
      return `<div class="pk"><a data-see="${r.b}/${esc(String(r.pid))}" data-pick="1" href="index.html#see=${r.b}/${encodeURIComponent(r.pid)}"><img src="${hiUrl(r)}" onerror="if(this.dataset.f!=='1'){this.dataset.f='1';this.src='thumbs/${r.b}/${r.n}.jpg'}" alt="${esc(r.name)}"></a><div><div class="t"><span class="rg" style="background:${COL[p.g]}">${p.g}</span>${esc(r.name)}</div><div class="m">가로 ${p.w} × 세로 ${p.h} cm<br>가로:세로 ${k} : 1 · 크기 ${sizeOf(p.w, p.h)}${r.era ? '<br>' + esc(r.era) : ''}${r.page ? '<br>도록 ' + esc(String(r.page)) + '쪽' : ''}<br><a class="go" data-see="${r.b}/${esc(String(r.pid))}" data-pick="1" href="index.html#see=${r.b}/${encodeURIComponent(r.pid)}">사진 크게 보기 →</a></div></div></div>`;
    }).join('') + '</div>';
    $('pk-x').onclick = () => { picked = []; showPick(); };
    if (scroll) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function pickAt(e) {
    const svg = $('svg'); if (!svg || !svg.getScreenCTM) return;
    const m = svg.getScreenCTM(); if (!m) return;
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(m.inverse());
    const near = PS.map((p, i) => ({ i, d: Math.hypot(sx(p.w) - q.x, sy(p.h) - q.y) })).filter((o) => o.d <= (e.pointerType === 'touch' || e.detail === 0 ? 14 : 9)).sort((a, b) => a.d - b.d).slice(0, 6);
    if (!near.length) return;
    picked = near.map((o) => o.i); showPick(true);
  }
  /* 지역별 비례 띠 — 논문 「조선 후기 반닫이 정면 비례의 지역별 분포」(2026)의 그림 1을 이 화면 자료로 다시 그린다.
     띠 = 가운데 절반(사분위 범위), 세로 막대 = 중앙값, 붉은 점선 = 넣은 치수(없으면 우리 언양반닫이)의 가로:세로 */
  const ORD = ['평안', '황해', '함경', '강원', '경기', '충청', '전라', '경상', '제주'];
  const BINS = [[0, 1.15, '1.15 미만'], [1.15, 1.3, '1.15~1.3'], [1.3, 1.5, '1.3~1.5'], [1.5, 99, '1.5 이상']];
  function stripCard(ratio, own) {
    const rg = ORD.filter((g) => P.some((p) => p.g === g)), X0 = 0.8, X1 = 2.3, SW = W, Z = W < 700 ? 1.3 : 1, SL = 56 * Z, SR = 40 * Z, RH = 30 * Z, ST = 22 * Z, SH = ST + rg.length * RH + 30 * Z;   /* 휴대폰: 글자·줄을 1.3배로 */
    const xs = (k) => SL + (Math.min(X1, Math.max(X0, k)) - X0) / (X1 - X0) * (SW - SL - SR);
    let s = `<svg viewBox="0 0 ${SW} ${SH}" width="100%" role="img" aria-label="지역별 가로:세로 띠">`;
    for (let k = 1; k <= 2.25; k += 0.25) s += `<line x1="${xs(k)}" y1="${ST - 6}" x2="${xs(k)}" y2="${SH - 26 * Z}" stroke="#efe6cf"/><text x="${xs(k)}" y="${SH - 10 * Z}" text-anchor="middle" font-size="${12 * Z}" fill="#6d6551">${k.toFixed(2).replace(/0$/, '')}</text>`;
    rg.forEach((g, i) => {
      const q = P.filter((p) => p.g === g).map((p) => p.w / p.h), y = ST + i * RH + RH / 2, a = qs(q, .25), b = qs(q, .75), m = med(q);
      s += `<text x="${SL - 8}" y="${y + 4}" text-anchor="end" font-size="${13 * Z}" font-weight="700" fill="#2b2418">${g}</text>`;
      q.forEach((k) => { s += `<circle cx="${xs(k).toFixed(1)}" cy="${y}" r="${2.6 * Z}" fill="${COL[g]}" fill-opacity=".28"/>`; });
      s += `<rect x="${xs(a)}" y="${y - 7 * Z}" width="${Math.max(2, xs(b) - xs(a))}" height="${14 * Z}" rx="4" fill="${COL[g]}" fill-opacity=".35" stroke="${COL[g]}"/><line x1="${xs(m)}" y1="${y - 10 * Z}" x2="${xs(m)}" y2="${y + 10 * Z}" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>`;
      s += `<text x="${SW - SR + 6}" y="${y + 4}" font-size="${11.5 * Z}" fill="#8a7f66">${q.length}</text>`;
    });
    s += `<line x1="${xs(ratio)}" y1="${ST - 10}" x2="${xs(ratio)}" y2="${SH - 26 * Z}" stroke="#d12b2b" stroke-width="2" stroke-dasharray="5 4"/><text x="${xs(ratio)}" y="${ST - 12}" text-anchor="middle" font-size="${12.5 * Z}" font-weight="700" fill="#d12b2b">${ratio.toFixed(2)}</text></svg>`;
    const bi = BINS.findIndex((x) => ratio >= x[0] && ratio < x[1]), inb = P.filter((p) => { const k = p.w / p.h; return k >= BINS[bi][0] && k < BINS[bi][1]; });
    const c = {}; inb.forEach((p) => (c[p.g] = (c[p.g] || 0) + 1)); const top = Object.entries(c).sort((x, y) => y[1] - x[1]), mx = top.length ? top[0][1] : 1;
    const bars = top.map(([g, n]) => `<div style="display:grid;grid-template-columns:3em 1fr 2.5em;gap:8px;align-items:center;font-size:13.5px"><span>${g}</span><i style="display:block;height:10px;border-radius:99px;background:${COL[g]};width:${Math.round(n / mx * 100)}%"></i><span style="color:#6d6551">${n}</span></div>`).join('');
    const word = bi === 3 ? '경상 반닫이에 많은 비례' : bi === 2 ? '전라·경상·경기에 걸친 비례' : '여러 지역에 걸친 비례 — 비례만으로는 가리지 않음';
    return `<div class="card"><b>지역별 가로:세로</b> <small style="color:#8a7f66">띠는 가운데 절반, 검은 막대는 중앙값</small>${s}` +
      `<p style="margin:10px 0 6px;font-size:15px">${own ? '넣은 치수' : '우리 언양반닫이'} <b>${ratio.toFixed(2)} : 1</b> → <b>${BINS[bi][2]}</b> 구간 · ${word}</p>` +
      `<p class="hint" style="margin:0 0 6px">이 구간 반닫이 ${inb.length}점의 지역</p>${bars}` +
      `<p class="hint">자료: 도록에 지역과 치수가 적힌 반닫이 ${P.length}점${NJ ? `(『조선의 궤』 ${NJ}점 포함 — 가족에게만 보임)` : ''}. 책반닫이·두 도록에 거듭 실린 기물은 뺐습니다. 논문 「조선 후기 반닫이 정면 비례의 지역별 분포」(2026)와 같은 기준이며 도록이 늘면 숫자도 함께 바뀝니다.</p></div>`;
  }
  function draw() {
    const iw = parseFloat($('w').value), ih = parseFloat($('h').value), own = iw > 0 && ih > 0;
    const w = own ? iw : REFM.w, h = own ? ih : REFM.h, ok = true;
    let s = `<svg id="svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="지역별 반닫이 크기와 비율 부채꼴 그래프"><defs><clipPath id="pl"><rect x="${L}" y="${T}" width="${XM * S}" height="${YM * S}"/></clipPath></defs>`;
    for (let v = 0; v <= XM; v += 10) s += `<line x1="${sx(v)}" y1="${sy(0)}" x2="${sx(v)}" y2="${sy(YM)}" stroke="#efe6cf"/>` + (v % 20 ? '' : `<text x="${sx(v)}" y="${H - 16}" text-anchor="middle" font-size="12" fill="#6d6551">${v}</text>`);
    for (let v = 0; v <= YM; v += 10) s += `<line x1="${sx(0)}" y1="${sy(v)}" x2="${sx(XM)}" y2="${sy(v)}" stroke="#efe6cf"/>` + (v % 20 ? '' : `<text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end" font-size="12" fill="#6d6551">${v}</text>`);
    s += `<text x="${W - R}" y="${H - 2}" text-anchor="end" font-size="12" fill="#8a7f66">가로 cm</text><text x="4" y="${T - 14}" font-size="12" fill="#8a7f66">세로 cm</text>`;
    s += `<g clip-path="url(#pl)">${cell(w, h)}`;
    [[R1, '소 | 중'], [R2, '중 | 대']].forEach(([r, t], ai) => { const x0 = r > YM ? Math.sqrt(r * r - YM * YM) : 0; s += `<path d="M ${sx(x0)} ${sy(Math.min(r, YM))} A ${r * S} ${r * S} 0 0 1 ${sx(r)} ${sy(0)}" fill="none" stroke="#8a5a2b" stroke-width="2" stroke-dasharray="7 5"/><text x="${sx(r) + 4}" y="${sy(W < 700 ? 4 + ai * 9 : 4)}" font-size="${W < 700 ? 12 : 13}" font-weight="700" fill="#8a5a2b">${W < 700 ? t.replace(/ /g, '') : t}</text>`; });
    s += `<rect x="${sx(0)}" y="${sy(REFM.h)}" width="${REFM.w * S}" height="${REFM.h * S}" fill="#d12b2b" fill-opacity=".06" stroke="#d12b2b" stroke-width="1.5"/>`;
    if (own) s += `<rect x="${sx(0)}" y="${sy(h)}" width="${w * S}" height="${h * S}" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4"/>`;
    s += '</g>';
    RAYS.forEach((k) => { const x = Math.min(XM, YM * k), y = x / k, top = x < XM; s += `<line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(x)}" y2="${sy(y)}" stroke="#555" stroke-width="1.2"/><text x="${sx(x)}" y="${sy(y) - (top ? 8 : 6)}" text-anchor="${top ? 'middle' : 'end'}" font-size="13" font-weight="700" fill="#333">${k} : 1</text>`; });
    PS.forEach((p, i) => { s += `<circle class="pt" data-i="${i}" cx="${sx(p.w)}" cy="${sy(p.h)}" r="4.5" fill="${COL[p.g]}" fill-opacity=".6"><title>${p.g} · ${esc(p.r.name)} ${p.w}×${p.h}</title></circle>`; });
    s += `<text x="${sx(REFM.w / 2)}" y="${sy(REFM.h / 2)}" text-anchor="middle" font-size="13" fill="#d12b2b">우리 언양반닫이 앞면 (${REFM.w} × ${REFM.h})</text><circle cx="${sx(REFM.w)}" cy="${sy(REFM.h)}" r="8" fill="#d12b2b" stroke="#fff" stroke-width="2"/>`;
    if (own) s += `<circle cx="${sx(Math.min(w, XM))}" cy="${sy(Math.min(h, YM))}" r="9" fill="#fff" stroke="#111" stroke-width="3"/>`;
    s += '</svg><div class="leg">' + regs.map((g) => `<span><i style="background:${COL[g]}"></i>${g} ${P.filter((p) => p.g === g).length}</span>`).join('') + '</div>';
    s += `<p class="sub" style="margin:6px 0 0;font-size:13px;line-height:1.6;text-align:left">점 하나는 반닫이 앞면의 오른쪽 위 모서리입니다. 0에서 뻗은 <b>직선</b> 위의 반닫이는 크기가 달라도 생김새(가로 : 세로)가 같고 아래쪽 직선일수록 납작합니다. <b>점선 호</b>는 0에서 모서리까지 거리가 같은 선으로 바깥일수록 큽니다(경계 ${R1}cm · ${R2}cm, 자료를 셋으로 나눈 값). <b>노란 칸</b>은 ${own ? '넣은 치수' : '우리 언양반닫이'}가 들어 있는 칸 — <b>${sizeOf(w, h)} 크기 · ${bandTxt(bandOf(w, h))}</b></p>`;
    let v = '';
    if (ok) {
      const ratio = w / h, K = 15;   /* 가로:세로 = ratio : 1 */
      const fmt = (x) => x.toFixed(2) + ' : 1';
      const tally = (arr) => { const c = {}; arr.forEach((x) => (c[x.p.g] = (c[x.p.g] || 0) + 1)); return c; };
      const line = (c) => Object.entries(c).sort((a, b) => b[1] - a[1]).map(([g, n]) => g + ' ' + n).join(' · ');
      const nearS = P.map((p) => ({ p, d: Math.hypot((p.w - w) / 100, (p.h - h) / 100) })).sort((a, b) => a.d - b.d);
      const nearR = P.map((p) => ({ p, d: Math.abs(Math.log(p.w / p.h) - Math.log(ratio)) })).sort((a, b) => a.d - b.d);
      const cS = tally(nearS.slice(0, K)), cR = tally(nearR.slice(0, K));
      const hi = (r) => 'https://jungmono.github.io/mokgagu-photos/photos/' + r.b + '/' + encodeURIComponent(r.pid) + '.jpg';
      window.__seeKeys = [];
      const cards = (arr, shows) => arr.slice(0, 6).map(({ p }) => { const r = p.r; window.__seeKeys.push(r.b + '/' + r.pid); return `<a data-see="${r.b}/${esc(String(r.pid))}" href="index.html#see=${r.b}/${encodeURIComponent(r.pid)}"><img loading="lazy" src="${hi(r)}" onerror="if(this.dataset.f!=='1'){this.dataset.f='1';this.src='thumbs/${r.b}/${r.n}.jpg'}" alt=""><small><b>${p.g}</b> · ${shows(p)}<br>${esc(r.name)}</small></a>`; }).join('');
      v = `<div class="card verdict"><b>${own ? '넣은 치수' : '우리 언양반닫이'}</b> 가로 ${w} · 세로 ${h}<br>가로:세로 = <b>${fmt(ratio)}</b><br>크기가 가장 비슷한 ${K}점 가운데 <b>${line(cS)}</b><br>비율이 가장 비슷한 ${K}점 가운데 <b>${line(cR)}</b></div>`;
      v += stripCard(ratio, own);
      v += `<div class="card"><table><tr><th>지역</th><th>점수</th><th>가로 중앙값</th><th>세로 중앙값</th><th>가로:세로<br>(중간 절반)</th></tr>` + regs.map((g) => { const a = P.filter((p) => p.g === g), q = a.map((p) => p.w / p.h); return `<tr${cS[g] || cR[g] ? ' style="background:#fbf6ea;font-weight:700"' : ''}><td>${g}</td><td>${a.length}</td><td>${med(a.map((p) => p.w)).toFixed(0)}</td><td>${med(a.map((p) => p.h)).toFixed(0)}</td><td>${qs(q, .25).toFixed(2)}~${qs(q, .75).toFixed(2)}</td></tr>`; }).join('') + `</table></div>`;
      v += `<div class="card"><b>크기가 가장 닮은 반닫이</b><div class="near">${cards(nearS, (p) => p.w + '×' + p.h)}</div></div>`;
      v += `<div class="card"><b>비율이 가장 닮은 반닫이</b> <small style="color:#8a7f66">크기는 달라도 가로:세로가 같은 것</small><div class="near">${cards(nearR, (p) => fmt(p.w / p.h) + ' (' + p.w + '×' + p.h + ')')}</div></div>`;
    }
    window.__nearKeys = (window.__seeKeys || []).slice();
    $('out').innerHTML = `<div class="card">${s}</div><div id="pick"></div><div class="card" id="bands"></div>` + v;
    $('svg').addEventListener('click', pickAt);
    bands(w, h); showPick(false);
  }
  if (!P.length) { $('out').innerHTML = '<div class="card">치수가 적힌 반닫이를 찾지 못했어요.</div>'; return; }
  ['w', 'h'].forEach((id) => $(id).addEventListener('input', draw));
  const q = new URLSearchParams(location.search); if (q.get('w')) $('w').value = q.get('w'); if (q.get('h')) $('h').value = q.get('h');
  draw(); window.__P = P.length;
});

document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[data-see]'); if (!a) return;
  if (/^joseongwe\//.test(a.dataset.see || '')) { e.preventDefault(); window.open('https://jungmono.github.io/mokgagu-photos/photos/joseongwe/' + encodeURIComponent(a.dataset.see.slice(10)) + '.jpg', '_blank'); return; }   /* 『조선의 궤』는 사진 창이 없으니 사진만 연다 */
  const ks = ((a.dataset.band ? window.__bandKeys : a.dataset.pick ? window.__pickKeys : window.__nearKeys) || window.__seeKeys || []).filter((k, i, A) => A.indexOf(k) === i);

});
