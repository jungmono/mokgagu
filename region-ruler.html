<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비례 자 — 조선의 목가구</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111111"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf6ea;color:#2b2418;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px}
h1{margin:6px 0 4px;font-weight:900;font-size:clamp(26px,6vw,40px);letter-spacing:-.04em;text-align:center}
.sub{text-align:center;color:#6d6551;margin:0 0 16px;font-size:15px}
.top{display:flex;justify-content:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.top a{color:#2b2418;background:#fff;border:1px solid #e3d6b8;border-radius:999px;padding:6px 14px;text-decoration:none;font-size:14px;font-weight:700}
.card{background:#fff;border:1px solid #e3d6b8;border-radius:14px;padding:14px;margin-bottom:14px}
.in{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.in label{font-size:14px;font-weight:700;display:block}
.in input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:1.5px solid #d8c9a3;border-radius:10px;margin-top:4px;background:#fff}
.hint{font-size:12.5px;color:#8a7f66;margin:8px 0 0}
#svg{width:100%;height:auto;display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;margin:8px 0 0}.leg span{display:inline-flex;align-items:center;gap:5px}.leg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.verdict{font-size:16px;line-height:1.7}.verdict b{font-weight:900}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;border-bottom:1px solid #efe6cf;text-align:center}th{font-size:12.5px;color:#6d6551}td:first-child,th:first-child{text-align:left}
.near{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.near a{display:block;text-decoration:none;color:inherit;border:1px solid #e3d6b8;border-radius:10px;overflow:hidden;background:#fff}
.near img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#f4ecd8;display:block}
.near small{display:block;padding:5px 7px;font-size:12px;line-height:1.4;color:#4a4130}
.note{font-size:12.5px;color:#8a7f66;line-height:1.6;text-align:center}
@media(max-width:520px){.near{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="common.js?v=8" defer></script></head><body><main>
<script src="tools-head.js" data-k="ruler"></script>
<div class="card"><div class="in">
<label>가로 (cm)<input id="w" type="number" inputmode="decimal" min="30" max="160"></label>
<label>세로 (cm)<input id="h" type="number" inputmode="decimal" min="20" max="160"></label></div>
<p class="hint">우리 언양반닫이 가로 102.5 · 세로 58.4</p></div>
<div id="out"><div class="card"><p class="sub" style="margin:0">자료를 불러오는 중…</p></div></div>
<p class="note">비례만으로 지역을 정할 수는 없어요. 장석·나무·짜임을 함께 보세요(<a href="jangseok-find.html">장석으로 지역 찾기</a>). 도록에 지역이 적힌 반닫이만 셉니다.</p>
</main>
<script src="search.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const REG = ['경상','전라','충청','강원','경기','황해','평안','함경','제주','서울','평양','개성','강화','박천','해주','안동','진주','통영','나주','남원','전주','밀양','울산','동래'];
  const MAP = { 안동: '경상', 진주: '경상', 통영: '경상', 밀양: '경상', 울산: '경상', 동래: '경상', 나주: '전라', 남원: '전라', 전주: '전라', 평양: '평안', 박천: '평안', 해주: '황해', 개성: '경기', 강화: '경기', 서울: '경기' };
  const regOf = (r) => { const m = (r.name || '').match(new RegExp(REG.join('|'))); return m ? (MAP[m[0]] || m[0]) : ''; };
  /* 치수 글자 → 가로·높이. 이름표(가로·높이)가 있으면 그대로, 없으면 ×로 이은 세 수 중 앞 둘의 큰 쪽이 가로, 마지막이 높이 */
  function dims(s) {
    s = String(s || ''); let w, h;
    const g = (k) => { const m = s.match(new RegExp(k + '\\s*([0-9]+(?:\\.[0-9]+)?)')); return m ? +m[1] : null; };
    if (/가로/.test(s) && /높이/.test(s)) { w = g('가로'); h = g('높이'); }
    else if (/높이/.test(s) && /×/.test(s)) { h = g('높이'); const m = s.split('·').pop().match(/([0-9.]+)\s*×\s*([0-9.]+)/); if (m) w = Math.max(+m[1], +m[2]); }
    else { const m = s.match(/([0-9.]+)\s*×\s*([0-9.]+)\s*×\s*([0-9.]+)/); if (m) { w = Math.max(+m[1], +m[2]); h = +m[3]; } }
    return w && h && w >= 40 && w <= 140 && h >= 25 && h <= 90 ? { w, h } : null;
  }
  const P = [];
  (window.SEARCH || []).forEach((r) => {
    if (!/반닫이/.test((r.name || '') + (r.hanja || ''))) return;
    if (/반닫이\s*(장|탁자|연상|농|함|문갑|책)/.test(r.name || '')) return;   /* 반닫이장·반닫이 탁자 등 다른 가구 제외 */
    const g = regOf(r), d = dims(r.size); if (g && d) P.push(Object.assign({ g, r }, d));
  });
  const COL = { 경상: '#c0532b', 전라: '#2f7d5b', 충청: '#7a5aa6', 강원: '#2b6cb0', 경기: '#b8892a', 평안: '#3b3b3b', 제주: '#d0508a', 황해: '#6b8e23', 함경: '#008b8b' };
  const regs = Object.keys(COL).filter((g) => P.filter((p) => p.g === g).length >= 5);
  const med = (a) => { a = a.slice().sort((x, y) => x - y); const n = a.length; return n ? (n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2) : 0; };
  const qs = (a, q) => { a = a.slice().sort((x, y) => x - y); return a[Math.floor((a.length - 1) * q)]; };
  const X0 = 50, X1 = 130, Y0 = 30, Y1 = 100, W = 700, L = 44, B = 34, T = 10, R = 10, PPC = (W - L - R) / (X1 - X0), H = Math.round(T + B + (Y1 - Y0) * PPC);   /* 가로·세로 1cm 가 같은 길이가 되게 */
  const sx = (v) => L + (v - X0) / (X1 - X0) * (W - L - R), sy = (v) => H - B - (v - Y0) * PPC;
  const REFM = { w: 102.5, h: 58.4 };   /* 소장 언양반닫이 (compare.js 의 기준과 같은 값) */
  function draw() {
    const iw = parseFloat($('w').value), ih = parseFloat($('h').value), own = iw > 0 && ih > 0;
    const w = own ? iw : REFM.w, h = own ? ih : REFM.h, ok = true;
    let s = `<svg id="svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="지역별 가로·세로 분포">`;
    for (let v = 60; v <= 120; v += 10) s += `<line x1="${sx(v)}" y1="${T}" x2="${sx(v)}" y2="${H - B}" stroke="#efe6cf"/>` + (v % 20 ? '' : `<text x="${sx(v)}" y="${H - 12}" text-anchor="middle" font-size="13" fill="#6d6551">${v}</text>`);
    for (let v = 40; v <= 100; v += 10) s += `<line x1="${L}" y1="${sy(v)}" x2="${W - R}" y2="${sy(v)}" stroke="#efe6cf"/>` + (v % 20 ? '' : `<text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end" font-size="13" fill="#6d6551">${v}</text>`);
    s += `<text x="${W - R}" y="${H - 1}" text-anchor="end" font-size="12" fill="#8a7f66">가로 cm</text><text x="4" y="${T + 8}" font-size="12" fill="#8a7f66">세로 cm</text>`;
    P.filter((p) => regs.includes(p.g)).forEach((p) => { s += `<circle cx="${sx(p.w)}" cy="${sy(p.h)}" r="4.5" fill="${COL[p.g]}" fill-opacity=".55"/>`; });
    s += `<circle cx="${sx(REFM.w)}" cy="${sy(REFM.h)}" r="8" fill="#d12b2b" stroke="#fff" stroke-width="2"/><text x="${sx(REFM.w) + 12}" y="${sy(REFM.h) - 8}" font-size="13" font-weight="700" fill="#d12b2b">우리 언양반닫이</text>`;
    if (own) s += `<g><line x1="${sx(w)}" y1="${T}" x2="${sx(w)}" y2="${H - B}" stroke="#111" stroke-dasharray="4 4"/><line x1="${L}" y1="${sy(h)}" x2="${W - R}" y2="${sy(h)}" stroke="#111" stroke-dasharray="4 4"/><circle cx="${sx(w)}" cy="${sy(h)}" r="9" fill="#fff" stroke="#111" stroke-width="3"/></g>`;
    s += '</svg><div class="leg">' + regs.map((g) => `<span><i style="background:${COL[g]}"></i>${g} ${P.filter((p) => p.g === g).length}</span>`).join('') + '</div>';
    let v = '';
    if (ok) {
      const ratio = w / h, K = 15;   /* 가로:세로 = ratio : 1 */
      const fmt = (x) => x.toFixed(2) + ' : 1';
      const tally = (arr) => { const c = {}; arr.forEach((x) => (c[x.p.g] = (c[x.p.g] || 0) + 1)); return c; };
      const line = (c) => Object.entries(c).sort((a, b) => b[1] - a[1]).map(([g, n]) => g + ' ' + n).join(' · ');
      const nearS = P.map((p) => ({ p, d: Math.hypot((p.w - w) / 100, (p.h - h) / 100) })).sort((a, b) => a.d - b.d);
      const nearR = P.map((p) => ({ p, d: Math.abs(Math.log(p.w / p.h) - Math.log(ratio)) })).sort((a, b) => a.d - b.d);
      const cS = tally(nearS.slice(0, K)), cR = tally(nearR.slice(0, K));
      const hi = (r) => 'https://jungmono.github.io/mokgagu-photos/photos/' + r.b + '/' + encodeURIComponent(r.pid) + '.jpg';
      window.__seeKeys = [];
      const cards = (arr, shows) => arr.slice(0, 6).map(({ p }) => { const r = p.r; window.__seeKeys.push(r.b + '/' + r.pid); return `<a data-see="${r.b}/${esc(String(r.pid))}" href="index.html#see=${r.b}/${encodeURIComponent(r.pid)}"><img loading="lazy" src="${hi(r)}" onerror="if(this.dataset.f!=='1'){this.dataset.f='1';this.src='thumbs/${r.b}/${r.n}.jpg'}" alt=""><small><b>${p.g}</b> · ${shows(p)}<br>${esc(r.name)}</small></a>`; }).join('');
      v = `<div class="card verdict"><b>${own ? '넣은 치수' : '우리 언양반닫이'}</b> 가로 ${w} · 세로 ${h}<br>가로:세로 = <b>${fmt(ratio)}</b><br>크기가 가장 비슷한 ${K}점 가운데 <b>${line(cS)}</b><br>비율이 가장 비슷한 ${K}점 가운데 <b>${line(cR)}</b></div>`;
      v += `<div class="card"><table><tr><th>지역</th><th>점수</th><th>가로 중앙값</th><th>세로 중앙값</th><th>가로:세로<br>(중간 절반)</th></tr>` + regs.map((g) => { const a = P.filter((p) => p.g === g), q = a.map((p) => p.w / p.h); return `<tr${cS[g] || cR[g] ? ' style="background:#fbf6ea;font-weight:700"' : ''}><td>${g}</td><td>${a.length}</td><td>${med(a.map((p) => p.w)).toFixed(0)}</td><td>${med(a.map((p) => p.h)).toFixed(0)}</td><td>${qs(q, .25).toFixed(2)}~${qs(q, .75).toFixed(2)}</td></tr>`; }).join('') + `</table></div>`;
      v += `<div class="card"><b>크기가 가장 닮은 반닫이</b><div class="near">${cards(nearS, (p) => p.w + '×' + p.h)}</div></div>`;
      v += `<div class="card"><b>비율이 가장 닮은 반닫이</b> <small style="color:#8a7f66">크기는 달라도 가로:세로가 같은 것</small><div class="near">${cards(nearR, (p) => fmt(p.w / p.h) + ' (' + p.w + '×' + p.h + ')')}</div></div>`;
    }
    $('out').innerHTML = `<div class="card">${s}</div>` + v;
  }
  if (!P.length) { $('out').innerHTML = '<div class="card">치수가 적힌 반닫이를 찾지 못했어요.</div>'; return; }
  ['w', 'h'].forEach((id) => $(id).addEventListener('input', draw));
  const q = new URLSearchParams(location.search); if (q.get('w')) $('w').value = q.get('w'); if (q.get('h')) $('h').value = q.get('h');
  draw(); window.__P = P.length;
})();

document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[data-see]'); if (!a) return;
  const ks = (window.__seeKeys || []).filter((k, i, A) => A.indexOf(k) === i);
  try { sessionStorage.setItem('mokgagu_see_list', JSON.stringify({ list: ks, label: '비례 자', back: 'region-ruler.html' })); } catch (x) {}
});
</script></body></html>
