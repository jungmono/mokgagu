<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시안 A · 서가 — 조선의 목가구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 시안 A — 서가(書架)
   도록 표지를 책처럼 세워 나뭇결 선반 위에 꽂는다. 무리(도록·박물관·경매·도움)마다 선반 한 칸.
   바탕은 흰 종이, 글은 먹, 선반만 먹감나무 빛. 제목은 명조로. */
:root{--paper:#ffffff;--ink:#1a1714;--sub:#6e665d;--rule:#e4dfd8;--shelf:#4a3426;--shelf-hi:#6b4c37;--brass:#a8844a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 70px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.duo{display:inline-flex}.duo span{display:inline-block;min-width:2.9em;text-align:center;padding:.12em .45em;border:1.5px solid var(--ink);line-height:1.2}
.duo .k{background:var(--ink);color:#fff}.duo .w{background:#fff}
.top small{margin-left:8px;color:var(--sub);font-weight:500}
header{text-align:center;padding:48px 0 34px}
.title{display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,3vw,34px)}
.title img{height:clamp(34px,5.2vw,60px);width:auto;margin-bottom:6px}.title img.ag{height:clamp(30px,4.6vw,53px)}
h1{margin:0;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:clamp(34px,6vw,64px);letter-spacing:-.02em;line-height:1.1}
.lede{margin:16px 0 0;font-family:"Nanum Myeongjo",serif;font-size:clamp(15px,1.7vw,18px);color:var(--sub)}
.find{display:flex;justify-content:center;margin:30px auto 0;max-width:560px}
.find input{flex:1;font:inherit;font-size:16px;padding:13px 20px;border:1.5px solid var(--ink);border-radius:999px;outline:none;background:#fff}
.find input:focus-visible{box-shadow:0 0 0 3px #d9cdb8}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin:20px 0 0}
.quick a{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;font-size:13px;font-weight:500;color:var(--sub);padding:6px 4px;border-radius:8px}
.quick a svg{width:30px;height:30px;color:var(--ink)}
.quick a:hover{color:var(--ink);background:#f5f2ee}
.count{text-align:center;margin:26px 0 0;font-size:14px;color:var(--sub)}.count b{color:var(--ink)}
/* 선반 */
.case{margin-top:54px}
.shelf{margin:0 0 46px}
.shelf h2{display:flex;align-items:baseline;gap:12px;margin:0 0 6px;font-family:"Nanum Myeongjo",serif;font-weight:800;font-size:23px}
.shelf h2 small{font-family:"Noto Sans KR",sans-serif;font-weight:500;font-size:13.5px;color:var(--sub)}
.row{display:flex;align-items:flex-end;gap:18px;overflow-x:auto;padding:22px 14px 0;scrollbar-width:thin}
.bk{flex:none;width:118px;text-decoration:none;display:block;position:relative}
.bk .cv{display:block;width:118px;height:158px;object-fit:cover;background:#efebe5;box-shadow:2px 0 0 rgba(0,0,0,.08),4px 6px 10px rgba(40,25,10,.22);transform-origin:bottom center;transition:transform .2s}
.bk:hover .cv,.bk:focus-visible .cv{transform:translateY(-8px)}
.bk:focus-visible{outline:none}.bk:focus-visible .cv{outline:3px solid var(--brass);outline-offset:3px}
.bk .tip{position:absolute;left:0;right:0;bottom:calc(100% + 4px);background:var(--ink);color:#fff;font-size:12px;line-height:1.4;padding:6px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s}
.bk:hover .tip,.bk:focus-visible .tip{opacity:1}
.board{height:16px;margin:0 -2px;background:linear-gradient(var(--shelf-hi),var(--shelf) 45%,#2f2017);border-radius:2px;box-shadow:0 6px 10px rgba(40,25,10,.18)}
.labels{display:flex;gap:18px;padding:10px 14px 0;overflow:hidden}
.labels span{flex:none;width:118px;font-size:12.5px;line-height:1.4;color:var(--ink);font-weight:500}
.labels span em{display:block;font-style:normal;color:var(--sub);font-size:12px}
/* 공부방 */
.study{display:flex;align-items:center;gap:22px;border:1.5px solid var(--ink);border-radius:14px;padding:22px 26px;text-decoration:none;margin:0 0 54px}
.study .lk{flex:none;width:58px;height:58px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:24px}
.study b{font-family:"Nanum Myeongjo",serif;font-size:22px;font-weight:800}
.study p{margin:4px 0 0;color:var(--sub);font-size:14.5px}
.study .go{margin-left:auto;font-weight:700;font-size:14px;border-bottom:1.5px solid var(--ink)}
.talk{display:block;text-align:center;font-weight:700;font-size:15px;margin:-10px 0 0}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--rule);text-align:center;font-size:12.5px;color:var(--sub);line-height:1.7}
.sample{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:7px 14px;border-radius:999px;z-index:9}
.sample a{color:#e8d6b3}
@media (max-width:600px){.study{flex-wrap:wrap}.study .go{margin-left:0}.bk,.bk .cv,.labels span{width:96px}.bk .cv{height:128px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><span class="duo"><span class="w">거믄</span><span class="k">힌</span></span><small>고미술공부방</small></span><span class="duo"><span class="k">since</span><span class="w">2026.10.16.</span></span></div>
  <header>
    <div class="title"><img class="ag" src="mark_angwe.png" alt="안궤"><h1>조선의 목가구</h1><img src="mark_eonyang_white.png" alt="언양반닫이"></div>
    <p class="lede">답십리 동인방에서 배우며 모은 목가구 도록과 자료</p>
    <form class="find" action="index.html"><input type="search" name="q" placeholder="물건 이름으로 찾기 — 반닫이, 이층장, 소반" aria-label="물건 이름으로 찾기"></form>
    <nav class="quick" id="quick" aria-label="기물로 바로 찾기"></nav>
    <p class="count" id="count"></p>
  </header>

  <a class="study" href="study.html"><span class="lk">🔒</span><span><b>거믄과 힌의 공부방</b><p>동인방 정대영 선생님 수업 — 거믄의 노트, 힌의 노트를 날짜별로</p></span><span class="go">가족 암호로 열기</span></a>

  <main class="case" id="case"></main>
  <a class="talk" href="comments.html">💬 기물 이야기 모아보기</a>

  <footer>도록 사진과 캡션의 저작권은 각 소장처·발행처에 있으며, 무단 복제·재배포를 금합니다.<br>마지막 업데이트 <b id="upd"></b></footer>
</div>
<div class="sample">시안 A · 서가 — <a href="design-b.html">B</a> · <a href="design-c.html">C</a> · <a href="index.html">지금 홈</a></div>
<script src="design-data.js"></script>
<script>
(function () {
  var D = DS_DASH, $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  $('quick').innerHTML = DS_QUICK.map(function (q) { return '<a href="index.html?q=' + encodeURIComponent(q[0]) + '">' + dsIcon(q[1], 1.6) + q[0] + '</a>'; }).join('');
  $('count').innerHTML = '도록과 자료 <b>' + D.length + '</b>권에 기물 <b>' + dsFmt(dsTotal()) + '</b>건';
  $('upd').textContent = D.reduce(function (a, d) { return d.added > a ? d.added : a; }, '').replaceAll('-', '. ') + '.';
  $('case').innerHTML = DS_GROUPS.map(function (g) {
    var L = D.filter(function (d) { return (d.group || '') === g[0]; }); if (!L.length) return '';
    var n = L.reduce(function (s, d) { return s + d.items; }, 0);
    return '<section class="shelf"><h2>' + g[1] + ' <small>' + g[2] + ' · ' + L.length + '권 ' + dsFmt(n) + '건</small></h2>' +
      '<div class="row">' + L.map(function (d) { return '<a class="bk" href="' + d.path + '.html"><span class="tip">' + esc(d.desc) + '</span><img class="cv" src="covers/' + d.path + '.jpg" alt="' + esc(d.title) + ' 표지" loading="lazy"></a>'; }).join('') + '</div>' +
      '<div class="board"></div><div class="labels">' + L.map(function (d) { return '<span>' + esc(d.title) + '<em>' + dsFmt(d.items) + '건</em></span>'; }).join('') + '</div></section>';
  }).join('');
  // 표지 줄과 이름 줄이 함께 옆으로 밀리게
  document.querySelectorAll('.shelf').forEach(function (s) { var r = s.querySelector('.row'), l = s.querySelector('.labels'); r.addEventListener('scroll', function () { l.scrollLeft = r.scrollLeft; }, { passive: true }); });
})();
</script>
</body>
</html>
