<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>시안 C · 거믄과 힌 — 조선의 목가구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 시안 C — 거믄과 힌
   첫 화면을 검은 반쪽(거믄)과 흰 반쪽(힌)으로 나누고, 제목이 그 경계를 가로지르며 색이 뒤집힌다.
   아래는 박물관 전시실처럼: 표지를 벽에 걸고 그 아래 작은 이름표. 장식은 덜고 표지와 글만. */
:root{--k:#141210;--w:#ffffff;--mid:#77706a;--line:#e3dfda;--seal:#9b2f22}
*{box-sizing:border-box}
html,body{margin:0;background:var(--w);color:var(--k)}
body{font-family:"IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
.hero{position:relative;min-height:min(78vh,640px);display:grid;grid-template-columns:1fr 1fr}
.hero .half{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:22px clamp(18px,4vw,48px) 30px}
.hero .g{background:var(--k);color:var(--w)}
.hero .h{background:var(--w);color:var(--k);border-bottom:1px solid var(--line)}
.hero .tag{font-weight:700;font-size:14px}
.hero .tag small{display:block;font-weight:400;color:var(--mid);margin-top:4px;font-size:13px}
.hero .g .tag small{color:#a9a29a}
.hero .h .tag{text-align:right}
.hero img{width:clamp(110px,16vw,190px);height:auto}
.hero .g img{filter:invert(1);mix-blend-mode:screen;align-self:flex-start}
.hero .h img{align-self:flex-end}
.hero h1{position:absolute;left:0;right:0;top:50%;transform:translateY(-58%);margin:0;text-align:center;pointer-events:none;
  font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(46px,10.5vw,148px);letter-spacing:-.04em;line-height:1;color:#fff;mix-blend-mode:difference}
.hero .lede{position:absolute;left:0;right:0;top:50%;margin:clamp(46px,7vw,98px) 0 0;text-align:center;font-family:"Noto Serif KR",serif;font-size:clamp(14px,1.6vw,18px);color:#fff;mix-blend-mode:difference;pointer-events:none}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.find{flex:1 1 300px;display:flex}
.find input{flex:1;font:inherit;font-size:15px;padding:10px 16px;border:1.5px solid var(--k);border-radius:4px;outline:none}
.find input:focus-visible{box-shadow:0 0 0 3px #d6d1cb}
.quick{display:flex;flex-wrap:wrap;gap:2px}
.quick a{display:grid;place-items:center;width:40px;height:40px;border-radius:4px;color:var(--k)}
.quick a svg{width:26px;height:26px}
.quick a:hover,.quick a:focus-visible{background:var(--k);color:#fff;outline:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
.room{padding:56px 0 8px;border-bottom:1px solid var(--line)}
.room h2{margin:0;font-family:"Noto Serif KR",serif;font-size:clamp(24px,3vw,32px);font-weight:900;letter-spacing:-.03em}
.room .sub{margin:6px 0 30px;color:var(--mid);font-size:14.5px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:40px 30px}
.work{text-decoration:none;display:block}
.work .fr{aspect-ratio:3/4;display:grid;place-items:end center;padding:0 0 4px}
.work img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 1px 1px rgba(0,0,0,.08),0 10px 24px rgba(0,0,0,.14);transition:transform .2s}
.work:hover img{transform:translateY(-4px)}
.work:focus-visible{outline:none}.work:focus-visible img{outline:3px solid var(--k);outline-offset:4px}
.label{margin-top:14px;padding-left:10px;border-left:2px solid var(--k)}
.label b{display:block;font-size:14.5px;line-height:1.35}
.label span{display:block;margin-top:3px;font-size:12.5px;color:var(--mid);line-height:1.45}
.label i{display:block;margin-top:4px;font-style:normal;font-size:12.5px;font-weight:700}
.side{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:50px}
.side a{display:flex;align-items:center;gap:16px;padding:22px 24px;text-decoration:none;border:1.5px solid var(--k)}
.side a.s{background:var(--k);color:#fff}
.side a b{font-family:"Noto Serif KR",serif;font-size:20px;font-weight:900}
.side a p{margin:3px 0 0;font-size:13.5px;opacity:.75}
.side .seal{flex:none;width:44px;height:44px;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-family:"Noto Serif KR",serif;font-weight:900;font-size:17px;background:#fff}
footer{margin-top:50px;font-size:12.5px;color:var(--mid);line-height:1.7;text-align:center}
.sample{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:var(--k);color:#fff;font-size:12.5px;padding:7px 14px;border-radius:999px;z-index:9;border:1px solid #fff}
@media (max-width:700px){.hero{min-height:440px}.side{grid-template-columns:1fr}.wall{grid-template-columns:repeat(2,1fr);gap:30px 18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="hero">
  <div class="half g"><div class="tag">거믄<small>고미술공부방</small></div><img src="mark_angwe.png" alt="안궤"></div>
  <div class="half h"><div class="tag">힌<small>since 2026. 10. 16.</small></div><img src="mark_eonyang_white.png" alt="언양반닫이"></div>
  <h1>조선의 목가구</h1>
  <p class="lede">동인방에서 배우고, 도록에서 찾아보는 목가구</p>
</section>
<div class="bar"><div class="in">
  <form class="find" action="index.html"><input type="search" name="q" placeholder="물건 이름으로 찾기 — 반닫이, 이층장, 소반" aria-label="물건 이름으로 찾기"></form>
  <nav class="quick" id="quick" aria-label="기물로 바로 찾기"></nav>
</div></div>
<div class="wrap">
  <main id="main"></main>
  <div class="side">
    <a class="s" href="study.html"><span class="seal">工</span><span><b>거믄과 힌의 공부방</b><p>동인방 정대영 선생님 수업 노트 · 가족 암호로 열기</p></span></a>
    <a href="comments.html"><span class="seal">話</span><span><b>기물 이야기 모아보기</b><p>모든 도록에 남긴 이야기를 한곳에서</p></span></a>
  </div>
  <footer><span id="stat"></span><br>도록 사진과 캡션의 저작권은 각 소장처·발행처에 있으며, 무단 복제·재배포를 금합니다.</footer>
</div>
<div class="sample">시안 C · 거믄과 힌 — <a href="design-a.html">A</a> · <a href="design-b.html">B</a> · <a href="index.html">지금 홈</a></div>
<script src="design-data.js"></script>
<script>
(function () {
  var D = DS_DASH, $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  $('quick').innerHTML = DS_QUICK.map(function (q) { return '<a href="index.html?q=' + encodeURIComponent(q[0]) + '" title="' + q[0] + '" aria-label="' + q[0] + '">' + dsIcon(q[1], 1.7) + '</a>'; }).join('');
  var upd = D.reduce(function (a, d) { return d.added > a ? d.added : a; }, '').replaceAll('-', '. ') + '.';
  $('stat').textContent = '도록과 자료 ' + D.length + '권, 기물 ' + dsFmt(dsTotal()) + '건 — 마지막 업데이트 ' + upd;
  $('main').innerHTML = DS_GROUPS.map(function (g) {
    var L = D.filter(function (d) { return (d.group || '') === g[0]; }); if (!L.length) return '';
    return '<section class="room"><h2>' + g[1] + '</h2><p class="sub">' + g[2] + ' — ' + L.length + '권, ' + dsFmt(L.reduce(function (s, d) { return s + d.items; }, 0)) + '건</p><div class="wall">' +
      L.map(function (d) { return '<a class="work" href="' + d.path + '.html"><div class="fr"><img src="covers/' + d.path + '.jpg" alt="' + esc(d.title) + ' 표지" loading="lazy"></div><div class="label"><b>' + esc(d.title) + '</b><span>' + esc(d.desc) + '</span><i>' + dsFmt(d.items) + '건</i></div></a>'; }).join('') +
      '</div></section>';
  }).join('');
})();
</script>
</body>
</html>
