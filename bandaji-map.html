<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#2b2418;font-family:"Noto Sans KR",system-ui,sans-serif;word-break:keep-all}main{max-width:760px;margin:0 auto;padding:16px}
h1{margin:6px 0 14px;font-weight:900;font-size:clamp(28px,7vw,52px);letter-spacing:-.04em;line-height:1.15;display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2.6vw,26px);color:#111}
