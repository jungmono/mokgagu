<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>조선의 목가구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --fg:#1f2433; --muted:#6b7183; --line:#e6e8f0;
  --brand:#4b55d6; --brand2:#7b4fd6; --brand-soft:#eef0ff;
  --shadow:0 1px 2px rgba(20,24,60,.04),0 6px 20px rgba(20,24,60,.06);
  --shadow-h:0 2px 4px rgba(20,24,60,.06),0 14px 34px rgba(20,24,60,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:1180px;margin:0 auto;padding:48px 16px 64px}
header{text-align:center;margin-bottom:32px;position:relative}.brand-mark{position:absolute;left:0;top:-10px;display:block;line-height:0}.brand-mark img{height:clamp(30px,3.6vw,44px);width:auto}
h1 .home-link{display:inline-block;text-decoration:none;color:inherit;cursor:pointer;padding:4px 10px;border-radius:12px;transition:transform .15s}
h1 .home-link:hover{transform:translateY(-2px)}
h1 .home-link:focus-visible{outline:3px solid var(--brand);outline-offset:4px}
h1 .ttl{display:block;color:#111}
h1 .shelf{display:flex;justify-content:center;gap:clamp(8px,1.6vw,16px);margin-top:8px;padding-top:10px;border-top:2px solid #d9d6f3}
h1 .shelf svg{width:clamp(26px,3.2vw,36px);height:clamp(26px,3.2vw,36px)}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:clamp(11px,1.25vw,14px);font-weight:900;color:#111;margin:-24px 0 18px}.eyebrow .ew-blk,.eyebrow .ew-wht{display:inline-block;padding:.15em .45em;border:1.5px solid #111;letter-spacing:-.02em;line-height:1.2;font-size:1em}.eyebrow .ew-blk{background:#fff;color:#111}.eyebrow .ew-wht{background:#111;color:#fff}.eyebrow .ew-blk,.eyebrow .ew-wht{min-width:2.9em;text-align:center;box-sizing:border-box}.eyebrow .ew-rest{margin-left:.4em;font-weight:700;letter-spacing:-.02em;color:#222}
h1{margin:10px 0 0;font-weight:900;font-size:clamp(30px,5.4vw,56px);letter-spacing:-.04em;line-height:1.15}
h1.ttl-row{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2.6vw,30px)}
h1 .ttl-ico{flex:none;display:block;width:auto;height:clamp(34px,5.4vw,62px);margin-bottom:clamp(4px,.7vw,8px);user-select:none}
h1 .ttl-ico.ttl-angwe{height:clamp(30px,4.8vw,55px)}
@media (max-width:420px){h1{font-size:28px}h1 .ttl-ico{height:30px;margin-bottom:5px}h1 .ttl-ico.ttl-angwe{height:27px}}

.hero{display:flex;align-items:center;gap:22px;background:var(--card);border-radius:20px;padding:24px 28px;
  box-shadow:var(--shadow);border:1px solid var(--line);border-left:5px solid var(--brand);margin-bottom:22px}
.hero-ico{flex:none;width:76px;height:76px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px rgba(75,85,214,.35)}
.hero-ico svg{width:46px;height:46px}
.hero-txt{flex:1;min-width:0}
.hero-txt h2{margin:0;font-size:clamp(18px,2.3vw,25px);font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:900;color:#fff;background:#e04848;border-radius:6px;padding:3px 8px;letter-spacing:0}
.hero-txt p{margin:6px 0 0;color:var(--muted);font-size:clamp(14px,1.5vw,16.5px);line-height:1.55}
.hero-btn{flex:none;display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:900;font-size:17px;
  background:linear-gradient(90deg,var(--brand),var(--brand2));padding:17px 30px;border-radius:14px;box-shadow:0 8px 20px rgba(75,85,214,.3);transition:transform .15s}
.hero-btn:hover{transform:translateY(-2px)}

.info{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;margin:0 0 30px;font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--fg);font-weight:500}
.chip b{color:var(--brand)}
.search{flex:1 1 320px;max-width:420px;font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;outline:none}
.search:focus{border-color:var(--brand)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.grid{grid-template-columns:1fr}.hero{flex-wrap:wrap;padding:20px}.hero-btn{width:100%;justify-content:center}.hero-ico{width:60px;height:60px}}
.card{display:flex;align-items:center;gap:20px;background:var(--card);border-radius:18px;padding:22px 24px;text-decoration:none;color:inherit;
  box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--muted)}
.ico{flex:none;width:66px;height:66px;border-radius:16px;display:grid;place-items:center}
.cover{flex:none;width:72px;height:96px;border-radius:6px;overflow:hidden;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.10);border:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover svg{width:34px;height:34px}
.ico svg{width:38px;height:38px}
.card h3{margin:0;font-size:clamp(17px,1.7vw,21px);font-weight:900;letter-spacing:-.035em;line-height:1.3}
.card p{margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.card .meta{margin-top:7px;font-size:12.5px;color:var(--brand);font-weight:700}
.new{font-size:11px;font-weight:900;color:#fff;background:#e04848;border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:3px}
.t-ju{background:#fbeeea;color:#b0412e}.t-meok{background:#f1f0ed;color:#2e2b28}.t-hwang{background:#fbf3e1;color:#9a6c16}
.t-jjok{background:#ecf0f8;color:#2f4f8a}.t-nok{background:#edf4ea;color:#47703f}.t-jaju{background:#f6ecf1;color:#7b3a58}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:-12px 0 30px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;padding:12px 4px 10px;font:inherit;font-size:13px;font-weight:700;color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:transform .15s,border-color .15s}
.quick button:hover{transform:translateY(-2px);border-color:var(--muted)}
.quick button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.quick .qi{width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
/* 기물 단추 아이콘: 힌 — 밝은 바탕에 검은 그림 하나로 */
.qi.m0,.qi.m1,.qi.m2,.qi.m3,.qi.m4,.qi.m5,.qi.m6,.qi.m7{background:#f1efeb;color:#1d1b18}
.quick svg{width:32px;height:32px}
#results{margin-bottom:12px}
.r-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin:0 0 16px}
.r-head h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em}
.r-head h2 b{color:var(--brand)}
.r-chips{display:flex;flex-wrap:wrap;gap:6px}
.r-chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.r-chip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.r-chip small{color:var(--muted);margin-left:4px}.r-chip[aria-pressed="true"] small{color:#cfd2dc}
.r-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.r-item{display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.r-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.r-item .ph{aspect-ratio:1;background:#f6f6f4;display:grid;place-items:center}
.r-item img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.r-item .tx{padding:10px 12px 12px}
.r-item .nm{font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.3}
.r-item .ct{margin-top:3px;font-size:12px;color:var(--brand);font-weight:700}
.r-item .mt{margin-top:2px;font-size:12px;color:var(--muted);line-height:1.4}
.r-more{display:block;margin:18px auto 0;font:inherit;font-weight:700;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 28px;cursor:pointer}
.r-empty{color:var(--muted);padding:30px 0;text-align:center}
#dlg{border:none;border-radius:18px;padding:0;width:min(1100px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#dlg::backdrop{background:rgba(20,20,24,.55)}
.d-body{display:flex;gap:24px;padding:22px;max-height:calc(92vh - 64px);overflow:auto}
.d-img{flex:1 1 60%;display:grid;place-items:center;min-height:300px;background:#fafaf8;border-radius:12px}
.d-img img{max-width:100%;max-height:72vh;object-fit:contain}
.d-info{flex:1 1 40%;min-width:220px}
.d-info .cat{color:var(--brand);font-weight:700;font-size:14px}
.d-info h3{margin:4px 0 12px;font-size:28px;font-weight:900;letter-spacing:-.04em}
.d-info h3 small{font-size:16px;color:var(--muted);font-weight:500;margin-left:8px}
.d-info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.d-info dt{color:var(--muted)}.d-info dd{margin:0}
.d-info a{display:inline-block;margin-top:18px;color:#fff;background:var(--fg);text-decoration:none;font-weight:700;font-size:14px;border-radius:10px;padding:10px 16px}
.d-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.d-foot button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--fg)}
.d-r{display:flex;gap:8px}
@media (max-width:720px){.d-body{flex-direction:column;padding:14px}.d-img{min-height:220px}.r-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
footer{margin-top:44px;text-align:center;font-size:13px;color:var(--muted);line-height:1.7}footer .ft-mark{display:inline-flex;vertical-align:middle;margin-right:8px;font-size:12px;font-weight:900}footer .ft-mark span{display:inline-block;min-width:2.9em;padding:.12em .4em;border:1.5px solid #111;line-height:1.2;text-align:center;box-sizing:border-box}footer .ft-mark .ew-blk{background:#fff;color:#111}footer .ft-mark .ew-wht{background:#111;color:#fff}footer .ft-icons{display:flex;justify-content:center;align-items:flex-end;gap:clamp(28px,5vw,48px);margin:18px auto 8px}footer .ft-icon{display:block;margin:0;width:144px;height:auto}footer .ft-icon.ft-angwe{width:104px;margin-bottom:5px}footer .ft-mark.ft-r{margin-right:0;margin-left:8px}footer .ft-upd{margin-top:6px;display:flex;justify-content:center}

.card.folder .cover.fd[class*="fd-"] svg{width:58px;height:58px}.cover.fd{display:grid;place-items:center;background:#f4f2ee;color:#111;font-size:30px;font-weight:900}.card.folder{border:2px dashed #b9b2a6}.card.folder h3{display:flex;align-items:center;gap:8px}.card.folder.study{border:2px solid #111}.card.folder.study .cover.fd{position:relative;background:#111;color:#fff}.card.folder.study .lk{position:absolute;right:6px;bottom:4px;font-size:18px}.card.folder.study h3 .ew{display:inline-flex;margin-right:2px}.card.folder.study h3 .ew b,.card.folder.study h3 .ew i{font-style:normal;font-size:.8em;font-weight:900;padding:.05em .35em;border:1.5px solid #111;line-height:1.2}.card.folder.study h3 .ew b{background:#111;color:#fff}.card.folder.study h3 .ew i{background:#fff;color:#111}
.card.folder.col .cover.fd{place-items:center}.card.folder.col .col-ico{width:62px;height:auto;filter:invert(1);mix-blend-mode:screen}
.since-top{position:absolute;top:14px;right:16px;z-index:5;display:flex;align-items:center;font-size:clamp(11px,1.25vw,14px);font-weight:900;letter-spacing:-.02em;line-height:1.2}.since-top span{display:inline-block;padding:.15em .45em;border:1.5px solid #111;box-sizing:border-box;text-align:center}.since-top .sc-blk{background:#111;color:#fff;min-width:2.9em}.since-top .sc-wht{background:#fff;color:#111}
.chip.cm-link{text-decoration:none;font-weight:700;color:var(--fg)}.chip.cm-link:hover{border-color:#111}
.eyebrow.eb-top{position:absolute;top:14px;left:16px;right:auto;justify-content:flex-start;margin:0;z-index:5}
body{position:relative}
</style>
</head>
<body>
<div class="since-top"><span class="sc-blk">since</span><span class="sc-wht">2026.10.16.</span></div>
<div class="eyebrow eb-top"><span class="ew-blk">거믄</span><span class="ew-wht">힌</span><span class="ew-rest">고미술공부방</span></div>
<div class="wrap">
  <header>
    <h1 class="ttl-row"><img class="ttl-ico ttl-angwe" src="mark_angwe.png" width="328" height="200" alt="안궤"><a class="home-link" id="home-link" href="index.html" title="처음 화면으로"><span class="ttl">조선의 목가구</span></a><img class="ttl-ico ttl-eonyang" src="mark_eonyang_white.png" width="400" height="243" alt="언양반닫이"></h1>
  </header>


  <div class="info">
    <span class="chip"><span>📚</span><span>도록 <b id="n-books">0</b>권<span id="n-refs"></span> · 기물 <b id="n-items">0</b>건</span></span>
    <input class="search" id="q" type="search" placeholder="물건 이름으로 찾기 — 예: 반닫이, 이층장, 소반" aria-label="물건 이름으로 찾기">
    <a class="chip cm-link" href="comments.html">💬 기물 이야기 모아보기</a>
  </div>

  <nav class="quick" id="quick" aria-label="기물로 바로 찾기"></nav>

  <section id="results" hidden>
    <div class="r-head"><h2 id="r-title"></h2><div class="r-chips" id="r-chips"></div></div>
    <div class="r-grid" id="r-grid"></div>
  </section>

  <main class="grid" id="grid"></main>

  <dialog id="dlg" aria-label="기물 사진">
    <div class="d-body">
      <div class="d-img"><img id="d-img" alt=""></div>
      <div class="d-info" id="d-info"></div>
    </div>
    <div class="d-foot">
      <button id="d-prev">← 이전</button><span id="d-pos"></span>
      <span class="d-r"><button id="d-next">다음 →</button><button id="d-close">닫기</button></span>
    </div>
  </dialog>

  <footer>
    <span class="ft-mark"><span class="ew-blk">거믄</span><span class="ew-wht">힌</span></span>도록 사진과 캡션의 저작권은 각 소장처·발행처에 있으며, 무단 복제·재배포를 금합니다.
    <div class="ft-upd"><span class="chip"><span>🗓</span><span>마지막 업데이트 <b id="updated">—</b></span></span></div>
  </footer>
</div>

<script>
/* ───────── 새 대시보드를 추가할 때는 이 목록 맨 위에 한 덩어리만 더 붙이면 됩니다 ─────────
   path  : 대시보드 파일 이름 (예: lee → lee.html)
   icon  : bandaji(반닫이) · seoan(서안) · soban(소반) · takja(사방탁자) · duiju(뒤주) · yakjang(약장) · jang(이층장) · ham(함) 중 하나
   tone  : ju(주칠) · meok(먹) · hwang(황동) · jjok(쪽빛) · nok(녹색) · jaju(자주) 중 하나
   added : 추가한 날짜 (가장 최근 날짜의 도록이 위 큰 배너에 나옵니다)            */
const DASHBOARDS = [
  { path: 'nmk', title: '국립중앙박물관 소장품', desc: '국립중앙박물관 소장품 검색으로 모은 우리 목가구', items: 432, icon: 'bandaji', tone: 'meok', added: '2026-10-18', group: 'museum' },
  { path: 'heritage', title: '국가유산 목공예', desc: '국가유산포털 유물·생활공예·목공예 — 국보·보물·민속문화유산 등 지정 문화유산', items: 19, icon: 'ham', tone: 'ju', added: '2026-10-18', group: 'museum' },
  { path: 'lee',    title: '이건희 기증 목칠공예',      desc: '국립중앙박물관 기증품 목록집(2023)',     items: 488, icon: 'bandaji', tone: 'jjok', added: '2026-10-15' },
  { path: 'auction', title: '아이옥션 경매 목가구·목기', desc: '2022년 3월~2026년 10월 경매 38회 — 추정가·낙찰가', items: 596, icon: 'bandaji', tone: 'ju', added: '2026-10-17', group: 'auction' },
  { path: 'jikmul', title: '우리나라 전통 무늬 1 직물', desc: '국립문화재연구소 문양 조사보고서(2006)', items: 184, icon: 'ham', tone: 'jaju', added: '2026-10-17', group: 'ref' },
  { path: 'dojagi', title: '우리나라 전통 무늬 2 도자기', desc: '국립문화재연구소 문양 조사보고서(2008)', items: 219, icon: 'ham', tone: 'jjok', added: '2026-10-17', group: 'ref' },
  { path: 'najeon', title: '우리나라 전통 무늬 3 나전·화각', desc: '국립문화재연구소 문양 조사보고서(2014)', items: 110, icon: 'ham', tone: 'ju', added: '2026-10-18', group: 'ref' },
  { path: 'geumsok', title: '우리나라 전통 무늬 4 금속공예', desc: '국립문화재연구소 문양 조사보고서(2011)', items: 213, icon: 'ham', tone: 'meok', added: '2026-10-17', group: 'ref' },
  { path: 'munui', title: '우리나라 전통 무늬 5 목공예', desc: '국립문화재연구소 문양 조사보고서(2012)', items: 164, icon: 'ham', tone: 'nok', added: '2026-10-17' },
  { path: 'yakjang', title: '약장, 건강을 염원하다', desc: '허준박물관·국립민속박물관 공동기획전 도록(2014)', items: 53, icon: 'yakjang', tone: 'jaju', added: '2026-10-17' },

const PROV = /(경기|강원|충청|전라|경상|황해|평안|함경|제주)(남|북)?도/g;
const norm = (s) => s.toLowerCase().replace(/\s+/g, '').replace(PROV, '$1$2');
const ORDER = DASHBOARDS.map((d) => d.path);
const TITLE = Object.fromEntries(DASHBOARDS.map((d) => [d.path, d.title]));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let hits = [], shown = [], only = '', cur = -1, seqFrom = '';

function search(raw) {
  const terms = raw.split(/[·,]/).map(norm).filter(Boolean);   // '장·농' → 장 또는 농
  if (!terms.length) { $('results').hidden = true; grid.hidden = false; return; }
  const all = window.SEARCH || [];
  hits = all.filter((r) => terms.some((q) => r.q.includes(q)));
  hits.sort((a, b) => ORDER.indexOf(a.b) - ORDER.indexOf(b.b) || a.n - b.n);
  only = ''; seqFrom = '';
  $('results').hidden = false; grid.hidden = true;
  drawResults(raw.trim());
}
function drawResults(label) {
  const counts = {};
  hits.forEach((r) => (counts[r.b] = (counts[r.b] || 0) + 1));
  shown = only ? hits.filter((r) => r.b === only) : hits;
  $('r-title').innerHTML = `‘${esc(label ?? $('q').value.trim())}’ 검색 결과 <b>${hits.length.toLocaleString('ko-KR')}</b>건`;
  const chips = [['', '전체', hits.length], ...ORDER.filter((k) => counts[k]).map((k) => [k, TITLE[k], counts[k]])];
  $('r-chips').innerHTML = hits.length && Object.keys(counts).length > 1 ? chips.map(([k, t, n]) =>
    `<button class="r-chip" data-k="${k}" aria-pressed="${only === k}">${esc(t)}<small>${n}</small></button>`).join('') : '';
  $('r-grid').innerHTML = shown.length ? shown.map((r, i) => `
    <button class="r-item" data-i="${i}" data-cid="${esc(r.b + '/' + r.pid)}">
      <div class="ph">${r.t ? `<img loading="lazy" src="thumbs/${r.b}/${r.n}.jpg" alt="">` : ''}</div>
      <div class="tx"><div class="nm">${esc(r.name)}</div><div class="ct">${esc(r.cat)}</div>
      <div class="mt">${esc([r.era, r.size].filter(Boolean).join(' · '))}</div></div>
    </button>`).join('') : '<div class="r-empty">찾는 물건이 없어요. 다른 이름으로 찾아보세요.</div>';
}
$('r-chips').addEventListener('click', (e) => { const c = e.target.closest('.r-chip'); if (!c) return; only = c.dataset.k; drawResults(); });
$('r-grid').addEventListener('click', (e) => { const c = e.target.closest('.r-item'); if (c) openItem(Number(c.dataset.i)); });

function openItem(i) {
  cur = i; const r = shown[i]; if (!r) return; $('dlg').dataset.cid = r.b + '/' + r.pid;
  const img = $('d-img');
  img.src = r.h ? `photos/${r.b}/${encodeURIComponent(r.pid)}.jpg` : (r.t ? `thumbs/${r.b}/${r.n}.jpg` : '');
  img.onerror = () => { if (r.t && !img.src.includes('/thumbs/')) img.src = `thumbs/${r.b}/${r.n}.jpg`; };

    <dl>${row('종류', r.kind)}${row('연대', r.era)}${row('치수', r.size)}${row('재질', r.wood)}${row('소장', r.owner)}${row('도록', r.page ? r.page + '쪽' : '')}</dl>
    <a href="${r.b}.html">도록으로 돌아가기 →</a>${seqFrom === 'comments' ? ' <a href="comments.html" style="background:#fff;color:var(--fg);border:1px solid var(--line)">이야기 모아보기로 →</a>' : ''}`;
  $('d-pos').textContent = (seqFrom === 'comments' ? '이야기 모아보기 ' : '') + `${i + 1} / ${shown.length}`;

/* 최근 본 기물 창에서 누르면 index.html#see=<도록>/<id> 로 와서 그 기물 사진 창을 연다 */
window.RV_OPEN = true;
function openSeen() {
  const m = location.hash.match(/^#see=([^/]+)\/(.+)$/); if (!m) return;
  const b = decodeURIComponent(m[1]), pid = decodeURIComponent(m[2]);
  if (!window.SEARCH) return;   // 검색 색인(search.js)이 아직 안 왔으면 load 때 다시
  const r = window.SEARCH.find((x) => x.b === b && String(x.pid) === pid);
  history.replaceState(null, '', location.pathname + location.search);
  if (!r) return;
  /* 기물 이야기 모아보기에서 왔으면 그 목록 순서대로 좌우로 넘겨 볼 수 있게 */
  let seq = null;
  try { seq = JSON.parse(sessionStorage.getItem('mokgagu_see_list') || 'null'); sessionStorage.removeItem('mokgagu_see_list'); } catch (e) {}
  if (seq && Array.isArray(seq.list) && seq.list.length > 1) {
    const IX = {}; window.SEARCH.forEach((x) => { IX[x.b + '/' + x.pid] = x; });
    const L = seq.list.map((k) => IX[k]).filter(Boolean);
    const at = L.indexOf(r);
    if (at >= 0) { shown = L; seqFrom = seq.from || ''; openItem(at); return; }
  }
  seqFrom = ''; shown = [r]; openItem(0);
}
window.addEventListener('hashchange', openSeen);
window.addEventListener('load', openSeen);
openSeen();
