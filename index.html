<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>조선의 목가구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 처음 화면 — 서탁(書卓)
   흰 종이 바탕에 먹 글씨. 도록은 먹감빛 서탁 천판 위에 세워 좌우로 넘기고,
   가운데 칸에는 박물관자료·경매자료·도움자료를 꽂아 두며, 서랍 둘은 공부방과 소장품. */
:root{
  --paper:#ffffff;--ink:#1a1714;--sub:#6e665d;--rule:#e4dfd8;--fg:#1a1714;--muted:#6e665d;--line:#e4dfd8;--brand:#8a5a2b;
  --w1:#5b3b26;--w2:#432a1b;--w3:#2c1b11;--w4:#1d120b;--brass:#b8925a;--brass2:#7d5e2e;--cream:#efe3cf;
  --shadow-h:0 2px 4px rgba(40,25,10,.06),0 14px 34px rgba(40,25,10,.14);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:22px 20px 70px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.duo{display:inline-flex}.duo span{display:inline-block;min-width:2.9em;text-align:center;padding:.12em .45em;border:1.5px solid var(--ink);line-height:1.2}
.duo .k{background:var(--ink);color:#fff}.duo .w{background:#fff;color:var(--ink)}
.top small{margin-left:8px;color:var(--sub);font-weight:500}
header{text-align:center;padding:44px 0 30px}
h1{margin:0;display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,3vw,34px);font-weight:700;font-size:clamp(34px,6vw,64px);letter-spacing:-.03em;line-height:1.1}
h1 img{height:clamp(34px,5.2vw,60px);width:auto;margin-bottom:6px;user-select:none}h1 img.ag{height:clamp(30px,4.6vw,53px)}
h1 .home-link{text-decoration:none;color:var(--ink);border-radius:10px;transition:transform .15s}
h1 .home-link:hover{transform:translateY(-2px)}h1 .home-link:focus-visible{outline:3px solid var(--brass);outline-offset:4px}
.lede{margin:16px 0 0;font-size:clamp(15px,1.7vw,18px);color:var(--sub)}
.find{display:flex;justify-content:center;margin:30px auto 0;max-width:560px}
.find input{flex:1;min-width:0;font:inherit;font-size:16px;padding:13px 20px;border:1.5px solid var(--ink);border-radius:999px;outline:none;background:#fff;color:var(--ink)}
.find input:focus-visible{box-shadow:0 0 0 3px #e3d6c0}
.quick{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin:20px 0 0}
.quick button{display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:13px;font-weight:500;color:var(--sub);background:none;border:0;padding:6px 4px;border-radius:8px;cursor:pointer}
.quick button svg{width:30px;height:30px;color:var(--ink)}
.quick button:hover{color:var(--ink);background:#f5f2ee}
.quick button[aria-pressed="true"]{color:var(--ink);background:#efe8dd;font-weight:700}
.count{text-align:center;margin:24px 0 0;font-size:14px;color:var(--sub)}.count b{color:var(--ink)}

/* ── 서탁 ── */
.desk{margin:34px 0 0}
.desk-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;margin:0 0 4px;padding:0 4px}
.desk-head h2{margin:0;font-weight:900;font-size:23px;letter-spacing:-.03em}
.desk-head small{font-weight:500;font-size:13.5px;color:var(--sub)}
.desk-head button{margin-left:auto;font:inherit;font-size:13px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:4px 13px;cursor:pointer}
.desk-head button:hover{background:#f5f2ee}
.tak{position:relative;margin:0 auto;filter:drop-shadow(0 18px 18px rgba(40,25,10,.18))}
/* 천판 위 도록 */
.books{display:flex;align-items:flex-end;gap:18px;overflow-x:auto;overflow-y:hidden;padding:30px 30px 0;scrollbar-width:thin;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.bk{flex:none;width:112px;text-decoration:none;display:block;position:relative;scroll-snap-align:start}
.bk .cv{display:block;width:112px;height:150px;object-fit:cover;background:#efebe5;box-shadow:2px 0 0 rgba(0,0,0,.08),5px 4px 9px rgba(40,25,10,.28);transition:transform .2s}
.bk:hover .cv,.bk:focus-visible .cv{transform:translateY(-8px)}
.bk:focus-visible{outline:none}.bk:focus-visible .cv{outline:3px solid var(--brass);outline-offset:3px}
.bk .new{position:absolute;top:6px;right:-4px;font-size:10.5px;font-weight:900;color:#fff;background:#b0412e;border-radius:4px;padding:1px 5px}
.books.swap .bk{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* 천판: 윗면(밝은 띠) + 두꺼운 앞면(이름표) */
.board{position:relative;height:9px;margin:0 -6px;background:linear-gradient(#7a5236,#5d3d28);border-radius:3px 3px 0 0}
.edge{position:relative;margin:0 -6px;background-color:var(--w2);background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px,rgba(0,0,0,.05) 9px 11px,transparent 11px 23px),linear-gradient(180deg,var(--w2),var(--w3));border-radius:0 0 2px 2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tier{background-image:repeating-linear-gradient(92deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px,rgba(0,0,0,.05) 9px 11px,transparent 11px 23px)}
.labels{display:flex;gap:18px;padding:9px 36px 10px;overflow:hidden}
.labels span{flex:none;width:112px;font-size:12.5px;line-height:1.35;color:var(--cream);font-weight:500}
.labels span em{display:block;font-style:normal;color:#c8b090;font-size:11.5px;margin-top:1px}
/* 몸통: 양옆 널다리 + 가운데 칸 */
.body{position:relative;display:flex;padding:0}
.end{flex:none;width:clamp(18px,2.4vw,28px);background-color:var(--w2);background-image:linear-gradient(90deg,var(--w3),var(--w1) 45%,var(--w2));min-height:100%}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.tier{display:flex;background-color:var(--w2)}
.tier.up{gap:clamp(10px,1.6vw,18px);padding:0}
.cub{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;font:inherit;text-align:left;color:var(--cream);background-color:var(--w4);background-image:linear-gradient(180deg,#120b06,#2a1a10 70%,#3a2516);border:0;border-top:10px solid var(--w3);padding:14px clamp(8px,1.4vw,16px) 0;cursor:pointer;min-height:clamp(140px,15vw,176px);box-shadow:inset 0 10px 18px rgba(0,0,0,.45)}
.cub+.cub::before{content:"";position:absolute;left:calc(-1 * clamp(10px,1.6vw,18px));top:-10px;bottom:0;width:clamp(10px,1.6vw,18px);background:linear-gradient(90deg,var(--w3),var(--w1),var(--w3))}
.cub .mini{display:flex;align-items:flex-end;gap:5px;height:clamp(64px,7vw,84px);overflow:hidden}
.cub .mini img{flex:none;height:100%;width:auto;aspect-ratio:3/4;object-fit:cover;box-shadow:3px 2px 6px rgba(0,0,0,.5);transform-origin:bottom left;transition:transform .2s}
.cub .mini img:nth-child(2){transform:rotate(-2deg)}
.cub .ic{display:grid;place-items:center;width:clamp(44px,5vw,58px);height:clamp(44px,5vw,58px);color:#d7c3a2;opacity:.85}.cub .ic svg{width:100%;height:100%}
.cub .nm{display:block;margin:10px 0 0;padding:7px 0 9px;border-top:4px solid var(--w1);font-weight:900;font-size:clamp(14px,1.5vw,17px);letter-spacing:-.03em;line-height:1.25}
.cub .nm small{display:block;font-weight:500;font-size:12px;color:#c8b090;letter-spacing:0;margin-top:2px}
.cub:hover .mini img{transform:translateY(-4px)}
.cub:hover .nm,.cub[aria-pressed="true"] .nm{color:#fff}
.cub[aria-pressed="true"]{box-shadow:inset 0 10px 18px rgba(0,0,0,.45),inset 0 -3px 0 var(--brass)}
.cub:focus-visible{outline:3px solid var(--brass);outline-offset:-3px}
/* 아래 층: 양 끝 작은 빈 칸 + 서랍 둘 */
.tier.low{gap:clamp(8px,1.2vw,14px);padding:clamp(8px,1.2vw,14px) 0;border-top:3px solid var(--w3);background-color:var(--w2)}
.nook{flex:0 0 clamp(26px,9%,110px);background-color:var(--w4);background-image:linear-gradient(180deg,#120b06,#2b1a10);box-shadow:inset 0 8px 14px rgba(0,0,0,.5)}
.drw{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--cream);background-color:#4a2f1d;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 3px,transparent 3px 14px,rgba(0,0,0,.06) 14px 16px,transparent 16px 31px),linear-gradient(180deg,#5e3d27,#45291a);border-radius:2px;padding:clamp(12px,1.6vw,18px) 10px clamp(12px,1.6vw,16px);min-height:clamp(96px,10vw,118px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.07),0 1px 0 rgba(0,0,0,.3);transition:transform .2s,box-shadow .2s}
.drw:hover,.drw:focus-visible{transform:translateY(3px) scale(1.025);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.07),0 10px 18px rgba(0,0,0,.45);outline:none}
.drw:focus-visible{box-shadow:0 0 0 3px var(--brass)}
/* 반달 들쇠: 놋쇠 바탕판 + 고리 */
.pull{position:relative;width:38px;height:30px;flex:none}
.pull::before{content:"";position:absolute;left:5px;top:0;width:28px;height:18px;border-radius:3px 3px 14px 14px;background:linear-gradient(160deg,#e3c88f,var(--brass) 45%,var(--brass2));box-shadow:0 1px 2px rgba(0,0,0,.5)}
.pull::after{content:"";position:absolute;left:7px;top:9px;width:24px;height:16px;border:3px solid #c9a868;border-top:0;border-radius:0 0 14px 14px;box-shadow:0 2px 3px rgba(0,0,0,.45)}
.drw .dn{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 6px;font-weight:900;font-size:clamp(14px,1.6vw,18px);letter-spacing:-.03em;text-align:center;line-height:1.25}
.drw .dn .duo span{border-color:var(--cream);font-size:.78em;padding:.05em .35em}
.drw .dn .duo .k{background:var(--cream);color:#3a2516}.drw .dn .duo .w{background:transparent;color:var(--cream)}
.drw .ds{font-size:12px;color:#d2bd9c;text-align:center;line-height:1.4}
.legs{display:flex;justify-content:space-between;height:clamp(26px,3.6vw,44px)}
.legs i{width:clamp(18px,2.4vw,28px);background:linear-gradient(90deg,var(--w3),var(--w1) 45%,var(--w2));border-radius:0 0 2px 2px}
.floor{height:10px;margin:0 -2%;background:radial-gradient(ellipse at center,rgba(40,25,10,.22),transparent 70%)}
.talk{display:block;width:max-content;margin:30px auto 0;font-weight:700;font-size:15px;text-decoration:none;border-bottom:1.5px solid var(--ink);padding-bottom:2px}
@media (max-width:640px){
  .books{gap:12px;padding:24px 18px 0}.bk,.bk .cv,.labels span{width:88px}.bk .cv{height:118px}.labels{gap:12px;padding:8px 24px 9px}.labels span{font-size:11.5px}
  .cub{padding-top:10px}.cub .mini img:nth-child(n+3){display:none}.cub .nm{font-size:13px}.cub .nm small{font-size:11px}
  .nook{flex-basis:14px}.drw .ds{display:none}.drw{min-height:92px}
}
/* 검색 결과 */
#results{margin:34px 0 12px}
.r-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin:0 0 16px}
.r-head h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em}.r-head h2 b{color:var(--brand)}
.r-chips{display:flex;flex-wrap:wrap;gap:6px}
.r-chip{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.r-chip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
.r-chip small{color:var(--muted);margin-left:4px}.r-chip[aria-pressed="true"] small{color:#d8d0c4}
.r-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.r-item{display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.r-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-h)}
.r-item .ph{aspect-ratio:1;background:#f6f6f4;display:grid;place-items:center}
.r-item img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.r-item .tx{padding:10px 12px 12px}
.r-item .nm{font-weight:700;font-size:15px;letter-spacing:-.02em;line-height:1.3}
.r-item .ct{margin-top:3px;font-size:12px;color:var(--brand);font-weight:700}
.r-item .mt{margin-top:2px;font-size:12px;color:var(--muted);line-height:1.4}
.r-more{display:block;margin:18px auto 0;font:inherit;font-weight:700;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 28px;cursor:pointer}
.r-empty{color:var(--muted);padding:30px 0;text-align:center}
/* 사진 창 */
#dlg{border:none;border-radius:18px;padding:0;width:min(1100px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.3);color:var(--fg)}
#dlg::backdrop{background:rgba(20,20,24,.55)}
.d-body{display:flex;gap:24px;padding:22px;max-height:calc(92vh - 64px);overflow:auto}
.d-img{flex:1 1 60%;display:grid;place-items:center;min-height:300px;background:#fafaf8;border-radius:12px}
.d-img img{max-width:100%;max-height:72vh;object-fit:contain}
.d-info{flex:1 1 40%;min-width:220px}
.d-info .cat{color:var(--brand);font-weight:700;font-size:14px}
.d-info h3{margin:4px 0 12px;font-size:28px;font-weight:900;letter-spacing:-.04em}
.d-info h3 small{font-size:16px;color:var(--muted);font-weight:500;margin-left:8px}
.d-info dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:15px}
.d-info dt{color:var(--muted)}.d-info dd{margin:0}
.d-info a{display:inline-block;margin-top:18px;color:#fff;background:var(--fg);text-decoration:none;font-weight:700;font-size:14px;border-radius:10px;padding:10px 16px}
.d-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.d-foot button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--fg)}
.d-r{display:flex;gap:8px}
@media (max-width:720px){.d-body{flex-direction:column;padding:14px}.d-img{min-height:220px}.r-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--rule);text-align:center;font-size:12.5px;color:var(--sub);line-height:1.7}
footer .duo{vertical-align:middle;margin-right:8px;font-size:11.5px;font-weight:900}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><span class="duo"><span class="w">거믄</span><span class="k">힌</span></span><small>고미술공부방</small></span><span class="duo"><span class="k">since</span><span class="w">2026.10.16.</span></span></div>
  <header>
    <h1><img class="ag" src="mark_angwe.png" width="328" height="200" alt="안궤"><a class="home-link" id="home-link" href="index.html" title="처음 화면으로">조선의 목가구</a><img src="mark_eonyang_white.png" width="400" height="243" alt="언양반닫이"></h1>
    <p class="lede">답십리 동인방에서 배우며 모은 목가구 도록과 자료</p>
    <form class="find" onsubmit="return false"><input id="q" type="search" placeholder="물건 이름으로 찾기 — 반닫이, 이층장, 소반" aria-label="물건 이름으로 찾기" autocomplete="off"></form>
    <nav class="quick" id="quick" aria-label="기물로 바로 찾기"></nav>
    <p class="count" id="count"></p>
  </header>

  <section id="results" hidden>
    <div class="r-head"><h2 id="r-title"></h2><div class="r-chips" id="r-chips"></div></div>
    <div class="r-grid" id="r-grid"></div>
  </section>

  <main class="desk" id="grid">
    <div class="desk-head"><h2 id="shelf-name">도록</h2><small id="shelf-sub"></small><button type="button" id="shelf-back" hidden>← 도록으로</button></div>
    <div class="tak">
      <div class="books" id="books"></div>
      <div class="board"></div>
      <div class="edge"><div class="labels" id="labels"></div></div>
      <div class="body">
        <div class="end"></div>
        <div class="mid">
          <div class="tier up" id="cubbies"></div>
          <div class="tier low">
            <span class="nook" aria-hidden="true"></span>
            <a class="drw" href="study.html"><span class="pull" aria-hidden="true"></span><span class="dn"><span class="duo"><span class="w">거믄</span><span class="k">힌</span></span>의 공부방 🔒</span><span class="ds">동인방 정대영 선생님 수업 노트</span></a>
            <a class="drw" href="collection.html"><span class="pull" aria-hidden="true"></span><span class="dn"><span class="duo"><span class="w">거믄</span><span class="k">힌</span></span>의 소장품 🔒</span><span class="ds">우리 집에 들인 목가구·기물</span></a>
            <span class="nook" aria-hidden="true"></span>
          </div>
        </div>
        <div class="end"></div>
      </div>
      <div class="legs" aria-hidden="true"><i></i><i></i></div>
    </div>
    <div class="floor" aria-hidden="true"></div>
    <a class="talk" href="comments.html">💬 기물 이야기 모아보기</a>
  </main>

  <dialog id="dlg" aria-label="기물 사진">
    <div class="d-body">
      <div class="d-img"><img id="d-img" alt=""></div>
      <div class="d-info" id="d-info"></div>
    </div>
    <div class="d-foot">
      <button id="d-prev">← 이전</button><span id="d-pos"></span>
      <span class="d-r"><button id="d-next">다음 →</button><button id="d-close">닫기</button></span>
    </div>
  </dialog>

  <footer><span class="duo"><span class="w">거믄</span><span class="k">힌</span></span>도록 사진과 캡션의 저작권은 각 소장처·발행처에 있으며, 무단 복제·재배포를 금합니다.<br>마지막 업데이트 <b id="updated">—</b></footer>
</div>

<script>
/* ───────── 새 대시보드를 추가할 때는 이 목록 맨 위에 한 덩어리만 더 붙이면 됩니다 ─────────
   path  : 대시보드 파일 이름 (예: lee → lee.html)
   icon  : bandaji(반닫이) · seoan(서안) · soban(소반) · takja(사방탁자) · duiju(뒤주) · yakjang(약장) · jang(이층장) · ham(함) 중 하나
   tone  : ju(주칠) · meok(먹) · hwang(황동) · jjok(쪽빛) · nok(녹색) · jaju(자주) 중 하나
   added : 추가한 날짜 (가장 최근 날짜의 도록이 위 큰 배너에 나옵니다)            */
const DASHBOARDS = [

/* ───────── 물건 이름 검색 ───────── */
const PROV = /(경기|강원|충청|전라|경상|황해|평안|함경|제주)(남|북)?도/g;
const norm = (s) => s.toLowerCase().replace(/\s+/g, '').replace(PROV, '$1$2');
const ORDER = DASHBOARDS.map((d) => d.path);
const TITLE = Object.fromEntries(DASHBOARDS.map((d) => [d.path, d.title]));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let hits = [], shown = [], only = '', cur = -1, seqFrom = '';
render();

function search(raw) {
  const terms = raw.split(/[·,]/).map(norm).filter(Boolean);   // '장·농' → 장 또는 농
  if (!terms.length) { $('results').hidden = true; grid.hidden = false; return; }
  const all = window.SEARCH || [];
  hits = all.filter((r) => terms.some((q) => r.q.includes(q)));
  hits.sort((a, b) => ORDER.indexOf(a.b) - ORDER.indexOf(b.b) || a.n - b.n);
  only = ''; seqFrom = '';
  $('results').hidden = false; grid.hidden = true;
  drawResults(raw.trim());
}
function drawResults(label) {
  const counts = {};
  hits.forEach((r) => (counts[r.b] = (counts[r.b] || 0) + 1));
  shown = only ? hits.filter((r) => r.b === only) : hits;
  $('r-title').innerHTML = `‘${esc(label ?? $('q').value.trim())}’ 검색 결과 <b>${hits.length.toLocaleString('ko-KR')}</b>건`;
  const chips = [['', '전체', hits.length], ...ORDER.filter((k) => counts[k]).map((k) => [k, TITLE[k], counts[k]])];
  $('r-chips').innerHTML = hits.length && Object.keys(counts).length > 1 ? chips.map(([k, t, n]) =>
    `<button class="r-chip" data-k="${k}" aria-pressed="${only === k}">${esc(t)}<small>${n}</small></button>`).join('') : '';
  $('r-grid').innerHTML = shown.length ? shown.map((r, i) => `
    <button class="r-item" data-i="${i}" data-cid="${esc(r.b + '/' + r.pid)}">
      <div class="ph">${r.t ? `<img loading="lazy" src="thumbs/${r.b}/${r.n}.jpg" alt="">` : ''}</div>
      <div class="tx"><div class="nm">${esc(r.name)}</div><div class="ct">${esc(r.cat)}</div>
      <div class="mt">${esc([r.era, r.size].filter(Boolean).join(' · '))}</div></div>
    </button>`).join('') : '<div class="r-empty">찾는 물건이 없어요. 다른 이름으로 찾아보세요.</div>';
}
$('r-chips').addEventListener('click', (e) => { const c = e.target.closest('.r-chip'); if (!c) return; only = c.dataset.k; drawResults(); });
$('r-grid').addEventListener('click', (e) => { const c = e.target.closest('.r-item'); if (c) openItem(Number(c.dataset.i)); });

function openItem(i) {
  cur = i; const r = shown[i]; if (!r) return; $('dlg').dataset.cid = r.b + '/' + r.pid;
  const img = $('d-img');
  img.src = r.h ? `photos/${r.b}/${encodeURIComponent(r.pid)}.jpg` : (r.t ? `thumbs/${r.b}/${r.n}.jpg` : '');
  img.onerror = () => { if (r.t && !img.src.includes('/thumbs/')) img.src = `thumbs/${r.b}/${r.n}.jpg`; };
  img.alt = r.name;
  const row = (k, v) => (v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '');
  $('d-info').innerHTML = `<div class="cat">${esc(TITLE[r.b])}</div>
    <h3>${esc(r.name)}${r.hanja ? `<small>${esc(r.hanja)}</small>` : ''}</h3>
    <dl>${row('종류', r.kind)}${row('연대', r.era)}${row('치수', r.size)}${row('재질', r.wood)}${row('소장', r.owner)}${row('도록', r.page ? r.page + '쪽' : '')}</dl>
    <a href="${r.b}.html">도록으로 돌아가기 →</a>${seqFrom === 'comments' ? ' <a href="comments.html" style="background:#fff;color:var(--fg);border:1px solid var(--line)">이야기 모아보기로 →</a>' : ''}`;
  $('d-pos').textContent = (seqFrom === 'comments' ? '이야기 모아보기 ' : '') + `${i + 1} / ${shown.length}`;
  $('d-prev').disabled = i === 0; $('d-next').disabled = i === shown.length - 1;
  if (!$('dlg').open) $('dlg').showModal();
}
$('d-prev').addEventListener('click', () => openItem(cur - 1));
$('d-next').addEventListener('click', () => openItem(cur + 1));

/* 최근 본 기물 창에서 누르면 index.html#see=<도록>/<id> 로 와서 그 기물 사진 창을 연다 */
window.RV_OPEN = true;
function openSeen() {
  const m = location.hash.match(/^#see=([^/]+)\/(.+)$/); if (!m) return;
  const b = decodeURIComponent(m[1]), pid = decodeURIComponent(m[2]);
  if (!window.SEARCH) return;   // 검색 색인(search.js)이 아직 안 왔으면 load 때 다시
  const r = window.SEARCH.find((x) => x.b === b && String(x.pid) === pid);
  history.replaceState(null, '', location.pathname + location.search);
  if (!r) return;
  /* 기물 이야기 모아보기에서 왔으면 그 목록 순서대로 좌우로 넘겨 볼 수 있게 */
  let seq = null;
  try { seq = JSON.parse(sessionStorage.getItem('mokgagu_see_list') || 'null'); sessionStorage.removeItem('mokgagu_see_list'); } catch (e) {}
  if (seq && Array.isArray(seq.list) && seq.list.length > 1) {
    const IX = {}; window.SEARCH.forEach((x) => { IX[x.b + '/' + x.pid] = x; });
    const L = seq.list.map((k) => IX[k]).filter(Boolean);
    const at = L.indexOf(r);
    if (at >= 0) { shown = L; seqFrom = seq.from || ''; openItem(at); return; }
  }
  seqFrom = ''; shown = [r]; openItem(0);
}
window.addEventListener('hashchange', openSeen);

openSeen();
const QUICK = [['반닫이', 'bandaji', 'jjok'], ['서안', 'seoan', 'meok'], ['소반', 'soban', 'hwang'], ['사방탁자', 'takja', 'ju'],
  ['뒤주', 'duiju', 'nok'], ['약장', 'yakjang', 'jaju'], ['장·농', 'jang', 'meok'], ['함', 'ham', 'ju']];
$('quick').innerHTML = QUICK.map(([w, ic], k) => `<button type="button" data-w="${w}" aria-pressed="false">${svg(ic).replace('stroke-width="1.7"','stroke-width="1.6"')}${w}</button>`).join('');
const syncQuick = () => document.querySelectorAll('#quick button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.w === $('q').value.trim())));
$('quick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const w = $('q').value.trim() === b.dataset.w ? '' : b.dataset.w;
  $('q').value = w; search(w); syncQuick();
  if (w) $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('home-link').addEventListener('click', (e) => {
  e.preventDefault();
  $('q').value = ''; search(''); syncQuick();
  if ($('dlg').open) $('dlg').close();
  history.replaceState(null, '', location.pathname); render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
let tmr; $('q').addEventListener('input', (e) => { clearTimeout(tmr); tmr = setTimeout(() => { search(e.target.value); syncQuick(); }, 150); });

<script id="dlg-swipe">(function(){var d=document.getElementById('dlg');if(!d)return;
var img=document.getElementById('dlg-img')||document.getElementById('d-img');if(!img)return;
var nx=function(){return document.getElementById('dlg-next')||document.getElementById('d-next');},pv=function(){return document.getElementById('dlg-prev')||document.getElementById('d-prev');};
img.setAttribute('draggable','false');img.addEventListener('dragstart',function(e){e.preventDefault();});
if(img.parentElement)img.parentElement.style.overflow='hidden';
var sc=1,tx=0,ty=0,sw=0,busy=false;
function apply(anim){img.style.transition=anim?'transform .22s ease, opacity .22s ease':'none';
  img.style.transform=(sc===1&&!sw&&!tx&&!ty)?'':'translate('+(tx+sw)+'px,'+ty+'px) scale('+sc+')';
  img.style.opacity=sw?String(Math.max(.35,1-Math.abs(sw)/600)):'';img.style.touchAction=sc>1?'none':'';img.style.cursor=sc>1?'grab':'';}
function clampPan(){var w=img.clientWidth,h=img.clientHeight,mx=w*(sc-1)/2,my=h*(sc-1)/2;tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty));}
function reset(){sc=1;tx=0;ty=0;sw=0;apply(false);}
function zoomAt(ns,cx,cy){var r=img.getBoundingClientRect(),ox=cx-(r.left+r.width/2),oy=cy-(r.top+r.height/2);ns=Math.max(1,Math.min(5,ns));var k=ns/sc;tx=(tx-ox)*k+ox;ty=(ty-oy)*k+oy;sc=ns;if(sc===1){tx=0;ty=0;}clampPan();}
new MutationObserver(function(){if(!busy)reset();}).observe(img,{attributes:true,attributeFilter:['src']});
function go(dir){var b=dir>0?nx():pv();if(!b||b.disabled){sw=0;apply(true);return;}
  if(busy)return;busy=true;var w=(d.clientWidth||400)*0.6;sw=-dir*w;apply(true);
  setTimeout(function(){sc=1;tx=0;ty=0;b.click();sw=dir*w;apply(false);requestAnimationFrame(function(){requestAnimationFrame(function(){sw=0;apply(true);busy=false;});});},200);}
var x0=null,y0=0,t0=0,dx=0,mode=0,px=0,py=0,pd0=0,ps0=1,lastTap=0,tEnd=0,dxEnd=0;
function onImg(t){return t===img||(img.parentElement&&img.parentElement.contains(t));}
function start(x,y,t){if(t&&t.closest&&t.closest('button,a,input,select,textarea'))return;x0=x;y0=y;px=x;py=y;t0=Date.now();dx=0;mode=sc>1&&onImg(t)?4:0;}
function move(x,y,e){if(x0===null)return;
  if(mode===4){tx+=x-px;ty+=y-py;px=x;py=y;clampPan();apply(false);if(e&&e.cancelable)e.preventDefault();return;}
  var ddx=x-x0,ddy=y-y0;
  if(!mode){if(Math.abs(ddx)>8&&Math.abs(ddx)>Math.abs(ddy)*1.2)mode=1;else if(Math.abs(ddy)>10)mode=2;}
  if(mode===1){dx=ddx;sw=dx;apply(false);if(e&&e.cancelable)e.preventDefault();}}
function end(){if(x0===null)return;tEnd=Date.now();dxEnd=(mode===1||mode===4)?99:0;var fast=Date.now()-t0<300&&Math.abs(dx)>30;var m=mode;x0=null;mode=0;
  if(m===1&&(Math.abs(dx)>70||fast)){go(dx<0?1:-1);}else if(m===1){sw=0;apply(true);}}
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
d.addEventListener('touchstart',function(e){
  if(e.touches.length===2&&onImg(e.target)){x0=null;mode=3;pd0=dist(e.touches[0],e.touches[1]);ps0=sc;return;}
  if(e.touches.length!==1){x0=null;return;}var p=e.touches[0];start(p.clientX,p.clientY,e.target);},{passive:true});
d.addEventListener('touchmove',function(e){
  if(mode===3&&e.touches.length===2){var a=e.touches[0],b=e.touches[1];zoomAt(ps0*dist(a,b)/pd0,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);apply(false);if(e.cancelable)e.preventDefault();return;}
  var p=e.touches[0];if(p)move(p.clientX,p.clientY,e);},{passive:false});
d.addEventListener('touchend',function(e){
  if(mode===3){if(e.touches.length===0){mode=0;if(sc<1.05){reset();apply(true);}}tEnd=Date.now();dxEnd=99;return;}
  var tap=x0!==null&&mode===0&&Date.now()-t0<250;var tg=e.target;end();
  if(tap&&onImg(tg)){var now=Date.now();if(now-lastTap<320){var c=e.changedTouches[0];if(sc>1){sc=1;tx=0;ty=0;}else zoomAt(2.5,c.clientX,c.clientY);apply(true);lastTap=0;if(e.cancelable)e.preventDefault();}else lastTap=now;}});
d.addEventListener('touchcancel',function(){x0=null;mode=0;sw=0;apply(true);});
var mouse=false;
d.addEventListener('mousedown',function(e){if(e.button!==0)return;mouse=true;start(e.clientX,e.clientY,e.target);if(mode===4)img.style.cursor='grabbing';});
window.addEventListener('mousemove',function(e){if(mouse)move(e.clientX,e.clientY,e);});
window.addEventListener('mouseup',function(){if(mouse){mouse=false;end();apply(false);}});
img.addEventListener('wheel',function(e){e.preventDefault();zoomAt(sc*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY);apply(false);},{passive:false});
img.addEventListener('dblclick',function(e){if(sc>1){sc=1;tx=0;ty=0;}else zoomAt(2.5,e.clientX,e.clientY);apply(true);});
d.addEventListener('click',function(e){if(e.isTrusted&&Date.now()-tEnd<400&&dxEnd){e.stopPropagation();e.preventDefault();}},true);
d.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){e.preventDefault();go(1);}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}else if(e.key==='+'||e.key==='='){zoomAt(sc*1.3,innerWidth/2,innerHeight/2);apply(true);}else if(e.key==='-'){zoomAt(sc/1.3,innerWidth/2,innerHeight/2);apply(true);}});
d.addEventListener('close',reset);
})();</script>
