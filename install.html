<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조선의 목가구 앱 설치</title>
<meta name="description" content="조선의 목가구 — 홈 화면에 앱처럼 설치하기">
<meta property="og:type" content="website">
<meta property="og:title" content="조선의 목가구 — 앱 설치">
<meta property="og:description" content="누르면 홈 화면에 안궤 아이콘이 생겨요. 우리 목가구 도록을 앱처럼 열어 보세요.">
<meta property="og:image" content="https://jungmono.github.io/mokgagu/og.jpg?v=3">
<meta property="og:url" content="https://jungmono.github.io/mokgagu/install.html">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
main{max-width:440px;margin:0 auto;padding:40px 20px 60px;text-align:center}
.ic{width:120px;height:120px;border-radius:26px;border:1px solid #ddd6ca;margin:0 auto 18px;display:block}
h1{margin:0 0 6px;font-size:26px;font-weight:900;letter-spacing:-.03em}
p{margin:0 0 18px;color:#6b645a}
button.go{display:block;width:100%;font:inherit;font-size:18px;font-weight:900;border:0;border-radius:14px;background:#111;color:#fff;padding:16px;cursor:pointer;min-height:56px}
.box{margin-top:18px;border:1.5px solid #111;border-radius:14px;padding:14px 16px;text-align:left;font-size:15px}
.box ol{margin:6px 0 0;padding-left:20px}
.sm{margin-top:22px;font-size:13px;color:#8a837a}
a{color:#111}
.hide{display:none}
</style>
<script src="common.js?v=15" defer></script></head>
<body>
<main>
  <img class="ic" src="icons/icon-512.png" alt="안궤 아이콘">
  <h1>조선의 목가구</h1>
  <p>홈 화면에 앱처럼 설치해서<br>우리 목가구 도록을 바로 열어 보세요.</p>

  <button type="button" class="go" id="go">📲 홈 화면에 설치하기</button>
  <div class="box hide" id="box"></div>
  <div class="sm"><a href="index.html">설치 없이 바로 보기</a></div>
</main>
<script>
(function () {
  var ua = navigator.userAgent, KAKAO = /KAKAOTALK/i.test(ua), IOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  var go = document.getElementById('go'), box = document.getElementById('box'), deferred = null;
  function say(h) { box.innerHTML = h; box.classList.remove('hide'); }
  var HERE = 'https://jungmono.github.io/mokgagu/install.html';

  if (standalone) { go.textContent = '이미 설치되어 있어요 — 열기'; go.onclick = function () { location.href = 'index.html'; }; return; }

  /* 카톡·밴드 등 앱 안 브라우저는 설치가 안 되므로 기본 브라우저로 자동으로 다시 연다 */
  if (KAKAO) { setTimeout(function () { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(HERE); }, 200); }
  var INAPP = KAKAO || /NAVER\(inapp|; wv\)|Instagram|FBAN|FBAV|Line\//i.test(ua);

  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', function () { say('<b>설치됐어요!</b> 홈 화면의 「조선의 목가구」 안궤 아이콘을 눌러 보세요.'); go.classList.add('hide'); });

  go.onclick = function () {
    if (deferred) { var p = deferred; deferred = null; p.prompt(); return; }
    if (INAPP) {
      say('지금 보고 계신 화면(카카오톡 등)에서는 설치가 안 돼요.<br><b>오른쪽 위 ⋮ (또는 ⋯) → 「다른 브라우저로 열기」</b>를 눌러 크롬이나 Safari로 열어 주세요.');
      if (KAKAO) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(HERE);
      return;
    }
    if (IOS) { say('<b>아이폰·아이패드 (Safari)</b><ol><li>화면 아래(또는 위)의 공유 단추 ⬆ 누르기</li><li>「홈 화면에 추가」 고르기</li><li>오른쪽 위 「추가」 누르기</li></ol><div class="sm" style="margin-top:8px">크롬이 아니라 Safari에서 열어야 해요.</div>'); return; }
    say('<b>안드로이드 (크롬·삼성 인터넷)</b><ol><li>오른쪽 위 ⋮ 메뉴 누르기</li><li>「홈 화면에 추가」 또는 「앱 설치」 고르기</li><li>「설치」 누르기</li></ol>');
  };
  if (IOS && !INAPP) go.textContent = '📲 설치 방법 보기';
})();
</script>
</body>
</html>
