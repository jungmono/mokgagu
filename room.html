<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRE=[{n:'24평 거실',w:340,d:460,t:'living'},{n:'33평 거실',w:410,d:560,t:'living'},{n:'44평 거실',w:480,d:650,t:'living'},{n:'안방(보통)',w:340,d:380,t:'bed'},{n:'작은방(보통)',w:280,d:300,t:'small'}];
const HOME={sofa:{n:'3인용 소파',kind:'sofa',w:210,d:90,h:85},tv:{n:'TV·거실장',kind:'tv',w:180,d:45,h:50},bed:{n:'퀸 침대',kind:'bed',w:150,d:200,h:45},bed1:{n:'슈퍼싱글 침대',kind:'bed',w:110,d:200,h:45}};
const KEY='mokgagu_room_v1';
let R={w:410,d:560}, rt='living', bg=null, items=[], sel=-1, uid=0, K=1, act=null, calPts=[], wall='', shared=false;
const plan=$('g5plan');
plan.innerHTML='<svg id="g5svg" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans KR" style="width:100%;height:auto;max-height:70vh;display:block;touch-action:none"><g id="g5bg"></g><g id="g5lay"></g></svg>';
const sv=$('g5svg'), rad=a=>a*Math.PI/180;
function world(){ return bg&&bg.cmpp? {w:bg.img.width*bg.cmpp,d:bg.img.height*bg.cmpp}:R; }
/* 돌린 기물이 차지하는 바닥(겉 상자) */
function fp(o){const c=Math.abs(Math.cos(rad(o.r))),s=Math.abs(Math.sin(rad(o.r)));return {w:o.w*c+o.d*s,d:o.w*s+o.d*c};}
function clamp(o){const W=world(),f=fp(o);o.cx=Math.max(f.w/2,Math.min(W.w-f.w/2,o.cx));o.cy=Math.max(f.d/2,Math.min(W.d-f.d/2,o.cy));}
function rot(x,y,r){const c=Math.cos(rad(r)),s=Math.sin(rad(r));return [x*c-y*s,x*s+y*c];}
function corners(o){return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>{const v=rot(a*o.w/2,b*o.d/2,o.r);return [o.cx+v[0],o.cy+v[1]];});}
function overlap(a,b){const A=corners(a),B=corners(b);for(const P of [A,B])for(let i=0;i<4;i++){const p=P[i],q=P[(i+1)%4],nx=q[1]-p[1],ny=p[0]-q[0];
  const pa=A.map(v=>v[0]*nx+v[1]*ny),pb=B.map(v=>v[0]*nx+v[1]*ny);if(Math.max(...pa)<=Math.min(...pb)+.01||Math.max(...pb)<=Math.min(...pa)+.01)return false;}return true;}
/* 기본 가구: 거실은 소파·TV, 방은 퀸 침대. 손대지 않은 것은 방 크기를 바꾸면 벽에 다시 붙는다 */
function homeSet(){items=items.filter(o=>!o.home);const add=(k,r)=>items.unshift(Object.assign({id:++uid,home:1,hk:k,r,cx:0,cy:0},HOME[k]));
  if(rt==='living'){add('tv',90);add('sofa',270);} else add(rt==='small'?'bed1':'bed',0); place();}
function place(){const W=world();items.forEach(o=>{if(!o.home||o.moved)return;const f=fp(o);
  if(o.kind==='sofa'){o.cx=f.w/2;o.cy=W.d/2;} else if(o.kind==='tv'){o.cx=W.w-f.w/2;o.cy=W.d/2;} else {o.cx=W.w/2;o.cy=f.d/2;} clamp(o);});}

/* ───── 이 기기에 배치 남기기 ───── */
function pack(){return {r:[R.w,R.d,rt],i:items.map(o=>[o.n,o.w,o.d,o.h||0,o.r,Math.round(o.cx),Math.round(o.cy),o.home?o.hk:'',o.moved?1:0])};}
function unpack(s){if(!s||!Array.isArray(s.r)||!Array.isArray(s.i))return false;
  const w=+s.r[0],d=+s.r[1];if(!(w>=200&&w<=800&&d>=200&&d<=800))return false;
  R={w,d};rt=['living','bed','small'].includes(s.r[2])?s.r[2]:'living';items=[];
  s.i.slice(0,40).forEach(a=>{const hk=HOME[a[7]]?a[7]:'',o={id:++uid,n:String(a[0]||'기물').slice(0,30),w:+a[1],d:+a[2],h:+a[3]||0,r:((+a[4]||0)%360+360)%360,cx:+a[5]||0,cy:+a[6]||0};
    if(!(o.w>0&&o.d>0&&o.w<=800&&o.d<=800))return; if(hk){o.home=1;o.hk=hk;o.kind=HOME[hk].kind;o.moved=a[8]?1:0;} items.push(o);});
  items.forEach(clamp);return true;}
function keep(){if(bg||shared)return;try{localStorage.setItem(KEY,JSON.stringify(pack()));}catch(e){}}
function roomOn(){document.querySelectorAll('#g5room button').forEach((x,i)=>x.classList.toggle('on',!bg&&PRE[i].w===R.w&&PRE[i].d===R.d&&PRE[i].t===rt));}

/* 한 기물의 모양(가운데 기준, 앞=아래쪽). 사람이 넣은 기물은 앞면을 굵은 선으로 */
function shape(o){const w=o.w,d=o.d,x0=-w/2,y0=-d/2,sw=1.6*K;let s='';
  const box=(x,y,a,b,fill,st)=>`<rect x="${x}" y="${y}" width="${a}" height="${b}" fill="${fill}" stroke="${st||'#111'}" stroke-width="${sw}"/>`;
  if(o.kind==='sofa'){const bk=Math.min(20,d*.25),am=Math.min(18,w*.1);s+=box(x0,y0,w,d,'#e9e6df','#777');s+=box(x0,y0,w,bk,'#d9d5cc','#777');s+=box(x0,y0+bk,am,d-bk,'#d9d5cc','#777');s+=box(w/2-am,y0+bk,am,d-bk,'#d9d5cc','#777');
    const n=Math.max(1,Math.round((w-2*am)/65));for(let i=1;i<n;i++){const x=x0+am+(w-2*am)*i/n;s+=`<line x1="${x}" y1="${y0+bk}" x2="${x}" y2="${d/2}" stroke="#999" stroke-width="${sw}"/>`;}}
  else if(o.kind==='tv'){s+=box(x0,y0,w,d,'#e9e6df','#777');s+=box(x0+w*.1,y0+4,w*.8,Math.min(7,d*.2),'#444','#444');}
  else if(o.kind==='bed'&&w<130){s+=box(x0,y0,w,d,'#f3f1ec','#777');s+=box(x0+8,y0+8,w-16,30,'#fff','#999');s+=`<line x1="${x0}" y1="${y0+52}" x2="${w/2}" y2="${y0+52}" stroke="#999" stroke-width="${sw}"/>`;}
  else if(o.kind==='bed'){const pw=w/2-12;s+=box(x0,y0,w,d,'#f3f1ec','#777');s+=box(x0+8,y0+8,pw,30,'#fff','#999');s+=box(4,y0+8,pw,30,'#fff','#999');
    s+=`<line x1="${x0}" y1="${y0+52}" x2="${w/2}" y2="${y0+52}" stroke="#999" stroke-width="${sw}"/>`;}
  else {s+=box(x0,y0,w,d,'rgba(255,255,255,.92)');s+=`<line x1="${x0}" y1="${d/2}" x2="${w/2}" y2="${d/2}" stroke="#111" stroke-width="${4.5*K}"/>`;}
  return s;}
/* 이름 글자: 기물 겉 상자 안에 들어가게 — 가로로 안 들어가면 세로로 세우고, 그래도 크면 줄인다 */
function label(o){const f=fp(o),n=o.n,len=[...n].reduce((a,c)=>a+(/[\x00-\x7f]/.test(c)?.58:1),0)||1;
  let fs=Math.max(11*K,Math.min(14*K,Math.max(o.w,o.d)/5)),vert=false;
  if(len*fs>f.w*.9){ if(f.d>f.w*1.15&&len*fs<=f.d*.9) vert=true;
    else { vert=f.d>f.w*1.15; fs=Math.max(7*K,Math.min(fs,(vert?f.d:f.w)*.9/len)); } }
  const t=len*fs>(vert?f.d:f.w)*1.05?[...n].slice(0,Math.max(2,Math.floor((vert?f.d:f.w)*.9/fs)-1)).join('')+'…':n;
  return `<text x="0" y="${fs*.36}" font-size="${fs}" text-anchor="middle" font-weight="700" fill="#111" pointer-events="none" paint-order="stroke" stroke="rgba(255,255,255,.85)" stroke-width="${fs*.22}"${vert?' transform="rotate(-90)"':''}>${esc(t)}</text>`;}
function grp(o,i,on){const bad=items.some(p=>p!==o&&overlap(o,p));
  let g=`<g class="it" data-i="${i}" transform="translate(${o.cx} ${o.cy})"><g transform="rotate(${o.r})">${shape(o)}`;
  if(bad||on) g+=`<rect x="${-o.w/2}" y="${-o.d/2}" width="${o.w}" height="${o.d}" fill="none" stroke="${bad?'#d12b2b':'#111'}" stroke-width="${2.6*K}" ${bad?`stroke-dasharray="${6*K} ${4*K}"`:''}/>`;
  if(on){
    /* 돌리기 손잡이: 오른쪽 아래 모서리 바깥 한 곳 — 잡고 끌면 부드럽게 돈다 */
    const hr=14*K,hx=o.w/2+17*K,hy=o.d/2+17*K;
    g+=`<g data-act="rot" transform="translate(${hx} ${hy}) rotate(${-o.r})" style="cursor:grab"><circle r="${hr}" fill="#fff" stroke="#111" stroke-width="${2*K}"/>`+
       `<path d="M${hr*.5} ${-hr*.35} A${hr*.55} ${hr*.55} 0 1 0 ${hr*.55} ${hr*.2}" fill="none" stroke="#111" stroke-width="${2.2*K}"/>`+
       `<path d="M${hr*.18} ${-hr*.62} L${hr*.72} ${-hr*.62} L${hr*.58} ${-hr*.05}Z" fill="#111"/></g>`;
    g+=`<g data-act="del" transform="translate(${-o.w/2-16*K} ${-o.d/2-16*K}) rotate(${-o.r})" style="cursor:pointer"><circle r="${13*K}" fill="#fff" stroke="#111" stroke-width="${2*K}"/><line x1="${-6*K}" y1="0" x2="${6*K}" y2="0" stroke="#111" stroke-width="${3*K}"/></g>`;
    if(o.home) [[1,-1],[1,1],[-1,1],[-1,-1]].forEach(([sx,sy])=>{const a=12*K;g+=`<rect data-act="rs" data-sx="${sx}" data-sy="${sy}" x="${sx*o.w/2-a/2}" y="${sy*o.d/2-a/2}" width="${a}" height="${a}" fill="#fff" stroke="#111" stroke-width="${2*K}" style="cursor:nwse-resize"/>`;});}
  g+=`</g>${label(o)}</g>`;
  return g;}
function draw(){
  const W=world(), cw=Math.max(280,plan.clientWidth||600), chMax=window.innerHeight*.7;
  const K0=Math.max(W.w*1.2/cw,W.d*1.2/chMax), pad=Math.max(Math.max(W.w,W.d)*.04,56*K0);
  let vb=[-pad,-pad,W.w+2*pad,W.d+2*pad]; if(act&&act.t==='room')vb=[act.vb0[0],act.vb0[1],act.vb0[2]*act.f,act.vb0[3]*act.f]; K=Math.max(vb[2]/cw,vb[3]/chMax);

  if(bg&&!bg.cmpp){sv.setAttribute('viewBox',[0,0,bg.img.width,bg.img.height].join(' '));
    $('g5bg').innerHTML=`<image href="${bg.url}" x="0" y="0" width="${bg.img.width}" height="${bg.img.height}"/>`;
    const r=bg.img.width/120;$('g5lay').innerHTML=calPts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="#d12b2b"/>`).join('')+(calPts.length===2?`<line x1="${calPts[0].x}" y1="${calPts[0].y}" x2="${calPts[1].x}" y2="${calPts[1].y}" stroke="#d12b2b" stroke-width="${r*.6}"/>`:'');
    sv.style.cursor='crosshair';$('g5elev').innerHTML='';$('g5enote').textContent='평면도 축척을 맞추면 벽 그림이 나옵니다.';return;}
  sv.style.cursor='';sv.setAttribute('viewBox',vb.join(' '));
  let b='';
  if(bg) b+=`<image href="${bg.url}" x="0" y="0" width="${W.w}" height="${W.d}" opacity=".85"/>`;
  else { for(let v=0;v<=W.w;v+=50) b+=`<line x1="${v}" y1="0" x2="${v}" y2="${W.d}" stroke="${v%100?'#f0ede7':'#e4e0d7'}" stroke-width="${K}"/>`;
    for(let v=0;v<=W.d;v+=50) b+=`<line x1="0" y1="${v}" x2="${W.w}" y2="${v}" stroke="${v%100?'#f0ede7':'#e4e0d7'}" stroke-width="${K}"/>`;
    b+=`<rect x="0" y="0" width="${W.w}" height="${W.d}" fill="none" stroke="#111" stroke-width="${4*K}"/>`; }
  /* 벽에 세워 보기에서 고른 벽 */
  const wl=curWall(),WL={top:[0,0,W.w,0],right:[W.w,0,W.w,W.d],bottom:[0,W.d,W.w,W.d],left:[0,0,0,W.d]}[wl];
  b+=`<line x1="${WL[0]}" y1="${WL[1]}" x2="${WL[2]}" y2="${WL[3]}" stroke="#d12b2b" stroke-width="${7*K}" stroke-linecap="round" opacity=".85"/>`;
  $('g5bg').innerHTML=b;
  let g='';items.forEach((o,i)=>{if(i!==sel)g+=grp(o,i,false);}); if(items[sel])g+=grp(items[sel],sel,true);
  if(!bg){const hr=11*K,fs=14*K,w=W.w,d=W.d,off=20*K,hd=(ax,ay,x,y,cur)=>`<g data-act="room" data-ax="${ax}" data-ay="${ay}" style="cursor:${cur}"><circle cx="${x}" cy="${y}" r="${hr*2.2}" fill="transparent"/><circle cx="${x}" cy="${y}" r="${hr}" fill="#111" stroke="#fff" stroke-width="${2*K}"/></g>`;

WALLS.forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.dataset.w=k;b.onclick=()=>{wall=k;draw();};$('g5wall').appendChild(b);});

const pt=e=>{const m=sv.getScreenCTM().inverse(),q=sv.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(m);};

  const i=+t.dataset.i; if(sel!==i){sel=i;if(!items[i].home)wall='';draw();}
  act={t:'mv',o:items[i],dx:p.x-items[i].cx,dy:p.y-items[i].cy}; sv.setPointerCapture(e.pointerId); e.preventDefault();});
sv.addEventListener('pointermove',e=>{if(!act)return;const p=pt(e);
  if(act.t==='room'){const sn=v=>Math.round(v/10)*10,u=act.u,b=act.vb0,pad=-b[0];if(act.ax)R.w=Math.max(200,Math.min(800,sn(act.w0+(e.clientX-act.x0)*u)));if(act.ay)R.d=Math.max(200,Math.min(800,sn(act.d0+(e.clientY-act.y0)*u)));
    act.f=Math.max(act.f,(R.w+2*pad)/b[2],(R.d+2*pad)/b[3]);place();items.forEach(clamp);draw();return;}
  const o=act.o;o.moved=1;

  else if(act.t==='rot'){let a=((Math.atan2(p.y-o.cy,p.x-o.cx)*180/Math.PI-act.a0)%360+360)%360;const n=Math.round(a/90)*90;if(Math.abs(a-n)<4)a=n%360;o.r=Math.round(a);}
  else {const vx=p.x-act.fx,vy=p.y-act.fy,u=rot(vx,vy,-o.r);o.w=Math.round(Math.max(30,Math.min(400,u[0]*act.sx)));o.d=Math.round(Math.max(20,Math.min(300,u[1]*act.sy)));
    const v=rot(act.sx*o.w/2,act.sy*o.d/2,o.r);o.cx=act.fx+v[0];o.cy=act.fy+v[1];}

const end=()=>{if(act){const wasRoom=act.t==='room';act=null;if(wasRoom)roomOn();draw();keep();}};sv.addEventListener('pointerup',end);sv.addEventListener('pointercancel',end);
function selbar(){const b=$('g5sel'),o=items[sel];

  $('g5ok').onclick=()=>{const L=+$('g5len').value/(+$('g5u').value);if(!(L>0))return;bg.cmpp=L/px;$('g5cal').hidden=true;items=items.filter(o=>!o.home);items.forEach(clamp);pend.forEach(x=>putItem(x[0],x[1],x[2],x[3]));pend=[];$('g5link').hidden=true;draw();$('g5plan').scrollIntoView({block:'center',behavior:'smooth'});};
  $('g5re').onclick=()=>{calStart();draw();};setTimeout(()=>{$('g5cal').scrollIntoView({block:'center',behavior:'smooth'});$('g5len').focus();},50);}
PRE.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.n;b.onclick=()=>{R={w:p.w,d:p.d};rt=p.t;bg=null;pend=[];shared=false;$('g5link').hidden=true;$('g5cal').hidden=true;sel=-1;

function putItem(n,w,d,h){const W=world(),o={id:++uid,n:n||'기물',w,d,h:h||0,r:0,cx:W.w/2,cy:W.d/2};clamp(o);

$('g5save').onclick=()=>{const W=world(),S=Math.min(4,1600/Math.max(W.w,W.d)),c=document.createElement('canvas');c.width=Math.round(W.w*S);c.height=Math.round(W.d*S)+40;

    x.fillStyle='#111';x.font=`700 ${Math.max(12,Math.min(18,Math.max(o.w,o.d)*S/6))}px "Noto Sans KR",sans-serif`;x.textAlign='center';x.fillText(o.n,o.cx*S,o.cy*S+5);});
  x.fillStyle='#555';x.font='14px "Noto Sans KR",sans-serif';x.textAlign='left';x.fillText('조선의 목가구 · 우리 집에 놓아 보기 · 가로 '+Math.round(W.w)+'cm × 세로 '+Math.round(W.d)+'cm',8,c.height-14);
