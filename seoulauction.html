const won=v=>v==null?'':(v>=100000000?(v/100000000).toLocaleString('ko-KR',{maximumFractionDigits:2})+'억원':(v/10000).toLocaleString('ko-KR')+'만원');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KINDS=[...new Set(ITEMS.map(i=>i.kind))];
const SALES=[...new Map(ITEMS.map(i=>[i.code,{code:i.code,sale:i.sale,date:i.date}])).values()].sort((a,b)=>a.date.localeCompare(b.date));
const st={kind:'',code:''};
const sold=ITEMS.filter(i=>i.status==='낙찰');
document.getElementById('lead').innerHTML=[
 `서울옥션 2026년 경매 ${SALES.length}회에 나온 목가구·목기 <b>${ITEMS.length}</b>점`,
 `<b>${sold.length}</b>점 낙찰, ${ITEMS.length-sold.length}점 유찰 — 낙찰률 ${Math.round(sold.length/ITEMS.length*100)}%`,
 `아래 단추로 기종과 경매 회차를 골라 볼 수 있습니다.`
].map(s=>`<li>${s}</li>`).join('');
function bar(){
 const b=document.getElementById('bar');
 b.innerHTML=`<button data-k="" class="${st.kind?'':'on'}">전체 ${ITEMS.length}</button>`+
  KINDS.map(k=>`<button data-k="${esc(k)}" class="${st.kind===k?'on':''}">${esc(k)} ${ITEMS.filter(i=>i.kind===k).length}</button>`).join('')+
  '<span style="flex-basis:100%;height:2px"></span>'+
  `<button data-s="" class="${st.code?'':'on'}">모든 회차</button>`+
  SALES.map(s=>`<button data-s="${s.code}" class="${st.code===s.code?'on':''}">${esc(s.sale)}</button>`).join('');
}
function draw(){
 bar();
 const L=ITEMS.filter(i=>(!st.kind||i.kind===st.kind)&&(!st.code||i.code===st.code));
 document.getElementById('grid').innerHTML=L.map(i=>`<article class="card">
  <a class="ph" href="https://www.seoulauction.com/auction-list/results" target="_blank" rel="noopener"><img loading="lazy" src="${esc(i.img)}" alt=""></a>
  <div class="b"><h3>${esc(i.name)}</h3>
  <div class="mt">LOT ${i.lot} · ${esc(i.size||'치수 미상')}</div>
  <div class="pr">${i.est_lo?'추정가 '+won(i.est_lo)+' ~ '+won(i.est_hi):'추정가 비공개'}<br>${i.hammer?'<span class="hm">낙찰 <b>'+won(i.hammer)+'</b></span>':'<span class="no">유찰</span>'}</div>
  <div class="sl">${esc(i.sale)} · ${i.date.replace(/-/g,'. ')}</div></div></article>`).join('');
}
document.getElementById('bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.k!=null)st.kind=b.dataset.k; if(b.dataset.s!=null)st.code=b.dataset.s; draw();});
draw();
</script>
